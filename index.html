  }

  h+='<div class="seg" style="margin-top:12px">'+
     ['gen','kind','best'].map(k=>{
       const nm={gen:"世代順",kind:"分類順",best:"出来栄え順"}[k];
       return '<button data-dsort="'+k+'" class="'+(S.sortDex===k?"on":"")+'">'+nm+'</button>';
     }).join("")+'</div>';
  h+='<div class="seg"><button data-dkind="all" class="'+(S.dexKind==="all"?"on":"")+'">すべて</button>'+
     KINDS.map(k=>'<button data-dkind="'+k.id+'" class="'+(S.dexKind===k.id?"on":"")+'">'+k.s+'</button>').join("")+'</div>';

  let list=RECIPES.slice();
  if(S.dexKind!=="all") list=list.filter(r=>r.k===S.dexKind);
  if(S.sortDex==="gen")       list.sort((a,b)=>a.g-b.g||KIDX[a.k]-KIDX[b.k]);
  else if(S.sortDex==="kind") list.sort((a,b)=>KIDX[a.k]-KIDX[b.k]||a.g-b.g);
  else                        list.sort((a,b)=>dexBest(b.id)-dexBest(a.id)||b.g-a.g);

  let cur=null, hide=false;
  list.forEach(r=>{
    if(S.sortDex==="gen"&&cur!==r.g){ cur=r.g;
      const grp=RECIPES.filter(x=>x.g===r.g), got=grp.filter(x=>dexBest(x.id)>=0).length;
      h+=foldHead("dex_g"+r.g,GENS[r.g-1],got+"／"+grp.length,true); hide=folded("dex_g"+r.g); }
    if(S.sortDex==="kind"&&cur!==r.k){ cur=r.k;
      h+=foldHead("dex_k"+r.k,KNAME[r.k]+(kindDone(r.k)?' <span class="mini ok">制覇</span>':''),
        kindGot(r.k)+"／"+kindList(r.k).length+"　"+KINDS[KIDX[r.k]].note,true); hide=folded("dex_k"+r.k); }
    if(hide) return;
    const d=S.dex[r.id];
    if(!d){
      h+='<div class="card locked" data-detail="'+r.id+'"><div class="row">'+wIcon(r,null,"",true)+
        '<div style="flex:1"><div class="ttl">'+(unlocked(r)?r.n:"？？？")+'</div>'+
        '<div class="mini">'+(unlocked(r)?"未鍛造":rankName(r.rank)+"から打てる")+'</div></div></div></div>';
      return;
    }
    const gi=gradeIdx(d.best), g=GRADES[gi];
    h+='<div class="card" data-detail="'+r.id+'"><div class="row">'+wIcon(r,gi)+
      '<div style="flex:1;min-width:0"><div class="row" style="gap:4px;margin-bottom:1px">'+
      '<span class="grade" style="color:'+g.c+'">'+g.n+'</span><span class="tag">'+KNAME[r.k]+'</span></div>'+
      '<div class="ttl">'+r.n+'</div>'+
      '<div class="mini">最高の出来 '+d.best+'　'+d.count+'本</div></div><span class="mini">›</span></div></div>';
  });
  h+='<div class="note">札をおすと大きな絵と詳しい内容が見られます。等級は打ち手の腕で決まります。神品は、すべて会心で打ち切ったうえに名工の金床と図鑑のご褒美が要ります。</div>';
  return h;

/* ══════════ 音 ══════════
   音源は持たない。Web Audio で都節音階（レ・ミ♭・ソ・ラ・シ♭）を組み立てて鳴らす。
   場面は三つ。常の場／探索／鍛造中。小節の切れ目で入れ替わる */
const SCALE=[0,1,5,7,8];                       /* 都節。根音は D */
const ROOT=62;                                  /* MIDI の D4 */
const VOLS=[0,0.06,0.13,0.22];
const SND={ac:null,master:null,timer:null,scene:"base",want:"base",next:0,step:0,noise:null,started:false};
const midi=n=>440*Math.pow(2,(n-69)/12);
function scaleNote(deg,oct){ return ROOT+SCALE[((deg%5)+5)%5]+12*(oct||0)+12*Math.floor(deg/5); }
function sndVol(){ return S.snd.on?VOLS[S.snd.vol]||0:0; }
function makeNoise(ac){
  const b=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function pluck(t,freq,dur,g,type,detune){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type=type||"triangle"; o.frequency.value=freq; if(detune) o.detune.value=detune;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,g),t+0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
function pad(t,freq,dur,g){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain(), f=ac.createBiquadFilter();
  o.type="sine"; o.frequency.value=freq;
  f.type="lowpass"; f.frequency.value=700;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.linearRampToValueAtTime(g,t+dur*0.35);
  gn.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
function hit(t,g,cut,dur){
  const ac=SND.ac; if(!ac) return;
  const src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
  src.buffer=SND.noise; f.type="lowpass"; f.frequency.value=cut;
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(gn); gn.connect(SND.master); src.start(t); src.stop(t+dur+0.02);
}
/* 炉の低い唸り */
function rumble(t,dur,g){
  const ac=SND.ac; if(!ac) return;
  const src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
  src.buffer=SND.noise; src.loop=true;
  f.type="lowpass"; f.frequency.value=150;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.linearRampToValueAtTime(g,t+dur*0.3);
  gn.gain.linearRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(gn); gn.connect(SND.master); src.start(t); src.stop(t+dur+0.05);
}
/* 火花が爆ぜる音。細い帯域のごく短い雑音 */
function crackle(t,g){
  const ac=SND.ac; if(!ac) return;
  const src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
  src.buffer=SND.noise; src.playbackRate.value=0.7+Math.random()*1.6;
  f.type="bandpass"; f.frequency.value=1800+Math.random()*4200; f.Q.value=3+Math.random()*7;
  const vol=(g||0.10)*(0.35+Math.random()*0.65), d=0.012+Math.random()*0.035;
  gn.gain.setValueAtTime(vol,t);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(f); f.connect(gn); gn.connect(SND.master); src.start(t); src.stop(t+d+0.02);
}
/* 金属の余韻。倍音が整数比から外れるほど鐘らしくなる */
function bell(t,freq,g,dur,type){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,g),t+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
/* 相槌。拍を知らせる小槌の音。構えの拍は低く、打ち始めてからは高く鳴る */
function sfxTick(lead){
  const ac=SND.ac; if(!ac||!S.snd.on||ac.state!=="running") return;
  const t=ac.currentTime+0.002;
  hit(t,lead?0.045:0.075,9000,0.016);
  bell(t,lead?1150:1560,lead?0.028:0.048,0.13,"triangle");
}
/* 槌を打った音。会心がいちばん澄んで長く伸びる */
function sfxHammer(sc){
  const ac=SND.ac; if(!ac||!S.snd.on||ac.state!=="running") return;
  const t=ac.currentTime+0.002;
  if(sc>=100){
    hit(t,0.30,11000,0.045);                       /* 打ち当たりの立ち上がり */
    taiko(t,0.13);                                  /* 芯の重み */
    [1,2.74,5.38,8.93,13.3].forEach((r,i)=>
      bell(t,660*r,0.115/(1+i*0.85),2.2-i*0.32,i>2?"sine":"triangle"));
    for(let i=0;i<10;i++) crackle(t+0.02+Math.random()*0.35,0.10);
  }else if(sc>=55){
    hit(t,0.20,7000,0.04);
    taiko(t,0.11);
    [1,2.74,5.38].forEach((r,i)=>bell(t,560*r,0.085/(1+i),0.85-i*0.2));
    for(let i=0;i<5;i++) crackle(t+0.02+Math.random()*0.2,0.08);
  }else{
    hit(t,0.16,900,0.09);                           /* 鈍く沈んだ音 */
    taiko(t,0.16);
    bell(t,180,0.05,0.22,"triangle");
  }
}

function taiko(t,g){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.16);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
  o.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+0.3);
  hit(t,g*0.5,1800,0.06);
}
const SCENES={
  base :{bpm:60, beat(k,t){
    if(k%16===0) pad(t,midi(ROOT-24),3.4,0.10);
    if(k%8===0)  pad(t,midi(scaleNote(k%16===0?0:2,-1)),2.0,0.055);
    if(k===0||k===6||k===10||k===13){
      const deg=[0,2,4,3,1][(Math.random()*5)|0];
      pluck(t,midi(scaleNote(deg,1)),1.5,0.07,"triangle");
    }
  }},
  quest:{bpm:98, beat(k,t){
    if(k%4===0) taiko(t,k%8===0?0.22:0.13);
    if(k%8===4) hit(t,0.05,5000,0.05);
    if(k%16===0) pad(t,midi(ROOT-24),1.9,0.09);
    if([2,5,7,11,14].indexOf(k%16)>=0){
      const deg=[0,1,2,4,3][(Math.random()*5)|0];
      pluck(t,midi(scaleNote(deg,1)),0.5,0.06,"square",-4);
    }
  }},
  /* 鍛造中は曲を鳴らさない。炉の唸りと、爆ぜる火花だけ */
  forge:{bpm:120,beat(k,t){
    if(k%16===0) rumble(t,3.6,0.075);
    const n=(Math.random()*3.2)|0;
    for(let i=0;i<n;i++) crackle(t+Math.random()*0.12);
  }}
};
function wantScene(){
  if(F.on) return "forge";
  if(S.tab==="quest"&&S.run) return "quest";
  return "base";
}
function sndTick(){
  const ac=SND.ac; if(!ac||ac.state!=="running") return;
  const sc=SCENES[SND.scene], spb=60/sc.bpm/4;
  while(SND.next<ac.currentTime+0.25){
    if(SND.step%16===0){
      const w=wantScene();
      if(w!==SND.scene){ SND.scene=w; SND.step=0; }
    }
    SCENES[SND.scene].beat(SND.step%16,SND.next);
    SND.next+=60/SCENES[SND.scene].bpm/4;
    SND.step++;
  }
}
function sndStart(){
  if(SND.started) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ SND.ac=new AC(); }catch(e){ return; }
  SND.noise=makeNoise(SND.ac);
  SND.master=SND.ac.createGain(); SND.master.gain.value=sndVol();
  SND.master.connect(SND.ac.destination);
  SND.next=SND.ac.currentTime+0.15; SND.step=0; SND.scene=wantScene();
  SND.timer=setInterval(sndTick,60);
  SND.started=true;
}
function sndResume(){ if(SND.ac&&SND.ac.state==="suspended") SND.ac.resume(); }
function sndApply(){
  if(!SND.master) return;
  const ac=SND.ac;
  SND.master.gain.cancelScheduledValues(ac.currentTime);
  SND.master.gain.linearRampToValueAtTime(sndVol(),ac.currentTime+0.25);
}
function paintSnd(){
  const b=document.getElementById("sndTop");
  if(b){ b.classList.toggle("on",S.snd.on); b.textContent=S.snd.on?"♪":"♪ 切"; }
  const t=document.getElementById("tSnd");
  if(t){ t.classList.toggle("on",S.snd.on); t.textContent=S.snd.on?"入":"切"; }
}
function toggleSnd(){
  S.snd.on=!S.snd.on;
  if(S.snd.on){ sndStart(); sndResume(); }
  sndApply(); paintSnd(); autoSave(true);
}
document.getElementById("sndTop").addEventListener("click",e=>{ e.stopPropagation(); toggleSnd(); });
document.getElementById("tSnd").addEventListener("click",e=>{ e.stopPropagation(); S.snd.on=!S.snd.on; paintSnd(); });

const TUT_FREE=["help","tutnext","tutend","tutstart","dailyget","snd","sndvol","reheat","savenow"];
function tutOn(){ return !!(S.tut&&S.tut.on&&TUT[S.tut.i]); }
function tutStep(){ return tutOn()?TUT[S.tut.i]:null; }
function tutStart(){
  S.tut={on:true,i:0};
  S.tab="forge"; S.ftab="forge"; S.pickOpen=null; S.smeltOpen=null; S.lastResult=null;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="forge"));
}
function tutEnd(){
  if(S.tut) S.tut.on=false;
  paintTut();
  toast("手ほどきを終わりました。右上の <b>？</b> からいつでも見直せます。","#6fd48a");
}
function tutNext(){
  if(!S.tut||!S.tut.on) return;
  S.tut.i++;
  if(S.tut.i>=TUT.length){ tutEnd(); return; }
  paintTut();
}
/* 進み具合の合図。画面ごとの処理から呼ぶ */
function tutEv(name,d){
  const st=tutStep(); if(!st) return;
  if(st.ev!==name) return;
  if(st.val!==undefined&&st.val!==d) return;
  tutNext();
}
/* その手順で受け付ける操作かどうか */
function tutAllow(a,b){
  if(TUT_FREE.includes(a)) return true;
  const st=tutStep(); if(!st) return true;
  return !!(st.ok&&st.ok(a,b));
}
let tutNopeT=0;
function tutNope(){
  const now=Date.now(); if(now-tutNopeT<1400) return; tutNopeT=now;
  toast("いまは下の案内のとおりに進めてください。","#7fb7c9");
}
function paintTut(){
  const bar=document.getElementById("tutbar"); if(!bar) return;
  const tb=document.getElementById("toasts");
  document.querySelectorAll(".tglow").forEach(el=>el.classList.remove("tglow"));
  const st=tutStep();
  if(!st){ bar.style.display="none"; bar.innerHTML=""; if(tb) tb.style.bottom=""; return; }
  bar.style.display="";
  const tx=(typeof st.txt==="function")?st.txt():st.txt;
  bar.innerHTML='<div class="tnum">手ほどき　'+(S.tut.i+1)+'／'+TUT.length+'</div>'+
    '<div class="ttxt">'+tx+'</div>'+
    '<div class="trow">'+
    (st.next?'<button class="tb2 go" data-act="tutnext" style="flex:1">'+(st.last?"はじめる":"次へ")+'</button>'
            :'<button class="tb2" data-act="tutnext">この手順をとばす</button>')+
    (st.last?'':'<button class="tb2" data-act="tutend" style="margin-left:auto">やめる</button>')+

}

  else if(a==="snd"){ toggleSnd(); render(); }
  else if(a==="sndvol"){ S.snd.vol=n; if(S.snd.on){ sndStart(); sndResume(); } sndApply(); autoSave(true); render(); }
  else if(a==="savenow"){ toast(saveGame()?"記録を控えた。":"控えを取れなかった。",saveGame()?"#6fd48a":"#e0645a"); }
  else if(a==="wipe"){
    askConfirm("記録を消す",
      '<div class="note">これまでの進み具合をすべて消して、はじめからやり直します。戻せません。</div>',
      "消す",()=>{ wipeSave(); resetGame(); S.tab="forge";
        document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="forge"));
        toast("炉に火を入れ直した。","#ffd166"); render(); });
  }
}
view.addEventListener("click",onAction);
dmodal.addEventListener("click",onAction);
document.getElementById("tutbar").addEventListener("click",onAction);
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  const st=tutStep();
  if(st&&st.tab&&b.dataset.tab!==st.tab){ tutNope(); return; }
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.tab=b.dataset.tab; S.hl=null; S.lastBuy=null; render();
  tutEv("tab",S.tab);
});
document.addEventListener("keydown",e=>{
  if(e.code==="Escape"){ if(dmodal.classList.contains("open")) closeDmodal(); if(modal.classList.contains("open")) closeModal(); return; }
  if(e.code==="Space"&&S.tab==="forge"&&F.on){ e.preventDefault(); strike(); }
});
/* 見えている高さを測って #app に渡す。
   iPhone のアドレス欄や、裏に回して戻したときのずれで下の帯が隠れるのを防ぐ。
   文字を打っている間は、出てきたキーボードで縮めてしまわないよう測り直さない */
function fitApp(){
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")) return;
  const vv=window.visualViewport;
  let h=window.innerHeight;
  if(vv&&Math.abs((vv.scale||1)-1)<0.01&&vv.height>0) h=Math.round(vv.height);
  if(h>0) document.documentElement.style.setProperty("--app-h",h+"px");
}
fitApp();
window.addEventListener("resize",()=>{ fitApp(); if(S.tab==="forge") setupCanvas(); scnSize(); });
window.addEventListener("orientationchange",()=>{ setTimeout(()=>{ fitApp();
  if(S.tab==="forge") setupCanvas(); scnSize(); },250); });
window.addEventListener("pageshow",()=>{ fitApp(); if(S.tab==="forge") setupCanvas(); scnSize(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) setTimeout(()=>{ fitApp();
  if(S.tab==="forge") setupCanvas(); scnSize(); },60); });
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",()=>{ fitApp(); if(S.tab==="forge") setupCanvas(); });
  window.visualViewport.addEventListener("scroll",fitApp);
}

/* ══════════ 入った日の褒美 ══════════
   切り替えは0時。日をまたいで続けて入ると日数が伸び、七日目でひと回りして一日目に戻る。
   一日空けても一日目から。中身は鍛冶の腕に応じて増えるので、後半でも細らない */
const DAILY_CYCLE=7;
const DAILY=[
  {g:1.0, coal:5},
  {g:1.7},
  {g:1.0, alloy:2},
  {g:1.4, coal:8},
  {g:1.2, stone:1},
  {g:1.4, alloy:3},
  {g:2.6, stone:3, acc:true}
];
const dailyGold=f=>Math.round((60+S.rank*70)*f);
function dayKeyOf(d){ return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function todayKey(){ return dayKeyOf(new Date()); }
function yesterKey(){ const d=new Date(); d.setDate(d.getDate()-1); return dayKeyOf(d); }
/* いまの腕前で扱えるいちばん上の鋼。三日目と六日目に配る */
function dailyAlloy(){ let k=GEN_ALLOY[0]; ALLOYS.forEach(a=>{ if(S.rank>=a.need) k=a.k; }); return k; }
/* 今日が何日目か。0 なら今日はもう受け取っている */
function dailyDay(){
  const d=S.daily||(S.daily={day:"",streak:0});
  if(d.day===todayKey()) return 0;
  return (d.day===yesterKey())?((d.streak||0)%DAILY_CYCLE)+1:1;
}
const dailyPending=()=>dailyDay()>0;
function dailyText(n){
  const G=DAILY[n-1], t=[fmt(dailyGold(G.g))+"金"];
  if(G.coal)  t.push(MAT.coal.n+" ×"+G.coal);
  if(G.alloy) t.push(MAT[dailyAlloy()].n+" ×"+G.alloy);
  if(G.stone) t.push("銘石 ×"+G.stone);
  if(G.acc)   t.push("根付 ×1");
  return t;
}
function showDaily(){
  const n=dailyDay(); if(!n) return;
  let h='<div class="mttl">今日の褒美</div>';
  h+='<div class="note" style="margin-bottom:8px">炉は毎日 0 時に火を入れ直します。続けて入ると中身が増え、'+
     DAILY_CYCLE+'日目でひと回り。一日空けると一日目に戻ります。</div>';
  h+='<div class="row wrap" style="gap:4px;margin-bottom:10px">'+
     DAILY.map((x,i)=>'<span class="tag"'+(i===n-1?' style="color:var(--hot);border-color:#6b4a1e"':'')+'>'+(i+1)+'日目</span>').join("")+'</div>';
  h+='<div class="card"><div class="ttl" style="margin-bottom:7px">'+n+'日目に受け取るもの</div>'+
     '<div class="row wrap" style="gap:6px">'+
     dailyText(n).map(x=>'<span class="tag" style="color:var(--hot);border-color:#6b4a1e">'+x+'</span>').join("")+
     '</div></div>';
  h+='<button class="btn" data-act="dailyget" style="width:100%;margin-top:12px">受け取る</button>';
  document.getElementById("dBody").innerHTML=h;
  dmodal.classList.add("open");
}
function takeDaily(){
  const n=dailyDay(); if(!n){ dmodal.classList.remove("open"); return; }
  const G=DAILY[n-1], got=[];
  const gold=dailyGold(G.g); S.gold+=gold; got.push(fmt(gold)+"金");
  if(G.coal){ S.mats.coal=(S.mats.coal||0)+G.coal; got.push(MAT.coal.n+" +"+G.coal); }
  if(G.alloy){ const k=dailyAlloy(); S.mats[k]=(S.mats[k]||0)+G.alloy; got.push(MAT[k].n+" +"+G.alloy); }
  if(G.stone){ S.meiStone+=G.stone; got.push("銘石 +"+G.stone); }
  if(G.acc){
    const A=ACCS[Math.floor(Math.random()*ACCS.length)];
    const x={uid:S.accUid++,id:A.id,q:70+Math.floor(Math.random()*26)};
    if(gainAcc(x)) got.push(A.n+"（"+accGrade(x).n+"）");
  }
  S.daily.streak=n; S.daily.day=todayKey();
  dmodal.classList.remove("open");
  toast("<b class='hot'>"+n+"日目の褒美</b>　"+got.join("／"),"#ffd166");
  autoSave(true); paintDailyBtn(); render();
}
function paintDailyBtn(){
  const b=document.getElementById("giftTop"); if(!b) return;
  b.style.display=dailyPending()?"":"none";
  b.classList.toggle("on",dailyPending());
}
document.getElementById("giftTop").addEventListener("click",showDaily);

/* ══════════ 開始 ══════════ */
const titleEl=document.getElementById("title");
function fmtWhen(t){
  const d=new Date(t), p=n=>("0"+n).slice(-2);
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+p(d.getHours())+":"+p(d.getMinutes());
}
/* 選ぶボタンの中に立ち姿を描く。コマ帯から1枚だけ切り出す */
function paintHeroPicks(root){
  (root||document).querySelectorAll('.hpick button,.heropick button').forEach(b=>{
    const k=b.dataset.hero||b.dataset.id, cv=b.querySelector("canvas");
    if(!k||!cv||!HERO[k]) return;
    b.classList.toggle("on", heroKey()===k);
    const im=heroImg[k];
    if(!im||!im.complete||!im.naturalWidth){ im&&im.addEventListener("load",()=>paintHeroPicks(root),{once:true}); return; }
    const g=cv.getContext("2d"); g.clearRect(0,0,cv.width,cv.height);
    g.imageSmoothingEnabled=false;
    const sc=Math.min(cv.width/HERO_CW, cv.height/HERO_CH);
    const dw=HERO_CW*sc, dh=HERO_CH*sc;
    g.drawImage(im, HERO[k].idle[0]*HERO_CW,0,HERO_CW,HERO_CH,
      (cv.width-dw)/2, cv.height-dh, dw, dh);
  });
}
function paintTitle(){
  const box=document.getElementById("tArt");
  if(box&&!box.innerHTML) box.innerHTML=art("katana","#ffd166");
  const d=readSave();
  const cont=document.getElementById("tCont"), wipe=document.getElementById("tWipe");
  if(d){
    const g=d.s||{};
    cont.style.display="";
    wipe.style.display="";
    document.getElementById("tContInfo").textContent=
      rankName(g.rank||1)+"　探索Lv"+(g.eLv||1)+"　"+fmt(g.gold||0)+"金　"+fmtWhen(d.t);
  }else{
    cont.style.display="none"; wipe.style.display="none";
  }
  const nt=document.getElementById("tNote");
  if(nt) nt.innerHTML=CAN_SAVE
    ?(d?"":"この入口には控えがありません。別のブラウザや前の版で遊んでいたなら、<b>控えの札</b>から移せます。")
    :'<span class="bad">この入口では控えが取れません。</span>遊んだあと、忘れずに札を書き出してください。';
  paintSnd();
  paintHeroPicks(titleEl);
}
function enterGame(){
  titleEl.classList.add("gone");
  setTimeout(()=>{ titleEl.style.display="none"; },500);
  if(S.snd.on) sndStart();
  sndResume();
  render();
  paintDailyBtn();
  requestAnimationFrame(loop);
  autoSave(true);
  /* 題字が引いてから褒美の窓を出す。手ほどきの最中は上の「褒」から取ってもらう */
  if(dailyPending()&&!tutOn()) setTimeout(showDaily,700);
  if(S.eqFix){ S.eqFix=false;
    setTimeout(()=>toast("武器の組み合わせの決まりが変わった。合わない装備を外した。探索の<b>支度</b>で選び直してくれ。","#ff9a3a"),1500); }
}
document.getElementById("tPick").addEventListener("click",e=>{
  const b=e.target.closest("button[data-hero]"); if(!b) return;
  S.hero=b.dataset.hero; paintHeroPicks(titleEl);
});
document.getElementById("tCont").addEventListener("click",()=>{
  if(!loadGame()){ resetGame(); }
  enterGame();
  setTimeout(()=>toast("炉に火を入れ直した。","#ffd166"),400);
});
document.getElementById("tNew").addEventListener("click",()=>{
  resetGame(); wipeSave(); tutStart(); enterGame();
  setTimeout(()=>toast("炉に火を入れた。下の案内にしたがって進めてくれ。","#ffd166"),400);
});
document.getElementById("tLoad").addEventListener("click",showSaveBox);
document.getElementById("tWipe").addEventListener("click",()=>{
  if(window.confirm("これまでの記録を消します。戻せません。よろしいですか。")){
    wipeSave(); paintTitle();
  }
});
fillOrders();
scnInit();
paintStatus();
paintTitle();
window.addEventListener("pagehide",()=>autoSave(true));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) autoSave(true); });
</script>
