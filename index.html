  SC.w=w; SC.h=h; SC.dpr=dpr;
  SC.cv.width=Math.round(w*dpr); SC.cv.height=Math.round(h*dpr);
  SC.cv.style.width=w+"px"; SC.cv.style.height=h+"px";
  SC.motes=[];
  for(let i=0;i<20;i++) SC.motes.push({x:Math.random()*w,y:Math.random()*h*0.8,
    v:0.25+Math.random()*0.9, s:0.7+Math.random()*1.7, p:Math.random()*6.28});
}
/* 走りの状態を画面へ写す。呼ぶのは render() の末尾だけ */
function scnSync(){
  if(!SC.ready) return;
  const R=S.run;
  const slot=document.getElementById("scnSlot");
  if(!R||!slot||S.tab!=="quest"){
    if(SC.wrap.parentNode!==document.body){ document.body.appendChild(SC.wrap); }
    SC.wrap.style.display="none";
    return;
  }
  SC.wrap.style.display="block";
  if(SC.wrap.parentNode!==slot) slot.appendChild(SC.wrap);
  scnSize();
  if(SC.area!==R.area){ SC.area=R.area; SC.scroll=0; SC.fx.length=0; }
  const F=SC.foe;
  if(R.enemy){
    if(!F.on||F.name!==R.enemy.n){
      const a=FOE_ART[R.enemy.n]||["quad",1];
      F.on=true; F.name=R.enemy.n; F.arch=a[0]; F.sc=a[1]; F.boss=!!R.enemy.boss;
      F.in=0; F.hitT=0; F.dieT=0; F.lunge=0;
    }
  }else if(F.on&&F.dieT<=0){ F.dieT=0.5; }
}
function scnReset(){
  if(!SC.ready) return;
  SC.scroll=0; SC.spd=0; SC.fx.length=0;
  SC.hitT=SC.hurtT=SC.winT=SC.fleeT=SC.restT=SC.shake=SC.flash=0;
  SC.foe.on=false; SC.foe.name=""; SC.foe.dieT=0; SC.foe.in=0;
}
function scnStrike(crit){ if(!SC.ready) return; SC.hitT=0.46; SC.crit=!!crit; }
function scnHurt(){ if(!SC.ready) return; SC.hurtT=0.42; SC.shake=1; SC.flash=1; SC.foe.lunge=1; }
function scnWin(){ if(!SC.ready) return; SC.winT=1.6; SC.hurtT=0; SC.hitT=0; }
function scnFlee(){ if(!SC.ready) return; SC.fleeT=1.4; SC.hurtT=0; SC.hitT=0; }
function scnRest(){ if(!SC.ready) return; SC.restT=1.1; }
function scnFoeHit(){ if(!SC.ready) return; SC.foe.hitT=0.22; }

/* ── 小物 ── */
function hrnd(a,b){ const x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); }
function tile(off,p,w,fn){
  const k0=Math.floor(off/p)-1, k1=Math.ceil((off+w)/p)+1;
  for(let k=k0;k<=k1;k++) fn(k,k*p-off);
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function spark(x,y,n,c,pw){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, v=(30+Math.random()*130)*pw;
    SC.fx.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:0.38+Math.random()*0.42,
      m:0.38+Math.random()*0.42,c:c,s:1+Math.random()*2});
  }
}

/* ── 背景の三層 ── */
function drawBack(g,th,w,h,gy){
  const sk=g.createLinearGradient(0,0,0,gy);
  sk.addColorStop(0,th.sky[0]); sk.addColorStop(1,th.sky[1]);
  g.fillStyle=sk; g.fillRect(0,0,w,gy+1);
  const off=SC.scroll;
  /* 遠景 */
  g.fillStyle=th.far;
  const K=th.kind;
  if(K==="tree"){
    g.beginPath(); g.moveTo(0,gy);
    for(let x=0;x<=w;x+=8){ const u=(x+off*0.14)/w;
      g.lineTo(x,gy-14-18*Math.abs(Math.sin(u*1.7))-7*Math.sin(u*5.1)); }
    g.lineTo(w,gy); g.closePath(); g.fill();
    tile(off*0.22,34,w,(k,x)=>{ const hh=16+hrnd(k,1)*16;
      g.beginPath(); g.moveTo(x,gy-4); g.lineTo(x+7,gy-4-hh); g.lineTo(x+14,gy-4); g.closePath(); g.fill(); });
  }else if(K==="beam"){
    tile(off*0.2,58,w,(k,x)=>{ const hh=26+hrnd(k,2)*14;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x,gy-hh); g.quadraticCurveTo(x+18,gy-hh-12,x+36,gy-hh);
      g.lineTo(x+36,gy); g.closePath(); g.fill(); });
  }else if(K==="crystal"){
    tile(off*0.18,40,w,(k,x)=>{ const hh=18+hrnd(k,3)*26;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x+8,gy-hh); g.lineTo(x+17,gy-hh*0.5); g.lineTo(x+24,gy); g.closePath(); g.fill(); });
  }else if(K==="basalt"){
    g.beginPath(); g.moveTo(0,gy);
    tile(off*0.12,110,w,(k,x)=>{ const hh=30+hrnd(k,4)*24;
      g.moveTo(x-28,gy); g.lineTo(x,gy-hh); g.lineTo(x+28,gy); });
    g.closePath(); g.fill();
    const lg=g.createLinearGradient(0,gy-30,0,gy);
    lg.addColorStop(0,"rgba(255,90,30,0)"); lg.addColorStop(1,"rgba(255,110,40,.22)");
    g.fillStyle=lg; g.fillRect(0,gy-30,w,30);
  }else if(K==="ruin"){
    tile(off*0.18,46,w,(k,x)=>{ const hh=14+hrnd(k,5)*34, wd=7+hrnd(k,6)*7;
      g.fillRect(x,gy-hh,wd,hh); });
  }else if(K==="shaft"){
    tile(off*0.2,26,w,(k,x)=>{ g.fillRect(x,0,9,gy); });
    const lg=g.createLinearGradient(0,gy-26,0,gy);
    lg.addColorStop(0,"rgba(60,220,160,0)"); lg.addColorStop(1,"rgba(60,220,160,.14)");
    g.fillStyle=lg; g.fillRect(0,gy-26,w,26);
  }else{ /* altar */
    for(let i=0;i<3;i++){
      g.globalAlpha=0.20+i*0.1;
      tile(off*(0.08+i*0.05),120,w,(k,x)=>{ const y=gy-52+i*15+hrnd(k,7+i)*8;
        g.beginPath(); g.ellipse(x+40,y,52,8,0,0,6.29); g.fill(); });
    }
    g.globalAlpha=1;
  }
  /* 地平の明かり。奥行きが出て、狩場ごとの色味もはっきりする */
  {
    const hg=g.createLinearGradient(0,gy-h*0.34,0,gy);
    hg.addColorStop(0,"rgba(0,0,0,0)");
    hg.addColorStop(1,hexA(th.ac,0.16));
    g.fillStyle=hg; g.fillRect(0,gy-h*0.34,w,h*0.34);
  }
  /* 中景 */
  g.fillStyle=th.mid;
  if(K==="tree"){
    tile(off*0.52,52,w,(k,x)=>{ const hh=34+hrnd(k,11)*30;
      g.beginPath(); g.moveTo(x-12,gy); g.lineTo(x,gy-hh); g.lineTo(x+12,gy); g.closePath(); g.fill();
      g.fillRect(x-2,gy-8,4,8); });
  }else if(K==="beam"){
    tile(off*0.55,64,w,(k,x)=>{ const hh=40+hrnd(k,12)*14;
      g.fillRect(x,gy-hh,5,hh); g.fillRect(x+34,gy-hh,5,hh); g.fillRect(x-3,gy-hh-6,45,7); });
  }else if(K==="crystal"){
    tile(off*0.55,46,w,(k,x)=>{ const hh=22+hrnd(k,13)*34;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x+6,gy-hh); g.lineTo(x+14,gy-hh*0.55); g.lineTo(x+20,gy); g.closePath(); g.fill();
      g.save(); g.globalAlpha=.5; g.fillStyle=th.ac; g.shadowColor=th.ac; g.shadowBlur=9;
      g.beginPath(); g.moveTo(x+4,gy-hh*0.75); g.lineTo(x+6,gy-hh); g.lineTo(x+9,gy-hh*0.7); g.closePath(); g.fill(); g.restore();
      g.fillStyle=th.mid; });
  }else if(K==="basalt"){
    tile(off*0.55,50,w,(k,x)=>{ const hh=26+hrnd(k,14)*28;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x+3,gy-hh); g.lineTo(x+13,gy-hh*0.8); g.lineTo(x+17,gy); g.closePath(); g.fill(); });
  }else if(K==="ruin"){
    tile(off*0.55,72,w,(k,x)=>{ const hh=30+hrnd(k,15)*30;
      g.fillRect(x,gy-hh,10,hh); g.fillRect(x-3,gy-hh-5,16,5);
      if(hrnd(k,16)>0.55) g.fillRect(x+26,gy-7,26,7); });
  }else if(K==="shaft"){
    tile(off*0.55,58,w,(k,x)=>{ g.fillRect(x,0,4,gy-24-hrnd(k,17)*20);
      g.fillRect(x-9,gy-34,22,5); });
  }else{
    tile(off*0.5,86,w,(k,x)=>{ const hh=18+hrnd(k,18)*16;
      g.fillRect(x,gy-hh,30,hh); g.fillRect(x-4,gy-hh-5,38,5); });
  }
  /* 地面 */
  const gg=g.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,th.g1); gg.addColorStop(1,th.g2);
  g.fillStyle=gg; g.fillRect(0,gy,w,h-gy);
  g.fillStyle="rgba(0,0,0,.35)"; g.fillRect(0,gy,w,1);
  g.fillStyle="rgba(255,255,255,.05)";
  tile(off,17,w,(k,x)=>{ const y=gy+3+hrnd(k,21)*(h-gy-5);
    g.fillRect(x+hrnd(k,22)*9,y,2+hrnd(k,23)*4,1); });
}
function drawMotes(g,th,w,h,dt){
  const kind=th.mote;
  const col={leaf:"#7fa06a",dust:"#c0a070",glim:"#9fd8e8",ember:"#ff8a3a",star:"#d8c8ff",mote:"#ffe6a8"}[kind]||"#fff";
  SC.motes.forEach(m=>{
    m.x-=(m.v*24+ (kind==="ember"?0:0))*dt*(0.4+SC.spd*0.9);
    m.p+=dt*1.6;
    if(kind==="ember") m.y-=dt*16; else m.y+=Math.sin(m.p)*0.22;
    if(m.x<-6){ m.x=w+6; m.y=Math.random()*h*0.8; }
    if(m.y<-6) m.y=h*0.85;
    g.globalAlpha=0.16+0.3*Math.abs(Math.sin(m.p));
    g.fillStyle=col;
    g.beginPath(); g.arc(m.x,m.y,m.s,0,6.29); g.fill();
  });
  g.globalAlpha=1;
}

/* ── 敵の影絵 ── */
function foeShape(g,arch,hh,ac,t){
  /* 原点は足元の中央。左（主人公の側）を向く */
  const u=hh, ink="#08080b";
  g.fillStyle=ink; g.strokeStyle=ac; g.lineWidth=1.1;
  const eye=(x,y,r)=>{ g.save(); g.fillStyle=ac; g.shadowColor=ac; g.shadowBlur=8;
    g.beginPath(); g.ellipse(x,y,r,r*0.62,0,0,6.29); g.fill(); g.restore(); };
  const bob=Math.sin(t*2.6)*u*0.018;
  g.translate(0,bob);
  if(arch==="quad"||arch==="boar"){
    const bw=u*(arch==="boar"?0.92:0.84), bh=u*(arch==="boar"?0.42:0.36);
    g.beginPath(); g.ellipse(0,-u*0.50,bw*0.5,bh*0.5,0,0,6.29); g.fill();
    for(let i=0;i<4;i++){ const lx=-bw*0.34+i*bw*0.22;
      g.fillRect(lx,-u*0.34,u*0.075,u*0.34); }
    g.beginPath(); g.ellipse(-bw*0.52,-u*(arch==="boar"?0.52:0.62),u*0.19,u*0.16,0,0,6.29); g.fill();
    if(arch==="boar"){
      g.beginPath(); g.moveTo(-bw*0.66,-u*0.48); g.lineTo(-bw*0.80,-u*0.60); g.lineTo(-bw*0.64,-u*0.56); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-bw*0.60,-u*0.44); g.lineTo(-bw*0.74,-u*0.54); g.lineTo(-bw*0.58,-u*0.52); g.closePath(); g.fill();
    }else{
      g.beginPath(); g.moveTo(-bw*0.58,-u*0.74); g.lineTo(-bw*0.52,-u*0.90); g.lineTo(-bw*0.44,-u*0.72); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-bw*0.44,-u*0.74); g.lineTo(-bw*0.38,-u*0.88); g.lineTo(-bw*0.32,-u*0.72); g.closePath(); g.fill();
    }
    g.beginPath(); g.moveTo(bw*0.46,-u*0.56); g.quadraticCurveTo(bw*0.74,-u*0.74,bw*0.66,-u*0.34);
    g.lineTo(bw*0.52,-u*0.46); g.closePath(); g.fill();
    eye(-bw*0.58,-u*0.62,u*0.045);
  }else if(arch==="human"){
    g.fillRect(-u*0.16,-u*0.40,u*0.11,u*0.40);
    g.fillRect(u*0.04,-u*0.40,u*0.11,u*0.40);
    g.beginPath(); g.moveTo(-u*0.20,-u*0.40); g.lineTo(-u*0.15,-u*0.76);
    g.lineTo(u*0.15,-u*0.76); g.lineTo(u*0.20,-u*0.40); g.closePath(); g.fill();
    g.beginPath(); g.arc(0,-u*0.86,u*0.115,0,6.29); g.fill();
    g.save(); g.translate(-u*0.16,-u*0.70); g.rotate(-0.5+Math.sin(t*2.2)*0.06);
    g.fillRect(-u*0.05,-u*0.04,u*0.10,u*0.34);
    g.fillRect(-u*0.03,-u*0.40,u*0.06,u*0.38); g.restore();
    g.beginPath(); g.moveTo(u*0.12,-u*0.80); g.quadraticCurveTo(u*0.42,-u*0.50,u*0.20,-u*0.06);
    g.lineTo(u*0.10,-u*0.30); g.closePath(); g.fill();
    eye(-u*0.05,-u*0.87,u*0.035); eye(u*0.05,-u*0.87,u*0.035);
  }else if(arch==="swarm"){
    for(let i=0;i<6;i++){
      const px=(hrnd(i,31)-0.5)*u*0.9, py=-u*(0.30+hrnd(i,32)*0.72)+Math.sin(t*4+i)*u*0.05;
      const s=u*(0.10+hrnd(i,33)*0.07);
      g.beginPath(); g.moveTo(px,py);
      g.quadraticCurveTo(px-s*1.5,py-s*0.9+Math.sin(t*9+i)*s*0.4,px-s*2.1,py+s*0.3);
      g.quadraticCurveTo(px-s*1.1,py+s*0.2,px,py+s*0.5);
      g.quadraticCurveTo(px+s*1.1,py+s*0.2,px+s*2.1,py+s*0.3);
      g.quadraticCurveTo(px+s*1.5,py-s*0.9-Math.sin(t*9+i)*s*0.4,px,py); g.fill();
      if(i%2===0) eye(px,py+s*0.1,u*0.022);
    }
  }else if(arch==="bug"){
    for(let i=0;i<6;i++){ const sx=(i<3?-1:1), k=i%3;
      g.save(); g.translate(0,-u*0.30); g.rotate(sx*(0.5+k*0.34)+Math.sin(t*5+i)*0.07);
      g.fillRect(-u*0.02,0,u*0.045,u*0.42); g.restore(); }
    g.beginPath(); g.ellipse(u*0.10,-u*0.42,u*0.30,u*0.22,0,0,6.29); g.fill();
    g.beginPath(); g.ellipse(-u*0.24,-u*0.42,u*0.18,u*0.16,0,0,6.29); g.fill();
    g.beginPath(); g.ellipse(-u*0.46,-u*0.40,u*0.12,u*0.11,0,0,6.29); g.fill();
    g.beginPath(); g.moveTo(-u*0.54,-u*0.44); g.lineTo(-u*0.70,-u*0.54); g.lineTo(-u*0.52,-u*0.38); g.closePath(); g.fill();
    eye(-u*0.48,-u*0.44,u*0.032); eye(-u*0.44,-u*0.36,u*0.032);
  }else if(arch==="golem"){
    g.fillRect(-u*0.20,-u*0.34,u*0.15,u*0.34);
    g.fillRect(u*0.06,-u*0.34,u*0.15,u*0.34);
    g.fillRect(-u*0.28,-u*0.80,u*0.56,u*0.48);
    g.fillRect(-u*0.40,-u*0.74,u*0.13,u*0.40);
    g.fillRect(u*0.28,-u*0.74,u*0.13,u*0.40);
    g.fillRect(-u*0.15,-u*1.00,u*0.30,u*0.22);
    g.beginPath(); g.moveTo(-u*0.30,-u*0.80); g.lineTo(-u*0.44,-u*0.96); g.lineTo(-u*0.20,-u*0.86); g.closePath(); g.fill();
    eye(-u*0.06,-u*0.90,u*0.04); eye(u*0.06,-u*0.90,u*0.04);
  }else if(arch==="dragon"){
    g.beginPath(); g.moveTo(u*0.34,-u*0.44);
    g.quadraticCurveTo(u*0.80,-u*0.30,u*0.72,-u*0.02);
    g.quadraticCurveTo(u*0.60,-u*0.26,u*0.30,-u*0.34); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(0,-u*0.52,u*0.36,u*0.24,0,0,6.29); g.fill();
    g.fillRect(-u*0.22,-u*0.32,u*0.09,u*0.32);
    g.fillRect(u*0.10,-u*0.32,u*0.09,u*0.32);
    g.beginPath(); g.moveTo(-u*0.06,-u*0.70); g.quadraticCurveTo(-u*0.44,-u*0.86,-u*0.46,-u*1.04);
    g.quadraticCurveTo(-u*0.30,-u*0.80,-u*0.02,-u*0.62); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(-u*0.50,-u*1.06,u*0.15,u*0.10,-0.3,0,6.29); g.fill();
    g.beginPath(); g.moveTo(-u*0.50,-u*1.14); g.lineTo(-u*0.44,-u*1.32); g.lineTo(-u*0.38,-u*1.12); g.closePath(); g.fill();
    const wf=Math.sin(t*3.1)*u*0.10;
    g.beginPath(); g.moveTo(u*0.02,-u*0.68);
    g.lineTo(u*0.26,-u*1.16-wf); g.lineTo(u*0.48,-u*0.86-wf*0.5); g.lineTo(u*0.20,-u*0.64); g.closePath(); g.fill();
    eye(-u*0.56,-u*1.08,u*0.035);
  }else{ /* wisp */
    const fy=-u*0.66+Math.sin(t*1.9)*u*0.05;
    g.save(); g.globalAlpha=.55;
    g.beginPath(); g.moveTo(-u*0.20,fy); g.quadraticCurveTo(-u*0.04,fy+u*0.34,u*0.10+Math.sin(t*2.4)*u*0.06,fy+u*0.62);
    g.quadraticCurveTo(u*0.14,fy+u*0.30,u*0.22,fy); g.closePath(); g.fill(); g.restore();
    g.beginPath(); g.ellipse(0,fy,u*0.25,u*0.27,0,0,6.29); g.fill();
    g.save(); g.globalAlpha=.20; g.fillStyle=ac; g.shadowColor=ac; g.shadowBlur=14;
    g.beginPath(); g.arc(0,fy,u*0.30,0,6.29); g.fill(); g.restore();
    eye(-u*0.09,fy-u*0.03,u*0.04); eye(u*0.07,fy-u*0.03,u*0.04);
  }
}
function drawFoe(g,th,w,h,gy,t,dt){
  const F=SC.foe;
  if(!F.on) return;
  F.in=Math.min(1,F.in+dt*3.0);
  if(F.hitT>0) F.hitT-=dt;
  if(F.lunge>0) F.lunge=Math.max(0,F.lunge-dt*3.2);
  let dying=0;
  if(F.dieT>0){ F.dieT-=dt; dying=1-Math.max(0,F.dieT)/0.5; if(F.dieT<=0){ F.on=false; F.name=""; return; } }
  const hh=h*0.46*F.sc*(F.boss?1.08:1);
  const ent=1-Math.pow(1-F.in,3);
  const x=w*0.78+ (1-ent)*w*0.30 - F.lunge*w*0.10;
  g.save();
  g.globalAlpha=(1-dying)*ent;
  g.translate(x, gy+2+dying*8);
  if(dying) g.rotate(dying*0.5);
  foeShape(g,F.arch,hh,th.ac,t);
  g.restore();
  if(F.hitT>0){
    g.save(); g.globalAlpha=Math.max(0,F.hitT/0.22)*0.55; g.fillStyle="#fff";
    g.globalCompositeOperation="lighter";
    g.beginPath(); g.ellipse(x,gy-hh*0.5,hh*0.42,hh*0.5,0,0,6.29); g.fill(); g.restore();
  }
}

/* ── 主人公 ── */
function drawHero(g,w,h,gy,t,dt){
  const im=heroImg[heroKey()];
  if(!im||!im.complete||!im.naturalWidth) return;
  const H=HERO[heroKey()];
  const stand=h*0.60;
  const ch=stand*HERO_CH/HERO_STAND, cw=ch*HERO_CW/HERO_CH;
  let idx=H.idle[0], flip=false, dx=0, dy=0;
  const moving=(SC.spd>0.02);
  if(SC.fleeT>0){
    flip=true; idx=H.walk[Math.floor(t*11)%4];
    dy=-Math.abs(Math.sin(t*11*Math.PI))*2;
  }else if(SC.winT>0){
    idx=H.win; dy=-Math.abs(Math.sin(t*5))*3;
  }else if(SC.hurtT>0){
    idx=H.hurt; dx=-4*(SC.hurtT/0.42);
  }else if(SC.hitT>0){
    if(SC.hitT>0.30){ idx=H.up; dx=6*(1-(SC.hitT-0.30)/0.16); }
    else{ idx=H.hit; dx=14*Math.max(0,SC.hitT/0.30); }
  }else if(SC.restT>0){
    idx=H.rest;
  }else if(SC.foe.on){
    idx=H.idle[Math.floor(t*3)%2];
  }else if(moving){
    idx=H.walk[Math.floor(t*(6+SC.spd*4))%4];
    dy=-Math.abs(Math.sin(t*(6+SC.spd*4)*Math.PI))*1.6;
  }else{
    idx=H.idle[Math.floor(t*2)%2];
  }
  const cx=w*0.30+dx;
  g.save();
  g.globalAlpha=0.28; g.fillStyle="#000";
  g.beginPath(); g.ellipse(cx,gy+3,stand*0.20,stand*0.045,0,0,6.29); g.fill();
  g.restore();
  g.save(); g.translate(cx,gy+2+dy);
  if(flip) g.scale(-1,1);
  g.imageSmoothingEnabled=false;
  g.drawImage(im, idx*HERO_CW,0,HERO_CW,HERO_CH, -cw/2,-ch, cw,ch);
  g.restore();
}

/* ── 毎フレーム ── */
function scnDraw(dt){
  if(!SC.ready||!SC.wrap||SC.wrap.style.display==="none") return;
  const R=S.run; if(!R) return;
  const g=SC.g, w=SC.w, h=SC.h;
  if(!w||!h) return;
  const th=SCENERY[SC.area]||SCENERY.mori;
  SC.t+=dt;
  const t=SC.t;
  /* 進み具合 */
  let want=0;
  if(SC.fleeT>0) want=1.25;
  else if(SC.winT>0||SC.hurtT>0||SC.hitT>0||SC.foe.on||SC.restT>0) want=0;
  else if(R.phase==="move") want=1.0;
  else if(R.phase==="fin") want=0;
  else want=0.34;
  SC.spd+=(want-SC.spd)*Math.min(1,dt*4.5);
  SC.scroll+=SC.spd*96*dt*(SC.fleeT>0?-1:1);
  if(SC.hitT>0){
    const p=SC.hitT;
    SC.hitT-=dt;
    if(p>0.30&&SC.hitT<=0.30){
      const gy=h*0.80;
      spark(w*0.30+h*0.30, gy-h*0.30, SC.crit?16:8, SC.crit?"#ffd166":"#ffb060", SC.crit?1.25:1);
      scnFoeHit();
    }
  }
  if(SC.hurtT>0) SC.hurtT-=dt;
  if(SC.winT>0)  SC.winT-=dt;
  if(SC.fleeT>0) SC.fleeT-=dt;
  if(SC.restT>0) SC.restT-=dt;
  if(SC.shake>0) SC.shake=Math.max(0,SC.shake-dt*3.4);
  if(SC.flash>0) SC.flash=Math.max(0,SC.flash-dt*3.0);

  g.setTransform(SC.dpr,0,0,SC.dpr,0,0);
  g.clearRect(0,0,w,h);
  const sx=SC.shake>0?(Math.random()-0.5)*6*SC.shake:0;
  const sy=SC.shake>0?(Math.random()-0.5)*4*SC.shake:0;
  g.save(); g.translate(sx,sy);
  const gy=Math.round(h*0.80);
  drawBack(g,th,w,h,gy);
  drawMotes(g,th,w,h,dt);
  drawFoe(g,th,w,h,gy,t,dt);
  drawHero(g,w,h,gy,t,dt);
  /* 火花 */
  for(let i=SC.fx.length-1;i>=0;i--){
    const p=SC.fx[i];
    p.l-=dt; if(p.l<=0){ SC.fx.splice(i,1); continue; }
    p.vy+=340*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    g.globalAlpha=Math.max(0,p.l/p.m); g.fillStyle=p.c;
    g.fillRect(p.x,p.y,p.s,p.s);
  }
  g.globalAlpha=1;
  g.restore();
  if(SC.flash>0){
    g.globalAlpha=SC.flash*0.30; g.fillStyle="#e0564a"; g.fillRect(0,0,w,h); g.globalAlpha=1;
  }
  /* 上下の締め */
  const vg=g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0,"rgba(0,0,0,.42)"); vg.addColorStop(.25,"rgba(0,0,0,0)");
  vg.addColorStop(.85,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.42)");
  g.fillStyle=vg; g.fillRect(0,0,w,h);
}

/* ── 鍛冶場に立つ姿 ──
   道中と同じコマ帯を使い回す。アンビルより先に描くので、足元はアンビルに隠れる。
   絵が読めていないときは false を返し、呼び元が従来の槌だけを描く */
let fgHitT=0, fgT=0;
function scnForgeHit(){ fgHitT=0.30; }
function drawForgeHero(g,ax,ay,dt){
  const im=heroImg[heroKey()];
  if(!im||!im.complete||!im.naturalWidth) return false;
  const H=HERO[heroKey()];
  fgT+=dt;
  if(fgHitT>0) fgHitT=Math.max(0,fgHitT-dt);
  const stand=88, ch=stand*HERO_CH/HERO_STAND, cw=ch*HERO_CW/HERO_CH;
  let idx, dx=0, dy=0;
  if(fgHitT>0.22){ idx=H.up;  dy=-3; }                    /* 振り上げ */
  else if(fgHitT>0){ idx=H.hit; dx=-6; }                  /* 打ち込み。金床へ踏み込む */
  else if(F.on){ idx=H.idle[Math.floor(fgT*2.6)%2]; }     /* 構え */
  else { idx=H.idle[Math.floor(fgT*1.5)%2]; dy=-Math.abs(Math.sin(fgT*1.5))*1.2; }
  const cx=ax+52+dx;
  g.save();
  g.globalAlpha=0.30; g.fillStyle="#000";
  g.beginPath(); g.ellipse(cx,ay+1,stand*0.18,stand*0.042,0,0,6.29); g.fill();
  g.restore();
  g.save(); g.translate(cx,ay+2+dy); g.scale(-1,1);       /* アンビルの方（左）を向く */
  g.imageSmoothingEnabled=false;
  g.drawImage(im, idx*HERO_CW,0,HERO_CW,HERO_CH, -cw/2,-ch, cw,ch);
  g.restore();
  return true;
}

/* ══════════ 難度・根付・銘 ══════════
   狩場は増やさず、同じ七つに四段の難度を重ねる。
   既存の S.clears（狩場ごとの通算踏破・次の狩場の解禁に使う）はそのまま残し、
   段ごとの回数は S.clearsD に別で積む。控えの版を上げずに済ませるための作り。 */
/* 段の倍率。走り一回にかかる体力は おおよそ「敵HP × 敵攻撃 × 敵防御による長引き」で決まるので、
   攻撃を強く掛けると終盤で詰む。厚みはHPに寄せ、攻撃は控えめに伸ばしてある。
   体力の要り（skip）と素材（mat）を同じ倍率にしてあるので、
   体力あたりの素材効率は段が変わっても同じ。上の段に行く見返りは、金と落とし物。 */
const DIFFS=[
  {id:"n",n:"通常",c:"#9a8d80",need:0,rank:0, hp:1.0,atk:1.00,def:1.00,gold:1.0,mat:1.0,skip:1.0,exp:1.0,acc:0,   mei:0},
  {id:"k",n:"危険",c:"#ffd166",need:3,rank:5, hp:1.9,atk:1.18,def:1.20,gold:2.0,mat:1.7,skip:1.7,exp:1.4,acc:0.38,mei:0},
  {id:"a",n:"悪夢",c:"#c08bff",need:3,rank:9, hp:3.2,atk:1.36,def:1.36,gold:3.8,mat:2.7,skip:2.7,exp:1.9,acc:0.60,mei:2},
  {id:"j",n:"地獄",c:"#e0564a",need:4,rank:15,hp:4.6,atk:1.52,def:1.45,gold:6.5,mat:4.2,skip:4.2,exp:2.5,acc:0.85,mei:4}
];
DIFFS.forEach((d,i)=>{ d.i=i; });
const DMAP={}; DIFFS.forEach(d=>DMAP[d.id]=d);
function curDiff(){ const i=S.diff|0; return (i>=0&&i<DIFFS.length)?i:0; }
function dScale(di){ return DIFFS[di]||DIFFS[0]; }
function clearsAt(id,di){
  const o=S.clearsD&&S.clearsD[id]; if(!o) return 0;
  return o[DIFFS[di].id]||0;
}
function bumpClearD(id,di){
  if(!S.clearsD) S.clearsD={};
  if(!S.clearsD[id]) S.clearsD[id]={};
  const k=DIFFS[di].id;
  S.clearsD[id][k]=(S.clearsD[id][k]||0)+1;
}
function diffOpen(a,di){
  if(!areaOpen(a)) return false;
  if(di<=0) return true;
  const D=DIFFS[di];
  if(S.rank<D.rank) return false;
  return clearsAt(a.id,di-1)>=D.need;
}
function diffLockText(a,di){
  if(!areaOpen(a)) return areaLockText(a);
  const D=DIFFS[di], t=[];
  if(S.rank<D.rank) t.push("鍛冶の腕 "+rankName(D.rank));
  const c=clearsAt(a.id,di-1);
  if(c<D.need) t.push(DIFFS[di-1].n+"で"+D.need+"度踏破（いま"+c+"度）");
  return t.join("　と　")+" で踏み込める";
}
const skipCost=(a,di)=>Math.max(1,Math.round(a.skip*dScale(di).skip));
/* 悪夢から先は、主武器と副武器が神品でないと踏み込めない。大剣は両手持ちなので主だけで可。
   出来栄えだけを見る（鍛え直しや銘は問わない） */
const SHINPIN_DIFF=2;
function needShinpin(di){ return (di|0)>=SHINPIN_DIFF; }
function shinpinOK(){
  const e=equipped();
  if(!e.main||gradeIdx(e.main.q)!==5) return false;
  if(RMAP[e.main.id].k==="great") return true;
  return !!(e.sub&&gradeIdx(e.sub.q)===5);
}
const SHINPIN_TEXT="主武器と副武器を神品に（大剣は主だけ）";
/* 段が開いた瞬間に一度だけ報せる */
function noticeDiff(id){
  const a=AMAP[id]; if(!a) return;
  if(!S.openedD) S.openedD={};
  for(let i=1;i<DIFFS.length;i++){
    const key=id+":"+DIFFS[i].id;
    if(diffOpen(a,i)&&!S.openedD[key]){
      S.openedD[key]=true;
      toast("<b class='hot'>"+a.n+"・"+DIFFS[i].n+"</b> へ踏み込めるようになった。","#ffd166");
    }
  }
}

/* ── 根付（身につける小物）──
   危険以上の主だけが落とす。等級は武器と同じ6段を使い回し、
   効く量は「基本値 × 等級の倍率」。種類は10で固定してある（無限に増やすと倉庫が破綻するため） */
const ACCS=[
  {id:"hikui",   n:"火喰いの根付",   ef:"atkp",  per:0.030, d:"攻撃が上がる"},
  {id:"iwamori", n:"岩守の根付",     ef:"cut",   per:0.020, d:"受ける害が減る"},
  {id:"idaten",  n:"韋駄天の根付",   ef:"dash",  per:0.070, d:"ひと目多く進むことがある"},
  {id:"mekiki",  n:"目利きの根付",   ef:"loot",  per:0.400, d:"鉱脈の持ち帰りが増える"},
  {id:"fukuzu",  n:"福槌の根付",     ef:"goldp", per:0.055, d:"拾う金が増える"},
  {id:"shiranui",n:"不知火の根付",   ef:"crit",  per:0.016, d:"会心が出やすい"},
  {id:"kagenui", n:"影縫いの根付",   ef:"dodge", per:0.026, d:"罠を避けやすい"},
  {id:"tsuio",   n:"追尾の根付",     ef:"chase", per:0.022, d:"追撃が出やすい"},
  {id:"hagane",  n:"鋼胃の根付",     ef:"stam",  per:9,     d:"体力の上限が伸びる"},
  {id:"kudashi", n:"神降ろしの根付", ef:"kami",  per:0.065, d:"付喪神の加護が強まる"}
];
const ACCMAP={}; ACCS.forEach(x=>ACCMAP[x.id]=x);
const ACC_EF={atkp:"攻撃",cut:"被害軽減",dash:"疾走",loot:"持ち帰り",goldp:"拾う金",
  crit:"会心",dodge:"罠回避",chase:"追撃",stam:"体力上限",kami:"加護"};
const accGrade=x=>GRADES[gradeIdx(x.q)];
const accMult=x=>GRADES[gradeIdx(x.q)].mult;
function accVal(x){ const A=ACCMAP[x.id]; return A?A.per*accMult(x):0; }
function accText(x){
  const A=ACCMAP[x.id]; if(!A) return "";
  const v=accVal(x);
  if(A.ef==="stam") return "体力上限 +"+Math.round(v);
  if(A.ef==="loot") return "持ち帰り +"+(Math.round(v*10)/10);
  return ACC_EF[A.ef]+" +"+(Math.round(v*1000)/10)+"%";
}
function accWorn(){
  const f=u=>u?(S.acc.find(z=>z.uid===u)||null):null;
  return [f(S.accEq.a),f(S.accEq.b)];
}
function accBonus(){
  const o={atkp:0,cut:0,dash:0,loot:0,goldp:0,crit:0,dodge:0,chase:0,stam:0,kami:0};
  if(!S.acc||!S.accEq) return o;
  accWorn().forEach(x=>{ if(!x) return; const A=ACCMAP[x.id]; if(!A) return; o[A.ef]+=accVal(x); });
  return o;
}
function accPrice(x){ return Math.round(260*accMult(x)*(1+S.up.merchant*0.06)); }
function rollAcc(a,di){
  const A=ACCS[Math.floor(Math.random()*ACCS.length)];
  const q=Math.max(0,Math.min(100,Math.round(10+a.ei*7+di*13+Math.random()*24)));
  return {uid:S.accUid++,id:A.id,q:q};
}
function gainAcc(x){
  if(S.acc.length>=60){ toast("根付を持ちすぎだ。倉庫で整理してくれ。","#e0645a"); return false; }
  S.acc.push(x); return true;
}
function setAcc(slot,uid){
  if(!uid){ S.accEq[slot]=null; }
  else{
    const other=(slot==="a")?"b":"a";
    if(S.accEq[other]===uid) S.accEq[other]=null;   /* 同じものを二つ着けさせない */
    S.accEq[slot]=uid;
  }
  dmodal.classList.remove("open"); render();
}
function sellAcc(uid){
  const i=S.acc.findIndex(z=>z.uid===uid); if(i<0) return;
  const x=S.acc[i], p=accPrice(x);
  askConfirm("根付を売る",
    '<div class="note">'+ACCMAP[x.id].n+'（'+accGrade(x).n+'）を手放します。戻せません。</div>'+
    '<div class="kv"><span class="dim">売値</span><span class="hot">'+fmt(p)+'金</span></div>',
    "売る",()=>{
      if(S.accEq.a===uid) S.accEq.a=null;
      if(S.accEq.b===uid) S.accEq.b=null;
      S.acc.splice(i,1); S.gold+=p; S.stats.sold++; S.stats.earned+=p;
      toast("根付を売った。<b class='hot'>+"+fmt(p)+"金</b>","#6fd48a"); render();
    });
}
/* 根付を砕いて銘石にする。等級が高いほど多く取れる（粗悪1〜神品4） */
const ACC_STONE=[1,1,2,2,3,4];
function accStone(x){ return ACC_STONE[gradeIdx(x.q)]||1; }
function crushAcc(uid){
  const i=S.acc.findIndex(z=>z.uid===uid); if(i<0) return;
  const x=S.acc[i], n=accStone(x);
  askConfirm("根付を砕く",
    '<div class="note">'+ACCMAP[x.id].n+'（'+accGrade(x).n+'）を砕いて <b>銘石</b> にします。戻せません。</div>'+
    '<div class="kv"><span class="dim">取れる銘石</span><span class="hot">'+n+' 個</span></div>'+
    '<div class="kv"><span class="dim">砕いたあとの手持ち</span><span>'+(S.meiStone+n)+' 個</span></div>',
    "砕く",()=>{
      if(S.accEq.a===uid) S.accEq.a=null;
      if(S.accEq.b===uid) S.accEq.b=null;
      S.acc.splice(i,1); S.meiStone+=n;
      toast("根付を砕いた。<b class='hot'>銘石 +"+n+"</b>","#c08bff"); render();
    });
}

/* ── 銘（刀身に切る一字）──
   悪夢以上で落ちる「銘石」を使い、武器ひと振りに一つだけ切る。
   鍛え直しが「量」を伸ばすのに対し、銘は「質（効き方の種類）」を足す役。 */
const MEIS=[
  {id:"jin",  n:"迅", ef:"chase", per:0.10, s:3, d:"追撃 +10%"},
  {id:"ken",  n:"堅", ef:"cut",   per:0.08, s:3, d:"被害軽減 +8%"},
  {id:"retsu",n:"烈", ef:"atkp",  per:0.12, s:4, d:"攻撃 +12%"},
  {id:"sae",  n:"冴", ef:"crit",  per:0.10, s:4, d:"会心 +10%"},
  {id:"yu",   n:"幽", ef:"dodge", per:0.12, s:3, d:"罠回避 +12%"},
  {id:"fu",   n:"富", ef:"goldp", per:0.15, s:5, d:"拾う金 +15%"}
];
const MEIMAP={}; MEIS.forEach(x=>MEIMAP[x.id]=x);
/* 切れる銘の数。鍛え直しが +5 で二つ目、+10 で三つ目の座が開く */
const MEI_MAX=3;
function meiSlots(w){ return Math.min(MEI_MAX,1+Math.floor(wLv(w)/5)); }
function meiList(w){ return (w&&Array.isArray(w.meis))?w.meis.filter(x=>MEIMAP[x]):[]; }
function meiObjs(w){ return meiList(w).map(x=>MEIMAP[x]); }
/* 昔の呼び口。一つ目の銘だけを返す */
function meiOf(w){ const l=meiObjs(w); return l.length?l[0]:null; }
function meiCost(w){ return Math.round(sellPrice(w)*1.2)+400; }
function meiTag(w){
  return meiObjs(w).map(M=>'<span class="meitag">銘・'+M.n+'</span>').join("");
}
/* 拾う金への上乗せ。根付と、装備した武器の「富」の銘 */
function goldMul(){
  const e=equipped(); let v=accBonus().goldp;
  const f=(w,k)=>{ meiObjs(w).forEach(M=>{ if(M.ef==="goldp") v+=M.per*k; }); };
  f(e.main,1); f(e.sub,0.5);
  return 1+v;
}
function engrave(uid,mid,slot){
  const w=S.inv.find(x=>x.uid===uid), M=MEIMAP[mid];
  if(!w||!M) return;
  const n=meiSlots(w); slot=Math.max(0,Math.min(n-1,slot|0));
  const cur=meiList(w);
  if(cur.includes(mid)&&cur[slot]!==mid){ toast("同じ銘は二つ切れない。","#e0645a"); return; }
  const c=meiCost(w);
  if(S.meiStone<M.s){ toast("銘石が足りない。悪夢以上の主が落とすほか、根付を砕いても取れる。","#e0645a"); return; }
  if(S.gold<c){ toast("金が足りない。","#e0645a"); return; }
  const old=cur[slot]?MEIMAP[cur[slot]]:null;
  askConfirm("銘を切る",
    '<div class="note">'+RMAP[w.id].n+' の'+["一","二","三"][slot]+'つ目の座に <b>銘・'+M.n+'</b>（'+M.d+'）を切ります。'+
    (old?'<b class="bad">いま切ってある 銘・'+old.n+' は消えます。</b>':'')+
    '注いだ銘石と金は戻りません。</div>'+
    '<div class="kv"><span class="dim">銘石</span><span>'+M.s+' 個（手持ち '+S.meiStone+'）</span></div>'+
    '<div class="kv"><span class="dim">費用</span><span class="hot">'+fmt(c)+'金</span></div>'+
    '<div class="kv"><span class="dim">支払後の所持金</span><span>'+fmt(S.gold-c)+'金</span></div>',
    "切る",()=>{
      S.meiStone-=M.s; S.gold-=c;
      const l=meiList(w); while(l.length<=slot) l.push(null);
      l[slot]=mid;
      w.meis=l.filter(Boolean);            /* 途中の座が空いたまま並ばないよう、詰めて持つ */
      delete w.mei;
      S.stats.mei=(S.stats.mei||0)+1;
      toast("<b>"+RMAP[w.id].n+"</b> に <b class='hot'>銘・"+M.n+"</b> を切った。"+(old?"　前の銘は消えた。":""),"#ffd166");
      render();
    });
}
function viewMeiSection(){
  let h='<h2 class="sec" id="meiSec">銘を切る</h2>';
  h+='<button class="grpbar'+(S.openMei?" open":"")+'" data-act="tomei">'+
     '<span class="cv">'+(S.openMei?"▼":"▶")+'</span>刀身に一字を刻む'+
     '<span class="rc">銘石 '+S.meiStone+' 個</span></button>';
  if(!S.openMei) return h;
  h+='<div class="note" style="margin:6px 0 8px">悪夢以上の主が落とす <b>銘石</b> を使って銘を切れます。銘石は倉庫で根付を砕いても手に入ります。'+
     '鍛え直しが力そのものを伸ばすのに対し、銘は効き方の種類を足します。'+
     'ひと振りに切れる銘はふつう一つ。鍛え直しが <b>+5</b> で二つ目、<b>+10</b> で三つ目の座が開きます。'+
     '同じ銘は重ねられません。切り直すと前の銘は消え、注いだ銘石と金は戻りません。</div>';
  const list=S.inv.filter(w=>!S.shown.includes(w.uid)).sort((a,b)=>wPower(b)-wPower(a)).slice(0,12);
  if(!list.length){ return h+'<div class="empty">銘を切れる武器がありません。</div>'; }
  list.forEach(w=>{
    const r=RMAP[w.id], gi=gradeIdx(w.q), g=GRADES[gi], c=meiCost(w);
    const cur=meiList(w), n=meiSlots(w);
    const open=(S.meiOpen===w.uid);
    h+='<div class="card"><div class="row">'+wIcon(r,gi)+
      '<div style="flex:1;min-width:0"><div class="ttl">'+r.n+enhTag(w)+meiTag(w)+'</div>'+
      '<div class="mini"><span class="grade" style="color:'+g.c+'">'+g.n+'</span>　'+KNAME[r.k]+
      '　座 '+cur.length+'／'+n+(n<MEI_MAX?('（次は +'+(n*5)+' で開く）'):'')+'</div>'+
      '<div class="mini">費用 '+fmt(c)+'金</div></div>'+
      '<button class="btn '+(open?"":"sub ")+'sm" data-act="meiopen" data-id="'+w.uid+'">'+(open?"閉じる":"選ぶ")+'</button></div>';
    if(open){
      /* どの座に切るか。空いている座があればそこを先に指す */
      let slot=S.meiSlot|0; if(slot>=n) slot=Math.min(n-1,cur.length);
      h+='<div class="seg" style="margin:8px 0 6px">'+Array.from({length:n},(_,i)=>{
        const M=cur[i]?MEIMAP[cur[i]]:null;
        return '<button data-act="meislot" data-n="'+i+'" class="'+(slot===i?"on":"")+'">'+["一","二","三"][i]+'　'+(M?("銘・"+M.n):"空き")+'</button>';
      }).join("")+'</div>';
      h+='<div class="row wrap" style="gap:5px">'+MEIS.map(x=>{
        const dup=cur.includes(x.id);
        const ok=(S.meiStone>=x.s&&S.gold>=c&&!dup);
        return '<button class="btn '+(ok?"":"sub ")+'xs" data-act="mei" data-id="'+w.uid+'" data-mei="'+x.id+'" data-n="'+slot+'"'+(ok?"":" disabled")+'>'+
          '銘・'+x.n+'　'+x.d+'　銘石'+x.s+(dup?"　切ってある":"")+'</button>';
      }).join("")+'</div>';
    }
    h+='</div>';
  });
  return h;
}

/* ── 足りない素材を揃えたあと、打ちに戻る道 ──
   商店や精錬で止まってしまわないよう、揃った時点で鍛冶場へ引き返す */
function backForgeDone(){
  const id=S.backForge; if(!id) return false;
  const r=RMAP[id]; if(!r){ S.backForge=null; return false; }
  if(!canMake(r)) return false;
  backForgeNow();
  toast("素材が揃った。<b class='hot'>"+r.n+"</b> を打てる。","#ffd166");
  return true;
}
function backForgeNow(){
  const id=S.backForge;
  S.backForge=null; S.needMat=null; S.hl=null; S.lastBuy=null;
  S.tab="forge";
  if(id&&RMAP[id]){ S.pickMode="all"; S.pickKind="all"; S.pickOpen=id; S.openGen[RMAP[id].g]=true; }
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="forge"));
  render();
}

const view=document.getElementById("view");
/* 2列の札の共通形。押した札だけが下に開く（探索の狩場札と同じ作り）
   mark：左の小さな印（wIcon か dotMark）　name：一行　sub：小さな添え書き */
function tileHtml(act,id,open,mark,name,sub,no){
  return '<button class="gtile'+(open?" open":"")+(no?" no":"")+'" data-act="'+act+'" data-id="'+id+'">'+mark+
    '<span class="gtx"><span class="gn">'+name+'</span><span class="gm">'+sub+'</span></span></button>';
}
function dotMark(c,txt){
  return '<span class="atile" style="color:'+c+'">'+(txt||('<i class="dot" style="width:16px;height:16px;color:'+c+';background:'+c+'"></i>'))+'</span>';
}
function render(){
  paintStatus();
  const map={forge:viewForge,quest:viewQuest,shop:viewShop,stock:viewStock,shopup:viewSmithy,dex:viewDex};
  view.innerHTML=(map[S.tab]||viewForge)();
  if(S.tab==="forge"){ setupCanvas(); paintPips(); }
  if(S.tab==="shopup") paintHeroPicks(view);
  paintNavBadge();
  if(S.tab==="quest"&&S.run){
    const t=view.querySelector(".tile.now");
    if(t) t.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  }
  if(S.hl){ const el=view.querySelector(".hl"); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); }
  scnSync();
  autoSave();
  autoTick();
}
/* 体力が戻ったとき、画面を作り直さずに出発・早駆けの可否だけ更新する */
function refreshQuestBtns(){
  if(S.tab!=="quest"||S.run) return;
  const di=curDiff(), sp=needShinpin(di)&&!shinpinOK();
  view.querySelectorAll('button[data-act="run"]').forEach(b=>{
    const a=AMAP[b.dataset.id]; if(!a) return;
    b.disabled=!diffOpen(a,di)||sp||(S.stamina<skipCost(a,di));
  });
  view.querySelectorAll('button[data-act="skip"],button[data-act="skipn"]').forEach(b=>{
    const a=AMAP[b.dataset.id]; if(!a) return;
    b.disabled=sp||(S.stamina<skipCost(a,di));
  });
}
function paintNavBadge(){
  const b=document.querySelector('#nav button[data-tab="shop"]'); if(!b) return;
  const o=b.querySelector(".badge"); if(o) o.remove();
  if(S.orders.some(x=>matchOrder(x).length>=x.qty)){
    const d=document.createElement("span"); d.className="badge"; b.appendChild(d);
  }
}

      '<div class="mini">出来 '+L.q+'　想定売値 <span class="hot">'+fmt(L.price)+'金</span>　腕前 +'+L.exp+'</div></div></div>'+
      '<div class="row" style="margin-top:10px;gap:6px">'+
      '<button class="btn sm" data-act="forge" data-id="'+L.id+'" style="flex:2"'+(canMake(r)?"":" disabled")+'>同じ型をもう一本</button>'+

  }
  h+='<h2 class="sec" id="smeltSec">精錬</h2>';

     '<span class="rc">'+ALLOYS.filter(canSmelt).length+'／'+ALLOYS.length+' 精錬できる</span></button>';

function pickTile(r){
  const ok=canMake(r), d=S.dex[r.id], open=(S.pickOpen===r.id);
  let h='<button class="gtile'+(open?" open":"")+(ok?"":" no")+'" data-act="pickopen" data-id="'+r.id+'">'+
    wIcon(r,d?gradeIdx(d.best):null,"sm")+

    '</span></span></button>';
  if(!open) return h;
  h+='<div class="card gdet"><div class="row">'+
    '<div style="flex:1;min-width:0"><div class="ttl">'+r.n+'</div>'+
    '<div class="mini">'+KNAME[r.k]+'　'+hitsOf(r)+'打　目安 '+fmt(r.base)+'金</div></div>'+
    '<button class="btn sm" data-act="forge" data-id="'+r.id+'"'+(ok?"":" disabled")+'>炉へ</button></div>'+
    '<div class="row wrap" style="margin-top:6px">'+Object.keys(r.m).map(k=>matChip(k,r.m[k])).join("")+'</div>'+
    lackBlock(r)+'</div>';
  return h;
}
function viewPickSection(){
  const mode=S.pickMode||"ready", kind=S.pickKind||"all";
  const kOk=r=>(kind==="all"||r.k===kind);
  let h='<div class="seg" style="margin-bottom:6px">'+
    [["ready","打てる型"],["all","すべて"]].map(x=>
      '<button data-act="pickmode" data-val="'+x[0]+'" class="'+(mode===x[0]?"on":"")+'">'+x[1]+'</button>').join("")+
    '</div>';
  h+='<div class="seg">'+
    '<button data-act="pickkind" data-val="all" class="'+(kind==="all"?"on":"")+'">全</button>'+
    KINDS.map(k=>'<button data-act="pickkind" data-val="'+k.id+'" class="'+(kind===k.id?"on":"")+'">'+k.n+'</button>').join("")+
    '</div>';
  if(mode==="ready"){
    const list=RECIPES.filter(r=>unlocked(r)&&canMake(r)&&kOk(r))
      .sort((a,b)=>(b.g-a.g)||(KIDX[a.k]-KIDX[b.k]));
    if(!list.length){
      h+='<div class="empty">いま打てる型がありません。<br>素材を集めるか、上の「精錬」で鋼を作ってください。</div>'+
         '<button class="btn sub sm" data-act="pickmode" data-val="all" style="width:100%;margin-top:8px">すべての型を見る</button>';
      return h;
    }
    return h+'<div class="grid2">'+list.map(pickTile).join("")+'</div>';
  }
  for(let gi=1;gi<=6;gi++){
    const grp=RECIPES.filter(r=>r.g===gi&&unlocked(r)&&kOk(r)).sort((a,b)=>KIDX[a.k]-KIDX[b.k]);
    if(!grp.length) continue;
    const open=!!S.openGen[gi], ready=grp.filter(canMake).length;
    h+='<button class="grpbar'+(open?" open":"")+'" data-act="togen" data-id="'+gi+'">'+
       '<span class="cv">'+(open?"▼":"▶")+'</span>'+GENS[gi-1]+
       '<span class="rc">'+ready+'／'+grp.length+' 打てる</span></button>';
    if(open) h+='<div class="grid2" style="margin:6px 0 8px">'+grp.map(pickTile).join("")+'</div>';
  }
  const next=RECIPES.filter(r=>!unlocked(r)).sort((a,b)=>a.rank-b.rank)[0];
  if(next&&kind==="all"){
    h+='<div class="grouphead">'+GENS[next.g-1]+'</div>'+
       '<div class="card locked"><div class="row">'+wIcon(next,null,"",true)+
       '<div style="flex:1"><div class="ttl">？？？</div><div class="mini">'+rankName(next.rank)+'から打てる</div></div></div></div>';
  }
  return h;
}

function viewCampAreas(){
  const di=curDiff(), D=DIFFS[di];
  let h=viewDiffSeg();
  if(S.lastRun){
    const L=S.lastRun, a=AMAP[L.area], LD=DIFFS[L.diff||0];
    const ms=Object.keys(L.mats), lc=skipCost(a,L.diff||0);
    const cl=((L.diff||0)===0)?!!S.cleared[L.area]:(clearsAt(L.area,L.diff||0)>0);
    h+='<div class="result"><div class="rttl">'+(L.skip?"早駆けの結果":"前回の探索")+'</div>'+
       '<div class="row"><div style="flex:1"><div class="ttl">'+a.n+
       ((L.diff||0)?('　<span class="tag" style="color:'+LD.c+';border-color:'+LD.c+'">'+LD.n+'</span>'):'')+
       (L.skip?("　"+L.runs+"回"):"")+'</div>'+
       '<div class="mini">'+(L.cleared?'<span class="ok">踏破</span>':'<span class="bad">'+L.pos+'／'+(L.len-1)+'マスで撤退</span>')+
       (L.kills?('　討伐 '+L.kills):'')+(L.stone?('　銘石 +'+L.stone):'')+'</div></div>'+
       '<div class="center"><div class="mini">実入り</div><div class="ttl hot">'+fmt(L.gold)+'金</div></div></div>'+
       (ms.length?('<div class="row wrap" style="margin-top:6px">'+ms.map(k=>
         '<span class="mat"><i class="dot" style="color:'+MAT[k].c+';background:'+MAT[k].c+'"></i>'+MAT[k].n+' ×'+L.mats[k]+'</span>').join("")+'</div>'):'')+
       (cl?('<div class="row" style="gap:6px;margin-top:8px">'+
         '<span class="mini" style="flex:1">もう一度　早駆け 体力'+lc+'／回</span>'+
         '<button class="btn sub sm" data-act="skip" data-id="'+L.area+'"'+(S.stamina<lc?" disabled":"")+'>1回</button>'+
         '<button class="btn sub sm" data-act="skipn" data-id="'+L.area+'"'+(S.stamina<lc?" disabled":"")+'>10回</button></div>'):'')+
       '</div>';
  }
  h+='<h2 class="sec">狩場へ出る</h2>';
  h+='<div class="note" style="margin-bottom:8px">札を押すと、その狩場の中身と出発の口が下に開きます。'+
     '<b>次の狩場は、探索の熟練と、ひとつ前の狩場の踏破回数で開きます。</b>早駆けの一回も踏破に数えます。'+
     (di?'段が上がるほど、珍しい石が出やすくなっています。':'')+'</div>';
  /* 押されている札。鍛冶場の案内から飛んできたときはその狩場、なければ前回の狩場 */
  if(S.hl&&AMAP[S.hl]) S.qArea=S.hl;
  if(!S.qArea||!AMAP[S.qArea]) S.qArea=(S.lastRun&&S.lastRun.area)||"mori";
  const sel=S.qArea;
  h+='<div class="grid2">';
  AREAS.forEach(a=>{
    const lk=!diffOpen(a,di), open=(sel===a.id), sp=(!lk&&needShinpin(di)&&!shinpinOK());
    const cl=(di===0)?!!S.cleared[a.id]:(clearsAt(a.id,di)>0);
    const need=skipCost(a,di), cnt=clearsAt(a.id,di), th=SCENERY[a.id]||{ac:"#9a8d80"};
    h+='<button class="gtile'+(open?" open":"")+(lk?" no":"")+'" data-act="qarea" data-id="'+a.id+'">'+
      '<span class="atile" style="color:'+(lk?"#4a3f36":th.ac)+'">'+(lk?"閉":(cl?"踏":"未"))+'</span>'+
      '<span class="gtx"><span class="gn">'+a.n+'</span><span class="gm">'+
      (lk?'<span class="dim">道は閉じている</span>':(sp?'<span class="bad">神品の装備が要る</span>':('体力 '+need+(cl?('　踏破 '+cnt+'度'):'　未踏破'))))+'</span></span></button>';
    if(!open) return;
    h+='<div class="card gdet">';
    h+='<div class="row"><div style="flex:1;min-width:0"><div class="ttl">'+a.n+
      (di?('　<span class="tag" style="color:'+D.c+';border-color:'+D.c+'">'+D.n+'</span>'):'')+
      (cl?'　<span class="tag" style="color:var(--ok);border-color:#2f5c3a">踏破</span>':'')+'</div>'+
      '<div class="mini">'+a.desc+'</div>'+
      (lk?'<div class="mini bad">'+diffLockText(a,di)+'</div>'
         :'<div class="mini">'+a.len+'マス　主 '+a.boss+'　体力 '+need+(cnt?('　この段で '+cnt+'度'):'')+'</div>')+
      (sp?'<div class="mini bad">'+SHINPIN_TEXT+'</div>':'')+'</div>'+
      '<button class="btn cool sm" data-act="run" data-id="'+a.id+'"'+((lk||sp||S.stamina<need)?" disabled":"")+'>出発</button></div>';
    const tb=areaTbl(a,di); let tot=0; for(const x in tb) tot+=tb[x];
    h+='<div class="row wrap" style="margin-top:6px">'+
      Object.keys(tb).sort((x,y)=>tb[y]-tb[x]).map(k=>{
        const on=(S.needMat&&S.needMat.k===k);
        return '<span class="mat'+(on?" short":"")+'" style="'+(on?"border-color:#ffd166;color:#ffd166":"")+'">'+
          '<i class="dot" style="color:'+MAT[k].c+';background:'+MAT[k].c+'"></i>'+MAT[k].n+' '+Math.round(tb[k]/tot*100)+'%</span>';
      }).join("")+'</div>';
    if(!lk&&cl){
      h+='<div class="row" style="gap:6px;margin-top:8px">'+
        '<span class="mini" style="flex:1">早駆け　体力 '+need+'／回</span>'+
        '<button class="btn sub sm" data-act="skip" data-id="'+a.id+'"'+((sp||S.stamina<need)?" disabled":"")+'>1回</button>'+
        '<button class="btn sub sm" data-act="skipn" data-id="'+a.id+'"'+((sp||S.stamina<need)?" disabled":"")+'>まとめて10回</button></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

      '<div class="mini">攻撃 '+Math.round(E.atk)+'　防御 '+E.def+'</div></div>'+
      '<div class="center"><div class="mini">残り</div><div class="ttl">'+fmt(Math.max(0,E.hp))+'</div></div></div>'+

  }
  h+='</div>';

  h+='<div class="row" style="gap:6px;margin-top:10px">'+
    '<button class="btn '+(R.auto?"":"sub ")+'sm" data-act="rauto" style="flex:1">おまかせ　'+(R.auto?"入":"切")+'</button>'+

  h+='<h2 class="sec">道中の記録</h2><div class="log">'+
    (R.log.length?R.log.map(x=>'<div>'+x+'</div>').join(""):'<div class="dim">まだ何もありません。</div>')+'</div>';

  const ms=Object.keys(R.mats);

    '<div class="kv"><span class="dim">拾った金</span><span class="hot">'+fmt(R.gold)+'金</span></div>'+
    (ms.length?('<div class="row wrap" style="margin-top:6px">'+ms.map(k=>
      '<span class="mat"><i class="dot" style="color:'+MAT[k].c+';background:'+MAT[k].c+'"></i>'+MAT[k].n+' ×'+R.mats[k]+'</span>').join("")+'</div>')

    '<div class="note" style="margin-top:6px">主を討てば全部、途中で引き返すと半分だけ持ち帰れます。</div></div>';

/* ══════════ 音 ══════════
   音源は持たない。Web Audio で都節音階（レ・ミ♭・ソ・ラ・シ♭）を組み立てて鳴らす。
   場面は三つ。常の場／探索／鍛造中。小節の切れ目で入れ替わる */
const SCALE=[0,1,5,7,8];                       /* 都節。根音は D */
const ROOT=62;                                  /* MIDI の D4 */
const VOLS=[0,0.06,0.13,0.22];
const SND={ac:null,master:null,timer:null,scene:"base",want:"base",next:0,step:0,noise:null,started:false};
const midi=n=>440*Math.pow(2,(n-69)/12);
function scaleNote(deg,oct){ return ROOT+SCALE[((deg%5)+5)%5]+12*(oct||0)+12*Math.floor(deg/5); }
function sndVol(){ return S.snd.on?VOLS[S.snd.vol]||0:0; }
function makeNoise(ac){
  const b=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function pluck(t,freq,dur,g,type,detune){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type=type||"triangle"; o.frequency.value=freq; if(detune) o.detune.value=detune;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,g),t+0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
function pad(t,freq,dur,g){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain(), f=ac.createBiquadFilter();
  o.type="sine"; o.frequency.value=freq;
  f.type="lowpass"; f.frequency.value=700;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.linearRampToValueAtTime(g,t+dur*0.35);
  gn.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
function hit(t,g,cut,dur){
  const ac=SND.ac; if(!ac) return;
  const src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
  src.buffer=SND.noise; f.type="lowpass"; f.frequency.value=cut;
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(gn); gn.connect(SND.master); src.start(t); src.stop(t+dur+0.02);
}
/* 炉の低い唸り */
function rumble(t,dur,g){
  const ac=SND.ac; if(!ac) return;
  const src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
  src.buffer=SND.noise; src.loop=true;
  f.type="lowpass"; f.frequency.value=150;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.linearRampToValueAtTime(g,t+dur*0.3);
  gn.gain.linearRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(gn); gn.connect(SND.master); src.start(t); src.stop(t+dur+0.05);
}
/* 火花が爆ぜる音。細い帯域のごく短い雑音 */
function crackle(t,g){
  const ac=SND.ac; if(!ac) return;
  const src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
  src.buffer=SND.noise; src.playbackRate.value=0.7+Math.random()*1.6;
  f.type="bandpass"; f.frequency.value=1800+Math.random()*4200; f.Q.value=3+Math.random()*7;
  const vol=(g||0.10)*(0.35+Math.random()*0.65), d=0.012+Math.random()*0.035;
  gn.gain.setValueAtTime(vol,t);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(f); f.connect(gn); gn.connect(SND.master); src.start(t); src.stop(t+d+0.02);
}
/* 金属の余韻。倍音が整数比から外れるほど鐘らしくなる */
function bell(t,freq,g,dur,type){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,g),t+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
/* 槌を打った音。会心がいちばん澄んで長く伸びる */
function sfxHammer(sc){
  const ac=SND.ac; if(!ac||!S.snd.on||ac.state!=="running") return;
  const t=ac.currentTime+0.002;
  if(sc>=100){
    hit(t,0.30,11000,0.045);                       /* 打ち当たりの立ち上がり */
    taiko(t,0.13);                                  /* 芯の重み */
    [1,2.74,5.38,8.93,13.3].forEach((r,i)=>
      bell(t,660*r,0.115/(1+i*0.85),2.2-i*0.32,i>2?"sine":"triangle"));
    for(let i=0;i<10;i++) crackle(t+0.02+Math.random()*0.35,0.10);
  }else if(sc>=55){
    hit(t,0.20,7000,0.04);
    taiko(t,0.11);
    [1,2.74,5.38].forEach((r,i)=>bell(t,560*r,0.085/(1+i),0.85-i*0.2));
    for(let i=0;i<5;i++) crackle(t+0.02+Math.random()*0.2,0.08);
  }else{
    hit(t,0.16,900,0.09);                           /* 鈍く沈んだ音 */
    taiko(t,0.16);
    bell(t,180,0.05,0.22,"triangle");
  }
}

function taiko(t,g){
  const ac=SND.ac; if(!ac) return;
  const o=ac.createOscillator(), gn=ac.createGain();
  o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.16);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
  o.connect(gn); gn.connect(SND.master); o.start(t); o.stop(t+0.3);
  hit(t,g*0.5,1800,0.06);
}
const SCENES={
  base :{bpm:60, beat(k,t){
    if(k%16===0) pad(t,midi(ROOT-24),3.4,0.10);
    if(k%8===0)  pad(t,midi(scaleNote(k%16===0?0:2,-1)),2.0,0.055);
    if(k===0||k===6||k===10||k===13){
      const deg=[0,2,4,3,1][(Math.random()*5)|0];
      pluck(t,midi(scaleNote(deg,1)),1.5,0.07,"triangle");
    }
  }},
  quest:{bpm:98, beat(k,t){
    if(k%4===0) taiko(t,k%8===0?0.22:0.13);
    if(k%8===4) hit(t,0.05,5000,0.05);
    if(k%16===0) pad(t,midi(ROOT-24),1.9,0.09);
    if([2,5,7,11,14].indexOf(k%16)>=0){
      const deg=[0,1,2,4,3][(Math.random()*5)|0];
      pluck(t,midi(scaleNote(deg,1)),0.5,0.06,"square",-4);
    }
  }},
  /* 鍛造中は曲を鳴らさない。炉の唸りと、爆ぜる火花だけ */
  forge:{bpm:120,beat(k,t){
    if(k%16===0) rumble(t,3.6,0.075);
    const n=(Math.random()*3.2)|0;
    for(let i=0;i<n;i++) crackle(t+Math.random()*0.12);
  }}
};
function wantScene(){
  if(F.on) return "forge";
  if(S.tab==="quest"&&S.run) return "quest";
  return "base";
}
function sndTick(){
  const ac=SND.ac; if(!ac||ac.state!=="running") return;
  const sc=SCENES[SND.scene], spb=60/sc.bpm/4;
  while(SND.next<ac.currentTime+0.25){
    if(SND.step%16===0){
      const w=wantScene();
      if(w!==SND.scene){ SND.scene=w; SND.step=0; }
    }
    SCENES[SND.scene].beat(SND.step%16,SND.next);
    SND.next+=60/SCENES[SND.scene].bpm/4;
    SND.step++;
  }
}
function sndStart(){
  if(SND.started) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ SND.ac=new AC(); }catch(e){ return; }
  SND.noise=makeNoise(SND.ac);
  SND.master=SND.ac.createGain(); SND.master.gain.value=sndVol();
  SND.master.connect(SND.ac.destination);
  SND.next=SND.ac.currentTime+0.15; SND.step=0; SND.scene=wantScene();
  SND.timer=setInterval(sndTick,60);
  SND.started=true;
}
function sndResume(){ if(SND.ac&&SND.ac.state==="suspended") SND.ac.resume(); }
function sndApply(){
  if(!SND.master) return;
  const ac=SND.ac;
  SND.master.gain.cancelScheduledValues(ac.currentTime);
  SND.master.gain.linearRampToValueAtTime(sndVol(),ac.currentTime+0.25);
}
function paintSnd(){
  const b=document.getElementById("sndTop");
  if(b){ b.classList.toggle("on",S.snd.on); b.textContent=S.snd.on?"♪":"♪ 切"; }
  const t=document.getElementById("tSnd");
  if(t){ t.classList.toggle("on",S.snd.on); t.textContent=S.snd.on?"入":"切"; }
}
function toggleSnd(){
  S.snd.on=!S.snd.on;
  if(S.snd.on){ sndStart(); sndResume(); }
  sndApply(); paintSnd(); autoSave(true);
}
document.getElementById("sndTop").addEventListener("click",e=>{ e.stopPropagation(); toggleSnd(); });

    wipe.style.display="";
    document.getElementById("tContInfo").textContent=
      rankName(g.rank||1)+"　探索Lv"+(g.eLv||1)+"　"+fmt(g.gold||0)+"金　"+fmtWhen(d.t);
  }else{
    cont.style.display="none"; wipe.style.display="none";
  }
  paintSnd();
  paintHeroPicks(titleEl);
}
function enterGame(){
  titleEl.classList.add("gone");
  setTimeout(()=>{ titleEl.style.display="none"; },500);
  if(S.snd.on) sndStart();
  sndResume();
  render();
  requestAnimationFrame(loop);
  autoSave(true);
}
document.getElementById("tPick").addEventListener("click",e=>{
  const b=e.target.closest("button[data-hero]"); if(!b) return;
  S.hero=b.dataset.hero; paintHeroPicks(titleEl);
});
document.getElementById("tCont").addEventListener("click",()=>{
  if(!loadGame()){ resetGame(); }
  enterGame();
  setTimeout(()=>toast("炉に火を入れ直した。","#ffd166"),400);
});
document.getElementById("tNew").addEventListener("click",()=>{
  resetGame(); wipeSave(); enterGame();
  setTimeout(()=>toast("炉に火を入れた。まずは <b class='hot'>銅のダガー</b> から。","#ffd166"),400);
});
document.getElementById("tWipe").addEventListener("click",()=>{
  if(window.confirm("これまでの記録を消します。戻せません。よろしいですか。")){
    wipeSave(); paintTitle();
  }
});
fillOrders();
scnInit();
paintStatus();
paintTitle();
window.addEventListener("pagehide",()=>autoSave(true));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) autoSave(true); });
</script>
</body>
</html>
