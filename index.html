<style>
:root{
  --sumi:#14100e; --panel:#241d19; --line:#4a3f36;
  --ember:#ff7a1a; --hot:#ffd166; --quench:#7fb7c9;
  --ink:#efe6da; --dim:#9a8d80; --ok:#6fd48a; --bad:#e0645a;
  --gothic:"Meiryo UI","Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho","Noto Serif JP",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;overscroll-behavior-y:none;}
body{background:var(--sumi);color:var(--ink);font-family:var(--gothic);font-size:14px;line-height:1.5;overscroll-behavior:none;user-select:none;}
/* 下の帯を必ず画面の中に残すため、頁ごとは動かさず、高さは測った値を使う */
#app{position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;
  height:100%;height:100dvh;height:var(--app-h,100dvh);display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 100%,rgba(255,122,26,.10),transparent 60%),var(--sumi);}

#status{flex:0 0 auto;padding:8px 12px 6px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a1512,#14100e);}
.srow{display:flex;align-items:center;gap:10px;}
.brand{font-family:var(--mincho);font-size:19px;letter-spacing:.28em;color:var(--hot);text-shadow:0 0 12px rgba(255,122,26,.35);}
.brand small{display:block;font-family:var(--gothic);font-size:9px;letter-spacing:.18em;color:var(--dim);text-shadow:none;margin-top:-2px;}
.spacer{flex:1;}
.chip{font-size:11px;color:var(--dim);}
.chip b{font-family:var(--mincho);font-size:16px;color:var(--ink);font-weight:400;margin-left:3px;}
@media (max-width:400px){ .chip{font-size:10px;} .chip b{font-size:14px;margin-left:2px;} .srow{gap:7px;} }
.gold b{color:var(--hot);}
.bars{margin-top:6px;display:flex;gap:8px;align-items:center;}
.bar{flex:1;height:7px;border-radius:4px;background:#0d0a09;border:1px solid var(--line);overflow:hidden;}
.bar>i{display:block;height:100%;width:0%;transition:width .25s ease;}
.bar.exp>i{background:linear-gradient(90deg,#7a4a12,var(--hot));}
.bar.stm>i{background:linear-gradient(90deg,#2c5a66,var(--quench));}
.bar.elv>i{background:linear-gradient(90deg,#2a5c3a,var(--ok));}
.blabel{font-size:10px;color:var(--dim);width:50px;flex:0 0 auto;letter-spacing:.06em;}
.bnum{font-size:10px;color:var(--dim);width:58px;text-align:right;flex:0 0 auto;}

#view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;}
h2.sec{font-family:var(--mincho);font-size:13px;font-weight:400;color:var(--hot);letter-spacing:.22em;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);}
h2.sec:first-child{margin-top:2px;}
.note{font-size:11px;color:var(--dim);line-height:1.7;}
.grouphead{font-family:var(--mincho);font-size:12px;letter-spacing:.2em;margin:14px 0 6px;color:#c9bdaf;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 11px;margin-bottom:8px;}
.card.locked{opacity:.42;}
.card.hl{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 20px rgba(255,122,26,.3);}
.ttl{font-family:var(--mincho);font-size:15px;letter-spacing:.05em;}
.mini{font-size:11px;color:var(--dim);}

.btn{font-family:var(--gothic);font-size:13px;font-weight:bold;color:#1a1108;
  background:linear-gradient(180deg,#ffb349,var(--ember));border:none;border-radius:5px;padding:9px 14px;cursor:pointer;
  box-shadow:0 2px 0 #7d3a06;letter-spacing:.06em;}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.sub{background:linear-gradient(180deg,#3c332c,#2a231e);color:var(--ink);box-shadow:0 2px 0 #14100e;border:1px solid var(--line);}
.btn.cool{background:linear-gradient(180deg,#9ed2e0,#5f9dae);color:#0d1b20;box-shadow:0 2px 0 #2f5a66;}
.btn:disabled{opacity:.35;box-shadow:none;transform:none;cursor:default;}
.btn.sm{font-size:11px;padding:6px 10px;}
.btn.xs{font-size:10px;padding:5px 8px;letter-spacing:0;}
.row{display:flex;align-items:center;gap:8px;}
.row.wrap{flex-wrap:wrap;}

.mat{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink);background:#191411;
  border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 4px;margin:2px 3px 2px 0;}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 6px currentColor,inset 0 -3px 4px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.35);}
.mat.short{color:var(--bad);border-color:#5c2a25;background:#241312;}

.lack{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
.lackttl{font-size:10px;color:var(--bad);letter-spacing:.14em;margin-bottom:5px;}
.lackrow{margin-bottom:6px;}
.lackname{font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.ways{display:flex;flex-wrap:wrap;gap:5px;}

/* 武器の絵。等級（出来栄え）で見え方が変わる */
.wic{width:42px;height:42px;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;
  background:#12100e;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.wic svg,.wic img{width:36px;height:36px;display:block;object-fit:contain;position:relative;z-index:2;}
.wic.big{width:76px;height:76px;border-radius:8px;}
.wic.big svg,.wic.big img{width:66px;height:66px;}
.wic.huge{width:150px;height:150px;border-radius:10px;margin:0 auto 12px;}
.wic.huge svg,.wic.huge img{width:132px;height:132px;}
.wic .fx{position:absolute;inset:0;z-index:1;}
.wic .in{position:absolute;inset:1.6px;z-index:1;background:#12100e;border-radius:4px;}

.wic.q0{border-color:#3b342d;}                                  /* 未鍛造・型のみ */
/* 等級ひとつにつき一段。q1=粗物 … q9=真・神品（v40で等級と揃えた） */
.wic.q1{border-color:#4a453f;}
.wic.q1 img,.wic.q1 svg{filter:grayscale(.55) saturate(.5) brightness(.78);}
.wic.q2{border-color:#4f4a43;}
.wic.q2 img,.wic.q2 svg{filter:grayscale(.25) saturate(.8) brightness(.9);}
.wic.q3{border-color:#5a5c62;background:#111214;}
.wic.q3 .fx{background:radial-gradient(circle at 50% 60%,rgba(207,214,224,.12),transparent 70%);}
.wic.q4{border-color:#3a5a44;background:#101512;}
.wic.q4 .fx{background:radial-gradient(circle at 50% 60%,rgba(111,212,138,.20),transparent 70%);}
.wic.q4 img,.wic.q4 svg{filter:drop-shadow(0 0 3px rgba(111,212,138,.5));}
.wic.q5{border-color:#2f5f78;background:#0e1419;}
.wic.q5 .fx{background:radial-gradient(circle at 50% 60%,rgba(127,183,201,.26),transparent 72%);}
.wic.q5 img,.wic.q5 svg{filter:saturate(1.06) drop-shadow(0 0 4px rgba(127,183,201,.75));}
.wic.q6{border-color:#523a76;background:#130f19;box-shadow:0 0 12px rgba(192,139,255,.25);}
.wic.q6 .fx{background:conic-gradient(from 0deg,rgba(192,139,255,.55),rgba(90,50,140,.12),rgba(226,196,255,.6),rgba(90,50,140,.12),rgba(192,139,255,.55));animation:spin 7s linear infinite;}
.wic.q6 img,.wic.q6 svg{filter:brightness(1.08) saturate(1.16) drop-shadow(0 0 6px rgba(192,139,255,.9));}
.wic.q7{border-color:#6b3a68;background:#170f16;box-shadow:0 0 14px rgba(224,139,216,.3);}
.wic.q7 .fx{background:conic-gradient(from 0deg,rgba(224,139,216,.6),rgba(120,50,110,.12),rgba(255,206,246,.65),rgba(120,50,110,.12),rgba(224,139,216,.6));animation:spin 5.5s linear infinite;}
.wic.q7 img,.wic.q7 svg{filter:brightness(1.1) saturate(1.2) drop-shadow(0 0 6px rgba(224,139,216,.9));}
.wic.q8{border:none;background:none;box-shadow:0 0 18px rgba(255,209,102,.45);animation:pulse 2.4s ease-in-out infinite;}
.wic.q8 .fx{inset:-45%;background:conic-gradient(from 0deg,#ffd166,#fff3c4,#ff9a3a,#ffe7a0,#ff6b8a,#ffd166);animation:spin 4s linear infinite;opacity:.9;}
.wic.q8 img,.wic.q8 svg{filter:brightness(1.18) saturate(1.28) drop-shadow(0 0 5px rgba(255,240,190,.95)) drop-shadow(0 0 12px rgba(255,176,58,.75));}
.wic.q9{border:none;background:none;box-shadow:0 0 22px rgba(255,240,184,.7),0 0 6px rgba(255,255,255,.6);animation:pulse 1.6s ease-in-out infinite;}
.wic.q9 .fx{inset:-45%;background:conic-gradient(from 0deg,#fff0b8,#ffffff,#ffd166,#fff8e0,#ff9a3a,#ffffff,#fff0b8);animation:spin 2.4s linear infinite;opacity:.95;}
.wic.q9 img,.wic.q9 svg{filter:brightness(1.3) saturate(1.2) drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(255,240,184,.95));}
.wic.dim{border-color:#332c26;background:#0f0d0b;box-shadow:none;animation:none;}
.wic.dim .fx{display:none;}
.wic.dim img,.wic.dim svg{filter:grayscale(1) brightness(.32) contrast(.9);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(255,209,102,.35);}50%{box-shadow:0 0 26px rgba(255,209,102,.7);}}

.grade{font-family:var(--mincho);font-size:12px;letter-spacing:.1em;}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--dim);}
.enh{font-size:10px;font-weight:700;border:1px solid #6b5a2a;background:#241d10;border-radius:3px;padding:1px 5px;color:#ffd166;margin-left:4px;}

#forgeWrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0b0908;}
#forge{display:block;width:100%;height:246px;}
#hitZone{position:absolute;inset:0;}
#strike{width:100%;margin-top:8px;padding:16px 0;font-size:17px;letter-spacing:.4em;font-family:var(--mincho);font-weight:400;}
.pips{display:flex;gap:5px;justify-content:center;margin-top:8px;}
.pip{width:9px;height:9px;border-radius:50%;background:#2a221d;border:1px solid var(--line);}
.pip.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 7px rgba(255,209,102,.7);}
.pip.perfect{background:#fff3c4;border-color:#fff3c4;}
.pip.flaw{background:var(--bad);border-color:var(--bad);box-shadow:0 0 7px rgba(224,100,90,.7);}
.lockmk{display:inline-block;font-size:9px;line-height:1.3;padding:0 3px;margin-right:4px;border-radius:3px;
  color:var(--quench);border:1px solid #2c5a66;background:#10191d;vertical-align:1px;}
.gsell.lk{color:var(--quench);border-color:#2c5a66;background:#10191d;}
.tag.issin{color:#fff0b8;border-color:#6b5a1e;background:#1d1a10;}
.issinmk{display:inline-block;font-size:9px;line-height:1.3;padding:0 3px;margin-right:4px;border-radius:3px;
  color:#fff0b8;border:1px solid #6b5a1e;background:#1d1a10;vertical-align:1px;}
.mrec{width:100%;border-collapse:collapse;font-size:11px;}
.mrec th,.mrec td{padding:4px 5px;border-bottom:1px solid #2a221d;text-align:right;}
.mrec th{color:var(--dim);font-weight:normal;}
.mrec th:first-child,.mrec td:first-child{text-align:left;}

.result{background:linear-gradient(180deg,#2c2119,#221b16);border:1px solid #6b4a1e;border-radius:6px;padding:12px;margin-bottom:10px;}
.rttl{font-size:10px;letter-spacing:.24em;color:var(--hot);margin-bottom:8px;}

.grpbar{display:flex;align-items:center;gap:8px;width:100%;background:#191411;border:1px solid var(--line);
  border-radius:5px;padding:9px 11px;margin:12px 0 8px;cursor:pointer;
  font-family:var(--mincho);font-size:13px;letter-spacing:.2em;text-align:left;color:#d8c9b4;}
.grpbar.open{background:#1f1813;color:var(--hot);}
.grpbar .cv{font-family:var(--gothic);font-size:10px;opacity:.8;letter-spacing:0;}
.grpbar .rc{margin-left:auto;font-family:var(--gothic);font-size:10px;letter-spacing:.04em;color:var(--dim);}

.toastbox{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:50;}
.toast{background:rgba(20,16,14,.95);border:1px solid var(--line);border-left:3px solid var(--hot);color:var(--ink);
  font-size:12px;padding:7px 13px;border-radius:4px;animation:tin .2s ease,tout .4s ease 2.4s forwards;max-width:88vw;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}}
@keyframes tout{to{opacity:0;transform:translateY(-6px);}}

#modal,#dmodal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(8,6,5,.78);visibility:hidden;opacity:0;transition:opacity .14s ease;}
#modal.open,#dmodal.open{visibility:visible;opacity:1;}
#dmodal{z-index:90;}
.mbox,.dbox{width:100%;max-width:350px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px;
  box-shadow:0 12px 40px rgba(0,0,0,.65);max-height:88%;overflow-y:auto;}
.dbox{max-width:360px;max-height:88%;max-height:86dvh;overflow-y:auto;}
.mttl{font-family:var(--mincho);font-size:14px;letter-spacing:.16em;color:var(--hot);margin-bottom:10px;}
.mbody{font-size:12px;margin-bottom:14px;}
.mrow{display:flex;gap:8px;}
.mrow .btn{flex:1;}

#nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:linear-gradient(180deg,#1a1512,#100d0b);padding-bottom:env(safe-area-inset-bottom);}
#nav button{flex:1;background:none;border:none;color:var(--dim);padding:9px 0 8px;cursor:pointer;
  font-family:var(--mincho);font-size:13px;letter-spacing:.08em;position:relative;}
#nav button small{display:block;font-family:var(--gothic);font-size:8px;letter-spacing:.1em;opacity:.7;margin-top:1px;}
#nav button.on{color:var(--hot);}
#nav button.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:2px;background:var(--hot);box-shadow:0 0 8px var(--ember);}
#nav .badge{position:absolute;top:5px;right:20%;width:6px;height:6px;border-radius:50%;background:var(--bad);}
#nav .badge.run{background:#7fb7c9;animation:runBlink 1.2s ease-in-out infinite;}
@keyframes runBlink{0%,100%{opacity:1}50%{opacity:.25}}

.combo{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;}
.combo .pb{flex:1;height:5px;border-radius:3px;background:#0d0a09;border:1px solid var(--line);overflow:hidden;}
.combo .pb i{display:block;height:100%;}
.combo .st{width:44px;text-align:right;font-size:10px;color:var(--dim);}
.combo.done .st{color:var(--ok);}

.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
.dim{color:var(--dim);} .hot{color:var(--hot);} .cool{color:var(--quench);} .ok{color:var(--ok);} .bad{color:var(--bad);}
.center{text-align:center;}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:26px 10px;line-height:1.9;}
.seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:54px;font-family:var(--gothic);font-size:11px;padding:6px 0;cursor:pointer;
  background:#191411;border:1px solid var(--line);color:var(--dim);border-radius:4px;}
.seg button.on{background:#3a2a18;color:var(--hot);border-color:#6b4a1e;}
.banner{background:#16241a;border:1px solid #2f5c3a;border-left:3px solid var(--ok);border-radius:5px;padding:8px 10px;font-size:12px;margin-bottom:10px;}

.stickytop{position:sticky;top:-12px;z-index:6;background:#14100e;margin:-12px -12px 0;padding:12px 12px 8px;
  border-bottom:1px solid var(--line);}

/* ── すごろく探索 ── */
.eqrow{display:flex;gap:8px;margin-bottom:8px;}
.stick{position:sticky;top:-12px;z-index:6;background:var(--sumi);
  margin:-12px -12px 0;padding:12px 12px 8px;
  box-shadow:0 8px 10px -8px rgba(0,0,0,.75);}
.stick h2.sec{margin-top:0;}
.eqslot{flex:1;min-width:0;background:#191411;border:1px solid var(--line);border-radius:5px;padding:8px 9px;cursor:pointer;text-align:left;font-family:var(--gothic);color:var(--ink);}
.eqslot.vacant{border-style:dashed;}
.eqlbl{font-size:10px;letter-spacing:.16em;color:var(--dim);margin-bottom:5px;}
.eqname{font-family:var(--mincho);font-size:13px;line-height:1.35;word-break:break-all;}
.board{display:flex;gap:4px;overflow-x:auto;padding:10px 4px 8px;background:#0f0c0a;border:1px solid var(--line);border-radius:6px;}
.tile{flex:0 0 auto;width:42px;height:50px;border-radius:5px;border:1px solid var(--line);background:#191411;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--dim);position:relative;}
.tile b{font-size:16px;line-height:1;font-family:var(--mincho);font-weight:400;}
.tile.done{opacity:.3;}
.tile.now{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 14px rgba(255,122,26,.4);background:#2a1d12;}
.tile.hid b{color:#4a3f36;}
.tile.bos{border-color:#7a2f2a;background:#241412;}
.pawn{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--hot);}
.dice{width:100%;padding:15px 0;font-size:17px;letter-spacing:.34em;font-family:var(--mincho);font-weight:400;}
.dnum{font-family:var(--mincho);font-size:38px;color:var(--hot);text-align:center;line-height:1.15;text-shadow:0 0 18px rgba(255,122,26,.5);}
.log{background:#12100e;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px;max-height:140px;overflow-y:auto;}
.log div{padding:3px 0;border-bottom:1px solid #201a16;}
.log div:last-child{border-bottom:none;}
.hpbar{height:9px;border-radius:5px;background:#0d0a09;border:1px solid var(--line);overflow:hidden;}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#7a2320,#e0645a);transition:width .2s ease;}
.skl{display:inline-flex;font-size:10px;background:#1b1a26;border:1px solid #3c3a56;color:#c9c4ee;border-radius:20px;padding:2px 9px;margin:2px 3px 2px 0;}
.kamidana{display:flex;gap:5px;margin-bottom:9px;padding:9px 7px 7px;border-radius:6px;
  background:linear-gradient(180deg,#241c14,#1a1511);border:1px solid #6b4a1e;
  box-shadow:inset 0 3px 10px rgba(255,209,102,.10),0 3px 0 #120e0b;}
.kami{flex:1;min-width:0;background:#141110;border:1px solid var(--line);border-radius:5px;
  padding:7px 3px 6px;text-align:center;color:var(--dim);font-family:var(--gothic);cursor:pointer;}
.kami .pic{display:block;width:100%;max-width:52px;margin:0 auto 3px;aspect-ratio:1;
  image-rendering:auto;filter:brightness(.22) grayscale(1) contrast(1.4);}
.kami.woke .pic{filter:drop-shadow(0 0 6px currentColor);}
.kami b{display:block;font-family:var(--mincho);font-size:13px;font-weight:400;letter-spacing:.04em;}
.kami span{display:block;font-size:9px;letter-spacing:.02em;}
.kami.woke{color:var(--ink);border-color:#5a4222;}

.kami.on{border-color:var(--hot);background:#1f1710;box-shadow:0 0 0 1px var(--hot),0 0 14px rgba(255,122,26,.28);}
.kami:disabled{cursor:default;}
#title{position:fixed;inset:0;height:var(--app-h,100%);z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:28px 22px calc(28px + env(safe-area-inset-bottom));

             radial-gradient(90% 50% at 50% -10%,rgba(127,183,201,.07),transparent 60%),#0d0a09;}

#title .tart{width:150px;height:150px;margin-bottom:2px;filter:drop-shadow(0 0 22px rgba(255,122,26,.55));flex:0 0 auto;}

#title h1{font-family:var(--mincho);font-size:52px;font-weight:400;letter-spacing:.22em;

#title .yomi{font-family:var(--mincho);font-size:12px;letter-spacing:.5em;color:var(--hot);
  margin:2px 0 4px;text-indent:.5em;opacity:.85;}

  background:linear-gradient(180deg,#3a2a18,#241a11);border:1px solid #7a5a28;color:var(--hot);
  box-shadow:0 3px 0 #140f0b,inset 0 1px 0 rgba(255,209,102,.18);}

.sndbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:4px;

.sndbtn.on{color:var(--hot);border-color:#7a5a28;}
.choice{display:flex;gap:8px;}
.skls{min-height:24px;align-items:center;}
.phase{min-height:150px;}
.choice button{flex:1;text-align:left;padding:10px;font-size:11px;line-height:1.5;background:#191411;border:1px solid var(--line);color:var(--ink);border-radius:5px;cursor:pointer;font-family:var(--gothic);}
.choice button b{display:block;font-family:var(--mincho);font-size:14px;margin-bottom:3px;letter-spacing:.08em;}
.choice button.risk{border-color:#6b3a1e;background:#1f1611;}
.choice button.risk b{color:var(--hot);}

.shcell .q{font-family:var(--mincho);font-size:13px;line-height:1;}
.shcell .g{font-size:9px;letter-spacing:.04em;}
.shcell.empty2{border-style:dashed;opacity:.45;cursor:default;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start;}
.gtile{display:flex;align-items:center;gap:7px;padding:6px 8px;min-width:0;text-align:left;cursor:pointer;
  background:#191411;border:1px solid var(--line);border-radius:5px;font-family:var(--gothic);color:var(--ink);}
.gtile.open{border-color:#6b4a1e;background:#241a12;}
.gtile.no{opacity:.45;}
.wic.sm{width:34px;height:34px;border-radius:5px;}
.wic.sm svg,.wic.sm img{width:28px;height:28px;}
.gtx{flex:1;min-width:0;}
.gn{display:block;font-family:var(--mincho);font-size:13px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gm{display:block;font-size:9px;color:var(--dim);margin-top:1px;}
.gdet{grid-column:1/-1;margin-top:0;}
.atile{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:#12100e;border:1px solid var(--line);font-family:var(--mincho);font-size:15px;
  text-shadow:0 0 8px currentColor;}
.gtile.open .atile{border-color:currentColor;}
/* 畳める見出し。h2.sec と同じ見た目のボタン */
.sech{display:flex;align-items:center;gap:7px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);
  border-radius:0;padding:5px 0;margin:16px 0 8px;cursor:pointer;text-align:left;
  font-family:var(--mincho);font-size:13px;color:var(--hot);letter-spacing:.22em;}
.sech:first-child{margin-top:2px;}
.sech .cv{font-family:var(--gothic);font-size:10px;letter-spacing:0;opacity:.8;}
.sech .rc{margin-left:auto;font-family:var(--gothic);font-size:10px;letter-spacing:.02em;color:var(--dim);}
.sech.fold{color:#b08a4a;}
.sech.sm{font-size:12px;letter-spacing:.2em;color:#c9bdaf;border-bottom:none;margin:12px 0 4px;}
.sech.sm.fold{color:#8a7a68;}
/* 在庫の札に売るボタンを添える */
.help details{border:1px solid var(--line);border-radius:5px;background:#191411;margin-bottom:6px;}
.help summary{cursor:pointer;padding:8px 10px;font-family:var(--mincho);font-size:13px;letter-spacing:.1em;color:var(--hot);list-style:none;}
.help summary::-webkit-details-marker{display:none;}
.help summary::before{content:"▶";font-family:var(--gothic);font-size:9px;margin-right:7px;opacity:.8;}
.help details[open] summary::before{content:"▼";}
.help .hb{padding:0 10px 9px;font-size:12px;line-height:1.75;}
.help .hb b{color:var(--ink);}
.help .hb .k{color:var(--hot);}
.help .hb ul{margin:4px 0 0;padding-left:16px;}
.help .hb li{margin:2px 0;}
.gwrap{display:flex;gap:4px;min-width:0;}
.gwrap .gtile{flex:1;min-width:0;}
.gwrap .gsell{flex:0 0 auto;padding:0 7px;font-size:10px;letter-spacing:0;border-radius:5px;}
.gtile .gm .bad{color:var(--bad);} .gtile .gm .ok{color:var(--ok);}
#scnwrap{width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:#06080a;margin-bottom:8px;line-height:0;}
#scnwrap canvas{display:block;width:100%;}
.hpick{display:flex;gap:8px;width:100%;max-width:300px;margin:0 0 10px;}
.hpick button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 8px;
  border-radius:6px;background:#191412;border:1px solid var(--line);color:var(--dim);
  cursor:pointer;font-family:var(--gothic);font-size:11px;letter-spacing:.04em;}
.hpick button.on{border-color:#7a5a28;color:var(--ink);background:#241a12;}
.hpick canvas{width:40px;height:42px;image-rendering:pixelated;flex:0 0 auto;}
.heropick{display:flex;gap:8px;margin-top:8px;}
.heropick button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 8px;
  border-radius:5px;background:#191411;border:1px solid var(--line);color:var(--dim);
  cursor:pointer;font-family:var(--gothic);font-size:11px;}
.heropick button.on{border-color:#7a5a28;color:var(--ink);background:#241a12;}
.heropick canvas{width:38px;height:40px;image-rendering:pixelated;flex:0 0 auto;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
/* ── 手ほどき（案内の帯） ── */
#tutbar{flex:0 0 auto;border-top:1px solid #6b4a1e;background:linear-gradient(180deg,#241d12,#191310);padding:8px 12px 9px;}
#tutbar .tnum{font-family:var(--gothic);font-size:10px;letter-spacing:.12em;color:var(--hot);}
#tutbar .ttxt{font-size:12px;line-height:1.75;margin-top:2px;}
#tutbar .trow{display:flex;gap:6px;margin-top:7px;align-items:center;}
#tutbar .tb2{font-family:var(--gothic);font-size:11px;padding:5px 10px;cursor:pointer;
  background:#221a14;color:var(--dim);border:1px solid var(--line);border-radius:4px;}
#tutbar .tb2.go{background:#3a2a18;color:var(--hot);border-color:#6b4a1e;}
.tglow{border-radius:6px;animation:tglow 1.15s ease-in-out infinite;}
@keyframes tglow{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0);}50%{box-shadow:0 0 0 3px rgba(255,209,102,.55);}}
/* 背の低い画面では題字まわりを詰めて、釦まで届くようにする */
@media (max-height:620px){
  #title{padding:14px 22px calc(14px + env(safe-area-inset-bottom));}
  #title .tart{width:96px;height:96px;}
  #title h1{font-size:38px;margin:2px 0 0;}
  #title .lead{margin:6px 0 12px;}
  #title .hpick canvas{height:92px;}
}
</style>

<script>
"use strict";

/* ══════════ 素材 ══════════ */
const MAT={
  wood   :{n:"木材",     c:"#a97142", buy:6,   sell:3},
  copper :{n:"銅鉱石",   c:"#c87f4a", buy:10,  sell:5},
  coal   :{n:"石炭",     c:"#6a6873", buy:12,  sell:6},
  leather:{n:"獣革",     c:"#8b6b4a", buy:16,  sell:8},
  iron   :{n:"鉄鉱石",   c:"#98a0aa", buy:22,  sell:11},
  silver :{n:"銀鉱石",   c:"#d6e0ec", buy:55,  sell:27},
  magic  :{n:"魔鉱石",   c:"#a877e8", buy:120, sell:60},
  gold   :{n:"金鉱石",   c:"#e8bb3c", buy:160, sell:80},
  scale  :{n:"火竜の鱗", c:"#e0564a", buy:380, sell:190},
  star   :{n:"星鉄",     c:"#7fe0ec", buy:820, sell:410},
  rune   :{n:"古の刻印", c:"#f0e8b8", buy:0,   sell:600},
  /* 合金。店では買えず、精錬でしか作れない */
  bronze :{n:"青銅",     c:"#b98a4e", buy:0,   sell:27,   alloy:1},
  wrought:{n:"錬鉄",     c:"#8f97a2", buy:0,   sell:45,   alloy:2},
  tamaha :{n:"玉鋼",     c:"#e6eef8", buy:0,   sell:90,   alloy:3},
  makou  :{n:"魔鋼",     c:"#9b6ff0", buy:0,   sell:224,  alloy:4},
  ryuko  :{n:"竜鋼",     c:"#ef7a4a", buy:0,   sell:820,  alloy:5},
  shinko :{n:"神鋼",     c:"#ffe9a8", buy:0,   sell:1976, alloy:6}
};
const MATKEYS=Object.keys(MAT);
const ALLOYKEYS=MATKEYS.filter(k=>MAT[k].alloy);
/* 精錬　一次素材をまとめて合金にする。炉の当たり外れで一度に3〜5個できる */
const OUT_MIN=3, OUT_MAX=5, OUT_AVG=(OUT_MIN+OUT_MAX)/2;
const ALLOYS=[
  {k:"bronze", m:{copper:3,coal:2},                 need:1,  d:"銅を火に通し、粘りを出した合金。"},
  {k:"wrought",m:{iron:3,coal:2},                   need:3,  d:"鉄から不純物を叩き出したもの。"},
  {k:"tamaha", m:{iron:4,silver:1,coal:3},          need:6,  d:"炉底に沈む、鍛冶師の憧れ。"},
  {k:"makou",  m:{magic:2,gold:1,coal:4},           need:9,  d:"魔力を金で繋ぎ止めた鋼。"},
  {k:"ryuko",  m:{scale:2,star:1,coal:5},           need:12, d:"竜の鱗を溶かし込んだ鋼。"},
  {k:"shinko", m:{star:2,rune:1,ryuko:2,coal:6},    need:15, d:"神代の型にだけ許される鋼。"}
];
const ALMAP={}; ALLOYS.forEach(x=>ALMAP[x.k]=x);
/* 合金1個あたりの原価。産出を増やしたぶん、精錬して売るだけで儲かる抜け道ができないよう
   売値は常に原価の半分になるよう自動で決める。刻印のような非売品は売値の2倍を原価とみなす */
function alloyUnitCost(k){
  const a=ALMAP[k]; if(!a) return MAT[k].buy>0?MAT[k].buy:MAT[k].sell*2;
  let c=0; for(const m in a.m) c+=alloyUnitCost(m)*a.m[m];
  return c/OUT_AVG;
}
ALLOYS.forEach(a=>{ MAT[a.k].sell=Math.max(1,Math.round(alloyUnitCost(a.k)*0.5)); });
/* 世代ごとに使う鋼。鍛え直しの費えにも使う */
const GEN_ALLOY=["bronze","wrought","tamaha","makou","ryuko","shinko"];

const KAMI_PER=4, KAMI_MAX=3;                /* 神品4本で一段、三段まで（竜と星の型以降に限る） */
const KAMI_GEN=5;                              /* この世代から先の神品だけ捧げられる */
const kamiTier=k=>Math.min(KAMI_MAX,Math.floor((S.kami[k]||0)/KAMI_PER));
/* 極（きわみ）：真・神品を捧げた数。ひとつごとに加護が KIWAMI_PER ずつ強まり、KIWAMI_MAX まで */
const KIWAMI_PER=0.25, KIWAMI_MAX=4;
const kiwami=k=>Math.min(KIWAMI_MAX,(S.kamiShin&&S.kamiShin[k])||0);
const kamiPower=k=>{ const K=KAMIMAP[k]; return K?K.per*kamiTier(k)*(1+KIWAMI_PER*kiwami(k)):0; };
const kamiNext=k=>{ const t=kamiTier(k); return t>=KAMI_MAX?0:(KAMI_PER*(t+1)-(S.kami[k]||0)); };
/* 奉納料。売値に連動させると名声や世代で十万を超えて捧げられなくなるため、段ごとの定額にする */
const OFFER_COST=[8000,16000,24000];
function offerCost(w){ const r=RMAP[w.id]; return OFFER_COST[Math.min(OFFER_COST.length-1,kamiTier(r.k))]; }
function canOffer(w){ return w&&!RMAP[w.id].cast&&RMAP[w.id].g>=KAMI_GEN&&gradeIdx(w.q)>=SHIN_GI&&w.uid!==S.equip.main&&w.uid!==S.equip.sub&&!S.shown.includes(w.uid); }

/* ══════════ 武器の組み合わせ ══════════
   分類の定めどおり、主武器に置けるのは片手の長剣・反りの刀・両手の大剣だけ。
   副えはその相棒の分類に限る（長剣には短刃、刀には忍具、大剣は両手持ちで副えなし）。
   野太刀を二本差すような形にならないよう、装備の口でも弾く */
const MAIN_KINDS=["sword","katana","great"];
const isMainKind=k=>MAIN_KINDS.includes(k);
const kindOf=w=>(w&&RMAP[w.id])?RMAP[w.id].k:null;
/* その主武器が連れられる副えの分類。大剣と、主に置けない分類は null */
function subKindOf(m){
  const k=kindOf(m);
  if(!k||!isMainKind(k)) return null;
  return KINDS[KIDX[k]].pair;
}
function eqLegal(m,sb){
  if(!m) return !sb;
  if(!isMainKind(kindOf(m))) return false;
  const pk=subKindOf(m);
  if(!pk) return !sb;
  return !sb||kindOf(sb)===pk;
}

   刀を切れ味で「最上大業物・大業物・良業物・業物」の四段に位付けした。
   選ばれたのは業物でも八十工ほどで、名の残る刀工に限られる。

/* ── 拍子打ち ──
   金床が一定の拍を刻み、その拍に合わせて打ち続ける打ち方。的は中央に据え置きで動かない。
   そのかわり針が速く、間合いは時間で測ることになる。拍を外すと鉄が冷える。
   拍の間隔は世代が上がるほど詰まる（第一世代 0.60秒＝毎分100打、第六世代 0.45秒） */

   拍子打ちのまま、締めの狭さが最初の一打から最後まで続く */

function gradeIdx(q){ let i=0; GRADES.forEach((g,n)=>{ if(q>=g.min) i=n; }); return i; }

function areaTbl(a,di){

}

const CODE_HEAD="TSUCHIOTO1:";
function saveCode(){
  const json=JSON.stringify({v:SAVE_VER,t:Date.now(),a:APP_VER,s:S});
  const by=new TextEncoder().encode(json);
  let bin="", CH=0x8000;
  for(let i=0;i<by.length;i+=CH) bin+=String.fromCharCode.apply(null,by.subarray(i,i+CH));
  return CODE_HEAD+btoa(bin);
}
function readCode(txt){
  const t=String(txt||"").replace(/\s+/g,"");
  const i=t.indexOf(CODE_HEAD);
  if(i<0) return null;
  try{
    const bin=atob(t.slice(i+CODE_HEAD.length));
    const by=new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++) by[j]=bin.charCodeAt(j);
    const d=JSON.parse(new TextDecoder().decode(by));
    return (d&&d.s)?d:null;
  }catch(e){ return null; }
}

function downloadSaveCode(){

/* 鍛冶の腕。v32 で三倍ほどゆるやかにした。一本打っただけで二段も三段も上がらないよう、
   出だしの一段を重くし、上に行くほど伸び幅も広げてある */
const needExp=r=>Math.floor(80*Math.pow(r,1.55));
const needExpE=l=>Math.floor(22*Math.pow(l,1.3));
/* 基礎の力。鍛冶の腕と探索の熟練の両方で伸びる（装備して探索に出るときに使います） */
function baseStats(){

}
const have=m=>S.mats[m]||0;
const unlocked=r=>S.rank>=r.rank;
const canMake=r=>{ for(const k in r.m) if(have(k)<r.m[k]) return false; return true; };
const canSmelt=a=>{ if(S.rank<a.need) return false; for(const k in a.m) if(have(k)<a.m[k]) return false; return true; };
function smelt(k,times){
  const a=ALMAP[k]; if(!a) return;
  if(S.rank<a.need){ toast("まだこの鋼は扱えない。","#e0645a"); return; }
  let done=0,got=0;
  for(let i=0;i<times;i++){
    if(!canSmelt(a)) break;
    for(const m in a.m) S.mats[m]-=a.m[m];
    /* 炉が良いほど、もう一度振り直して良い方を取れることが増える（一段 12%） */
    const roll=()=>OUT_MIN+Math.floor(Math.random()*(OUT_MAX-OUT_MIN+1));
    let out=roll();
    if(Math.random()<(S.up.furnace||0)*0.12) out=Math.max(out,roll());
    S.mats[k]=(S.mats[k]||0)+out; got+=out; done++;
  }
  if(!done){ toast("素材が足りない。","#e0645a"); return; }
  const best=(done===1&&got===OUT_MAX);
  toast("<b>"+MAT[k].n+"</b> を "+got+"個 精錬した。"+(best?"　<b class='hot'>炉の機嫌がいい</b>":""),"#ffd166");
  tutEv("smelt",k);
  if(backForgeDone()) return;
  render();
}

/* ══════════ 評判（飾り棚と相棒の対） ══════════ */
function shelfInfo(){
  const ws=S.shown.map(uid=>S.inv.find(x=>x.uid===uid)).filter(Boolean);
  let base=0; const cnt={};
  ws.forEach(w=>{ base+=w.q; cnt[RMAP[w.id].k]=(cnt[RMAP[w.id].k]||0)+1; });
  const pairA=Math.min(cnt.sword||0, cnt.tanjin||0);
  const pairB=Math.min(cnt.katana||0,cnt.ninja||0);
  const solo =cnt.great||0;
  const set=pairA*8+pairB*8+solo*6;
  return {base:Math.floor(base/10), pairA, pairB, solo, set, total:Math.floor(base/10)+set};
}
/* ══════════ 名声 ══════════
   飾り棚の評判（60まで）と、納品で積み上げた名声の和。売値に効き（150%まで）、注文の格を決める */
const FAME_SHELF_CAP=60, FAME_SELL_CAP=150;
const TITLES=[{min:0,n:"無名"},{min:30,n:"町の鍛冶"},{min:100,n:"名の知れた鍛冶"},{min:250,n:"国の鍛冶"},{min:600,n:"伝説の鍛冶"}];
const fameShelf=()=>Math.min(FAME_SHELF_CAP,shelfInfo().total);
const fame=()=>fameShelf()+(S.fameOrd||0);
const fameSell=()=>Math.min(FAME_SELL_CAP,fame());
function titleOf(f){ let t=TITLES[0]; TITLES.forEach(x=>{ if(f>=x.min) t=x; }); return t; }
function titleNext(f){ return TITLES.find(x=>x.min>f)||null; }
function addFame(v){
  const before=titleOf(fame()).n;
  S.fameOrd=(S.fameOrd||0)+v;
  const after=titleOf(fame());
  if(after.n!==before) toast("名が広まった。<b class='hot'>"+after.n+"</b>","#ffd166");
}
function sellPrice(w){
  const r=RMAP[w.id];
  return Math.round(r.base*effMult(w)*(1+S.up.merchant*0.06)*(1+fameSell()/100)*(1+dexSellBonus(r.k)));
}

function sources(k){
  const list=[];
  AREAS.forEach(a=>{
    if(a.tbl[k]===undefined) return;
    const tb=areaTbl(a,curDiff());
    let t=0; for(const x in tb) t+=tb[x];
    list.push({id:a.id,n:a.n,rate:Math.round(tb[k]/t*100),elv:a.elv,open:areaOpen(a)});
  });
  list.sort((x,y)=>x.open!==y.open?(x.open?-1:1):y.rate-x.rate);
  return {areas:list, buy:MAT[k].buy>0?MAT[k].buy:0};
}
function lackBlock(r){
  const lacks=[];
  for(const k in r.m){ const d=r.m[k]-have(k); if(d>0) lacks.push({k,d,need:r.m[k]}); }
  if(!lacks.length) return "";
  let h='<div class="lack"><div class="lackttl">足りない素材</div>';
  lacks.forEach(L=>{
    const m=MAT[L.k], src=sources(L.k);
    h+='<div class="lackrow"><div class="lackname"><i class="dot" style="color:'+m.c+';background:'+m.c+'"></i>'+
       '<b>'+m.n+'</b><span class="mini">　'+have(L.k)+'／'+L.need+'（あと'+L.d+'）</span></div><div class="ways">';
    src.areas.slice(0,2).forEach(a=>{
      h+= a.open
        ? '<button class="btn cool xs" data-act="goto" data-tab="quest" data-hl="'+a.id+'">'+a.n+'で探索　'+a.rate+'%</button>'
        : '<button class="btn sub xs" disabled>'+a.n+'（探索Lv'+a.elv+'で開放）</button>';
    });
    if(m.alloy){
      const al=ALMAP[L.k], ok=canSmelt(al);
      h+='<button class="btn xs" data-act="smelt" data-id="'+L.k+'" data-n="'+Math.ceil(L.d/OUT_MIN)+'"'+(ok?"":" disabled")+'>精錬する（'+OUT_MIN+'〜'+OUT_MAX+'個できる）</button>';
      h+='<span class="tag">'+Object.keys(al.m).map(x=>MAT[x].n+"×"+al.m[x]).join("・")+'</span>';
      if(S.rank<al.need) h+='<span class="tag">腕前が足りない</span>';
    }
    else h+= src.buy>0
      ? '<button class="btn xs" data-act="goto" data-tab="shop" data-hl="'+L.k+'" data-qty="'+L.d+'" data-back="'+r.id+'">商店で'+L.d+'個買う　'+fmt(src.buy*L.d)+'金</button>'
      : '<span class="tag">店では買えない</span>';
    h+='</div></div>';
  });
  return h+'</div>';
}

    if(nr.length){ S.openGen={}; S.openGen[nr[0].g]=true; }
  }
}

  document.getElementById("numExp").textContent=Math.floor(S.exp)+"/"+ne;
  const sm=staminaMax();
  document.getElementById("barStm").style.width=Math.min(100,S.stamina/sm*100)+"%";
  document.getElementById("numStm").textContent=Math.floor(S.stamina)+"/"+sm;
}

/* ══════════ 鍛冶 ══════════ */
const F={on:false,rec:null,need:0,hits:0,scores:[],heat:100,pos:.5,dir:1,speed:.6,
  zone:.5,pw:.04,gw:.13,hammer:0,sparks:[],flash:0,shake:0,msg:"",msgT:0,msgC:"#ffd166",penalty:0,lock:0,miss:0,
  beat:false,issin:false,count:0,struck:true,pulse:0,beatT:0,missed:false,practice:false,errs:[],clean:true};
function widths(){
  /* 一心は最初の一打から締めの狭さ。ふだんは最後の二打だけ */
  const b=S.up.bellows, hf=0.5+0.5*(F.heat/100), ff=((F.issin||inFinale())?FINALE_W:1);
  if(F.beat){
    /* 拍子打ちは針が速いぶん、帯は広く取る。時間で測ると会心はおよそ 60ミリ秒 */
    F.pw=(0.095+b*0.008)*hf*ff; F.gw=(0.26+b*0.012)*hf*ff;
    return;
  }
  /* 会心帯の上を素通りするたびに、狙いどころがほんの少しずつ狭まる */
  const mf=Math.max(0.40,1-F.miss*0.05)*ff;
  F.pw=(0.030+b*0.0045)*hf*mf; F.gw=(0.115+b*0.012)*hf*mf;
}
function newZone(){ let z; do{ z=0.13+Math.random()*0.74; }while(Math.abs(z-F.pos)<0.15); F.zone=z; F.miss=0; }
function startForge(id,prac){
  const r=RMAP[id];
  if(!r||!unlocked(r)) return;
  /* 稽古は素材を使わず、品もできない。打ち方に慣れるためだけの場 */
  if(!prac){
    if(!canMake(r)){ toast("素材が足りない。下の案内から集めてくれ。","#e0645a"); return; }
    for(const k in r.m) S.mats[k]-=r.m[k];
  }
  F.practice=!!prac; F.errs=[]; F.clean=true;
  F.on=true; F.rec=r; F.need=hitsOf(r); F.hits=0; F.scores=[]; S.ftab="forge";
  F.heat=100; F.penalty=0; F.sparks.length=0; F.hammer=0; F.flash=0; F.shake=0;
  F.issin=(S.forgeMode==="issin"&&issinOpen());
  F.beat=F.issin||(S.forgeMode==="beat"); F.pulse=0; F.miss=0;
  if(F.beat){
    /* 拍子打ち。端から入って中央を通るたびが一拍。構えの拍を聞いてから打ち始める */
    F.speed=(1/beatPeriod(r.g))*(1-S.up.hammer*0.03);
    /* 連続鍛造の二本目からは、もう拍に乗っているので構えを短くする */
    F.zone=.5; F.pos=0; F.dir=1; F.struck=true; F.lock=0;
    F.count=(S.chain&&S.chain.made>0)?2:BEAT_IN;
    F.beatT=performance.now(); F.missed=false;
    F.msg="構え"; F.msgT=1.0; F.msgC="#9ad7ff";
  }else{
    F.speed=(0.52+r.g*0.055)*(1-S.up.hammer*0.035);
    F.pos=.5; F.dir=1; F.count=0; F.struck=true;
    F.msg="打て"; F.msgT=1.0; F.msgC="#ffd166"; F.lock=performance.now()+320;
    newZone();
  }
  widths(); render();
  if(!prac) tutEv("forge",id);
}
function reheat(){
  if(!F.on) return;
  if(!F.practice&&have("coal")<1){ toast("石炭がない。","#e0645a"); return; }
  const pen=Math.max(1,6-(S.up.furnace||0));
  if(!F.practice) S.mats.coal--;
  F.heat=100; F.penalty+=pen;
  F.msg="再加熱"; F.msgT=.8; F.msgC="#ff7a1a";
  toast("炉に戻した。出来栄えに <b class='bad'>-"+pen+"</b>","#ff7a1a"); render();
}
function strike(){
  if(!F.on) return;
  /* 拍子打ちは、構えのあいだは打てない。一拍につき一打まで（連打で稼げないように） */
  if(F.beat){ if(F.count>0||F.struck) return; }
  else if(performance.now()<F.lock) return;
  const d=Math.abs(F.pos-F.zone);
  let sc,msg,col;
  /* 帯に入っただけの一打は 70〜30 にとどめる。業物から先は、半分ほどを会心で決めないと届かない */
  if(d<=F.pw){ sc=100; msg="会心"; col="#ffd166"; }
  else if(d<=F.gw){ const t=(d-F.pw)/Math.max(1e-4,F.gw-F.pw); sc=Math.round(70-40*t); msg="手応え"; col="#6fd48a"; }
  else { sc=Math.max(0,Math.round(28-(d-F.gw)*150)); msg=sc>8?"甘い":"打ち損じ"; col="#e0645a"; F.heat=Math.max(0,F.heat-12);
    F.clean=false; }   /* 画竜点睛。一打でも帯を外すと、この一本は業物に届かなくなる */
  if(F.heat<15) sc=Math.min(sc,40);
  if(F.beat) F.struck=true;
  /* 拍（または帯の中心）からどれだけずれたか。稽古で見せる */
  const toward=((F.zone-F.pos)*F.dir>0);
  F.errs.push({ms:Math.round(d/Math.max(0.001,F.speed)*1000), early:toward});
  F.scores.push(sc); F.hits++;
  F.hammer=1; F.flash=1; F.shake=Math.min(1,sc/100);
  scnForgeHit();
  F.msg=msg; F.msgT=.65; F.msgC=col;
  sfxHammer(sc);
  spawnSparks(sc);
  if(F.hits>=F.need){ finishForge(); return; }
  if(F.beat){
    /* 拍は乱さない。速さも的の位置もそのまま */
    F.heat=Math.max(0,F.heat-BEAT_HIT_HEAT);
  }else{
    F.speed*=1.075; F.heat=Math.max(0,F.heat-5);
    newZone();
  }
  widths(); paintPips(); paintFlaw();
  if(F.practice){ const e=document.getElementById("errs"); if(e) e.innerHTML=errChips(); }
  /* 締めに入る合図。ここから的が狭くなる */
  if(hasFinale(F.rec)&&F.hits===F.need-FINALE_HITS){
    F.msg="締め"; F.msgT=1.1; F.msgC="#fff0b8";
    if(!F.beat) F.lock=performance.now()+260;      /* 拍子打ちで間を空けると拍が飛ぶので止めない */
  }
}
/* 針が中央を通るたびに呼ばれる。ここが一拍 */
function beatTick(){
  F.pulse=1;
  sfxTick(F.count>0);
  if(F.count>0){
    F.count--;
    if(F.count>0){ F.msg=["","一","二","三"][F.count]; F.msgC="#9ad7ff"; }
    else { F.msg="打て"; F.msgC="#ffd166"; }
    F.msgT=.55;
  }
  F.struck=false; F.missed=false; F.beatT=performance.now();
}
/* 拍を見送ったかどうかは、その拍から手応えの幅ぶん待ってから決める。
   拍のすぐ後に打った一打まで空打ちにしないため */
function beatWatch(){
  if(F.count>0||F.struck||F.missed) return;
  if(performance.now()-F.beatT<(F.gw/Math.max(0.001,F.speed))*1000) return;
  F.missed=true;
  F.heat=Math.max(0,F.heat-BEAT_MISS);
  F.msg="空打ち"; F.msgT=.4; F.msgC="#8a7d70";
}
function spawnSparks(sc){
  const n=8+Math.round(sc/4);
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(Math.random()-.5)*2.4, v=60+Math.random()*220*(.4+sc/140);
    F.sparks.push({x:0,y:0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.6,t:0,
      c:sc>=100?"#fff3c4":(sc>=55?"#ffcf6a":"#ff8a3a")});
  }
  if(F.sparks.length>420) F.sparks.splice(0,F.sparks.length-420);
}
function finishForge(){
  const avg=F.scores.reduce((a,b)=>a+b,0)/F.scores.length;
  if(F.practice){ finishPractice(avg); return; }
  /* 90から先は伸びが半分になる。全打会心だけでは神品に届かず、設備と図鑑が要る */
  let raw=avg+S.up.anvil*2+dexQualityBonus()-F.penalty;
  if(raw>88) raw=88+(raw-88)*0.45;
  let q=Math.max(0,Math.min(100,Math.round(raw)));
  /* 真・神品は、締めのある型で、締めの二打を会心で決め、神品に届いたときだけ。それ以外は 99 止まり */
  const fin=hasFinale(F.rec)&&F.scores.slice(-FINALE_HITS).every(s=>s>=100);
  const shin=F.clean&&fin&&q>=GRADES[SHIN_GI].min;
  q=shin?100:Math.min(q,99);
  /* 画竜点睛を欠く。途中がどれだけ良くても、一打でも甘ければ業物とは呼べない */
  const flaw=!F.clean;
  if(flaw) q=Math.min(q,GRADES[GI_WAZA].min-1);
  const issin=shin&&F.issin;                       /* 一心で打ち上げた真・神品だけに印が残る */
  const r=F.rec, gi=gradeIdx(q), g=GRADES[gi];
  if(S.inv.length>=80) toast("倉庫がいっぱいだ。売るか飾るかしてくれ。","#e0645a");
  else{
    const nw=shin?{uid:S.uid++,id:r.id,q:q,lv:0,shin:true}:{uid:S.uid++,id:r.id,q:q,lv:0};
    if(issin) nw.issin=true;
    if(lockNew(nw)) nw.lock=true;
    S.inv.push(nw);
  }
  const d=S.dex[r.id]||(S.dex[r.id]={count:0,best:0});
  d.count++; d.best=Math.max(d.best,q);
  S.stats.forged++; if(gi>=SHIN_GI) S.stats.shinpin++; if(gi>SHIN_GI) S.stats.shin2=(S.stats.shin2||0)+1;
  /* 打ち方ごとの記録と免許 */
  const mk=modeKey(), ms=mstat(mk), lv0=licLv(mk), open0=issinOpen();
  ms.n++; ms.hits+=F.scores.length; ms.per+=F.scores.filter(x=>x>=100).length;
  ms.best=Math.max(ms.best,q); ms.bestGi=Math.max(ms.bestGi,gi);
  ms.gi[gi]=(ms.gi[gi]||0)+1;
  if(issin) S.stats.issin=(S.stats.issin||0)+1;
  const lv1=licLv(mk);
  if(lv1>lv0) setTimeout(()=>toast("<b class='hot'>"+MNAME[mk]+"　"+LICENSES[lv1-1].n+"</b> を許された。","#ffd166"),300);
  if(!open0&&issinOpen()) setTimeout(()=>toast("<b style='color:#fff0b8'>両伝</b>　どちらの打ち方でも皆伝に届いた。<b>一心打ち</b>が開く。","#fff0b8"),700);
  const ex=r.g*40+q;
  addExp(ex); checkCombo();
  S.lastPractice=null;
  S.lastResult={id:r.id,q:q,gi:gi,exp:ex,flaw:flaw,issin:issin,mode:modeKey(),
    price:Math.round(r.base*g.mult*(1+S.up.merchant*0.06)*(1+fameSell()/100)*(1+dexSellBonus(r.k)))};
  F.on=false; F.rec=null; F.msg=g.n; F.msgT=1.6; F.msgC=g.c;
  if(S.chain) S.chain.made++;
  render();
  tutEv("made");
  chainNext();
}

/* 稽古の打ち上がり。品はできず、腕前も図鑑も動かない。
   出来に直すといくつだったかと、拍からのずれだけを返す */
function finishPractice(avg){
  const r=F.rec;
  const per=F.scores.filter(x=>x>=100).length;
  const gd=F.scores.filter(x=>x<100&&x>=30).length;
  let raw=avg+S.up.anvil*2+dexQualityBonus()-F.penalty;
  if(raw>88) raw=88+(raw-88)*0.45;
  let q=Math.max(0,Math.min(99,Math.round(raw)));
  const flaw=!F.clean;
  if(flaw) q=Math.min(q,GRADES[GI_WAZA].min-1);
  let sum=0; F.errs.forEach(e=>sum+=(e.early?-e.ms:e.ms));
  S.lastPractice={id:r.id, beat:F.beat, n:F.scores.length, q:q, flaw:flaw,
    per:per, gd:gd, bad:F.scores.length-per-gd,
    errs:F.errs.map(e=>(e.early?"-":"+")+e.ms),
    lean:Math.round(sum/F.errs.length)};
  S.lastResult=null;
  F.on=false; F.rec=null; F.practice=false;
  F.msg="稽古おわり"; F.msgT=1.6; F.msgC="#9ad7ff";
  render();
}

/* ── 炉の描画 ── */
let fc=null,ctx=null,dpr=1,lastT=0,ambient=[],tintCv=null,tintCx=null;
function setupCanvas(){
  fc=document.getElementById("forge"); if(!fc){ ctx=null; return; }
  ctx=fc.getContext("2d");
  const rect=fc.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  fc.width=Math.floor(rect.width*dpr); fc.height=Math.floor(246*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawBlank(rec,ax,ay,heat){
  const hh=heat/100, hue=10+48*hh, lig=26+46*hh;
  const im=IMGS[rec.img];
  if(im&&im.complete&&im.naturalWidth){
    const C=180, half=C/2;
    if(!tintCv){ tintCv=document.createElement("canvas"); tintCv.width=tintCv.height=C; tintCx=tintCv.getContext("2d"); }
    const s=58+rec.g*5;
    tintCx.clearRect(0,0,C,C);
    tintCx.save(); tintCx.translate(half,half); tintCx.rotate(-Math.PI/4);
    tintCx.drawImage(im,-s/2,-s/2,s,s); tintCx.restore();
    tintCx.globalCompositeOperation="source-atop";
    tintCx.globalAlpha=0.28+0.60*hh;
    tintCx.fillStyle="hsl("+hue+",96%,"+(30+30*hh)+"%)"; tintCx.fillRect(0,0,C,C);
    tintCx.globalCompositeOperation="lighter";
    tintCx.globalAlpha=0.18+0.42*hh;
    tintCx.fillStyle="hsl("+(hue+8)+",100%,"+(16+24*hh)+"%)"; tintCx.fillRect(0,0,C,C);
    /* lighter は透けている所まで塗ってしまう。元の形で切り抜き直す（v17で修正） */
    tintCx.globalCompositeOperation="destination-in"; tintCx.globalAlpha=1;
    tintCx.save(); tintCx.translate(half,half); tintCx.rotate(-Math.PI/4);
    tintCx.drawImage(im,-s/2,-s/2,s,s); tintCx.restore();
    tintCx.globalCompositeOperation="source-over"; tintCx.globalAlpha=1;
    ctx.save(); ctx.shadowColor="hsla("+hue+",100%,58%,.95)"; ctx.shadowBlur=12+26*hh;
    ctx.drawImage(tintCv,ax-half,ay-56-half); ctx.restore();
    return;
  }
  /* 絵のない枠は図形で描く */
  ctx.save();
  ctx.shadowColor="hsla("+hue+",100%,55%,.9)"; ctx.shadowBlur=14+22*hh;
  ctx.fillStyle="hsl("+hue+",95%,"+lig+"%)";
  ctx.strokeStyle="hsl("+hue+",95%,"+lig+"%)";
  const y=ay-58, sl=rec.img;
  if(sl==="chakram"){
    ctx.lineWidth=5; ctx.beginPath(); ctx.arc(ax,y,17,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(ax+Math.cos(a)*24,y+Math.sin(a)*24);
      ctx.lineTo(ax+Math.cos(a+.28)*16,y+Math.sin(a+.28)*16);
      ctx.lineTo(ax+Math.cos(a-.28)*16,y+Math.sin(a-.28)*16);
      ctx.closePath(); ctx.fill(); }
  } else if(sl==="shuriken"){
    ctx.beginPath();
    for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr=(i%2===0)?23:8;
      const px=ax+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fill();
  } else if(sl==="kunai"){
    ctx.fillRect(ax-16,y-3,26,6);
    ctx.beginPath(); ctx.moveTo(ax+10,y-4); ctx.lineTo(ax+22,y); ctx.lineTo(ax+10,y+4); ctx.closePath(); ctx.fill();
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ax-21,y,5,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.fillRect(ax-22,y-3,44,6);
    ctx.beginPath(); ctx.moveTo(ax+22,y-3); ctx.lineTo(ax+31,y); ctx.lineTo(ax+22,y+3); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawScene(dt){
  if(!ctx) return;
  const w=fc.width/dpr,h=fc.height/dpr,gy=h-42,sy=gy-8;
  const hasBg=forgeBg.complete&&forgeBg.naturalWidth>0;
  if(hasBg){
    /* 幅いっぱいに敷き、床の線が合うよう下を揃える */
    const sc=Math.max(w/forgeBg.naturalWidth, sy/forgeBg.naturalHeight);
    const dw=forgeBg.naturalWidth*sc, dh=forgeBg.naturalHeight*sc;
    ctx.imageSmoothingEnabled=false;

    ctx.fillStyle="#2a2622";
    ctx.beginPath(); ctx.moveTo(ax-58,ay); ctx.lineTo(ax+44,ay); ctx.lineTo(ax+34,ay-16); ctx.lineTo(ax-38,ay-16); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#332e29"; ctx.fillRect(ax-20,ay-40,40,26);

    ctx.beginPath(); ctx.moveTo(ax-62,ay-40); ctx.lineTo(ax+40,ay-40); ctx.lineTo(ax+40,ay-52); ctx.lineTo(ax-52,ay-52); ctx.closePath(); ctx.fill();
    ctx.fillStyle=edge; ctx.fillRect(ax-62,ay-56,102,5);
    if(st>=1){ ctx.fillStyle="rgba(255,209,102,.18)"; ctx.fillRect(ax-62,ay-56,102,2); }
    if(st>=2){ ctx.fillStyle="#c9a24a"; ctx.fillRect(ax-52,ay-49,4,7); ctx.fillRect(ax+32,ay-49,4,7); }
  }
  const finale=inFinale(), pu=.55+.45*Math.sin(performance.now()/110);
  if(finale){
    /* 締めの間は金床が白金色に光る。台の周りに光の輪、床にも光が落ちる */
    const gg=ctx.createRadialGradient(ax,ay-30,10,ax,ay-30,130);
    gg.addColorStop(0,"rgba(255,246,210,"+(.55*pu)+")"); gg.addColorStop(.5,"rgba(255,230,160,"+(.22*pu)+")"); gg.addColorStop(1,"rgba(255,200,100,0)");
    ctx.fillStyle=gg; ctx.fillRect(ax-140,ay-170,280,190);

    ctx.beginPath(); ctx.ellipse(ax-6,ay+2,62+4*pu,10+2*pu,0,0,6.29); ctx.stroke(); ctx.restore();
  }
  if(F.on) drawBlank(F.rec,ax,ay,F.heat);

  if(finale){

    ctx.fillStyle="#787069"; ctx.fillRect(-16,-14,32,18);
    ctx.fillStyle="#948b83"; ctx.fillRect(-16,-14,32,5);
    ctx.restore();
  }
  ctx.save(); ctx.translate(ax,ay-58);
  for(let i=F.sparks.length-1;i>=0;i--){
    const p=F.sparks[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt;
    if(p.t>p.l){ F.sparks.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,1-p.t/p.l); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,2,2);
  }
  ctx.restore(); ctx.globalAlpha=1; ctx.restore();
  if(F.flash>0){ F.flash=Math.max(0,F.flash-dt*4); ctx.fillStyle="rgba(255,235,180,"+(F.flash*.2)+")"; ctx.fillRect(0,0,w,sy); }
  if(F.msgT>0){

    ctx.save(); ctx.font='10px "Meiryo UI",sans-serif'; ctx.textAlign="right";
    ctx.fillStyle="#9a8d80"; ctx.fillText("炉 温",w-10,16);

    ctx.fillStyle=F.heat<20?"#e0645a":(F.heat<45?"#ff9a3a":"#ffd166");
    ctx.fillRect(w-10-tw,20,tw*F.heat/100,5); ctx.restore();
  }
  drawGauge(w,gy);
}
function drawGauge(w,gy){
  const pad=14,gw=w-pad*2,gh=16,y=gy+2;
  /* 帯の周りは背景を描いていないので、はみ出した針や拍の輪が残る。毎回塗り直す */
  ctx.fillStyle="#0b0908"; ctx.fillRect(0,gy-8,w,fc.height/dpr-(gy-8));
  ctx.fillStyle="#0c0a09"; roundRect(pad,y,gw,gh,8); ctx.fill();
  ctx.strokeStyle=inFinale()?"#fff0b8":"#4a3f36"; ctx.lineWidth=1; roundRect(pad+.5,y+.5,gw-1,gh-1,8); ctx.stroke();
  if(!F.on){
    ctx.font='11px "Meiryo UI",sans-serif'; ctx.textAlign="center"; ctx.fillStyle="#6c6058";
    ctx.fillText("型を選んで炉に入れる",pad+gw/2,y+12); return;
  }
  const gx1=(F.zone-F.gw)*gw+pad, gx2=(F.zone+F.gw)*gw+pad;
  ctx.fillStyle="rgba(111,212,138,.20)";
  ctx.fillRect(Math.max(pad,gx1),y+2,Math.min(gx2,pad+gw)-Math.max(pad,gx1),gh-4);
  const px1=(F.zone-F.pw)*gw+pad, px2=(F.zone+F.pw)*gw+pad;
  const pg=ctx.createLinearGradient(px1,0,px2,0);
  pg.addColorStop(0,"rgba(255,209,102,.35)"); pg.addColorStop(.5,"rgba(255,243,196,.95)"); pg.addColorStop(1,"rgba(255,209,102,.35)");
  ctx.fillStyle=pg; ctx.fillRect(px1,y+2,px2-px1,gh-4);
  if(F.beat){
    /* 的は動かない。拍が来るたびに枠が広がって消える */
    const cx=F.zone*gw+pad;
    ctx.save();
    ctx.strokeStyle="rgba(255,209,102,.5)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,y-7); ctx.lineTo(cx,y+gh+7); ctx.stroke();
    if(F.pulse>0){
      const hw=7+(1-F.pulse)*30;
      ctx.globalAlpha=F.pulse*.7; ctx.lineWidth=2;
      ctx.strokeStyle=(F.count>0?"#9ad7ff":"#ffd166");
      roundRect(cx-hw,y-5,hw*2,gh+10,7); ctx.stroke();
    }
    ctx.restore();
  }
  const mx=F.pos*gw+pad;
  ctx.save(); ctx.shadowColor="#fff"; ctx.shadowBlur=10;
  ctx.fillStyle="#fff"; ctx.fillRect(mx-1.5,y-3,3,gh+6); ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

let stmAcc=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t;
  const iv=Math.max(1.0,2.4-S.up.larder*.25);
  stmAcc+=dt;
  if(stmAcc>=iv){ stmAcc-=iv; if(S.stamina<staminaMax()){ S.stamina=Math.min(staminaMax(),S.stamina+regenAmt()); paintStatus(); refreshQuestBtns(); }
    if(checkOrders()){ toast("注文書が入れ替わった。","#7fb7c9"); if(S.tab==="shop"&&!S.run) render(); else paintNavBadge(); }
    /* 開いたまま日をまたいだとき。褒美の釦を出し、手が空いていれば窓も開く */
    if(dailyPending()){ paintDailyBtn();
      if(!S.run&&!F.on&&!tutOn()&&!dmodal.classList.contains("open")&&!modal.classList.contains("open")) showDaily(); } }
  if(S.tab==="quest"&&S.run) scnDraw(dt);
  if(S.tab!=="forge"||!ctx) return;
  if(F.on){
    const prev=F.pos;
    F.pos+=F.dir*F.speed*dt;
    if(F.pos>1){ F.pos=1; F.dir=-1; }
    if(F.pos<0){ F.pos=0; F.dir=1; }
    if(F.pulse>0) F.pulse=Math.max(0,F.pulse-dt*3.2);
    if((prev-F.zone)*(F.pos-F.zone)<0){
      if(F.beat) beatTick();
      else F.miss++;
    }
    if(F.beat) beatWatch();
    /* 拍子打ちの構えの間は、まだ炉に置いているものとして冷まさない */
    if(!(F.beat&&F.count>0)) F.heat=Math.max(0,F.heat-Math.max(2.2,4.6-S.up.bellows*.45)*dt);
    widths();
  }
  drawScene(dt);
}

function pickFrom(tbl){
  let tot=0; for(const k in tbl) tot+=tbl[k];
  let r=Math.random()*tot;
  for(const k in tbl){ r-=tbl[k]; if(r<=0) return k; }
  return Object.keys(tbl)[0];
}

/* ── 鍛え直し（強化） ──
   等級そのものは動かさない。等級の倍率だけを一段につき7%伸ばし、力・特殊効果・売値に効かせる。
   出来栄えを直接上げると神品が溢れて神棚の設計が崩れるため、この形にしてある。 */
const ENH_MAX=10, ENH_PER=0.07;
const wLv=w=>(w&&w.lv)||0;
/* 一心で打ち上げた品は、等級はそのままに値と力が伸びる */
function effMult(w){ return GRADES[gradeIdx(w.q)].mult*(1+wLv(w)*ENH_PER)*((w&&w.issin)?ISSIN_MULT:1); }
function enhMatKey(w){ return GEN_ALLOY[RMAP[w.id].g-1]; }
function enhMatNum(w){ return 1+Math.floor(wLv(w)/2); }
/* 費えは常にその時点の売値より高くつく。鍛えて売れば儲かる、という抜け道を作らないため */
function enhCost(w){ return Math.round(sellPrice(w)*(0.9+0.35*wLv(w))); }
function canEnh(w){
  if(!w||wLv(w)>=ENH_MAX||!nightmareOpen()) return false;
  return S.gold>=enhCost(w)&&have(enhMatKey(w))>=enhMatNum(w);
}
function enhTag(w){
  return wLv(w)>0?'<span class="enh">+'+wLv(w)+'</span>':'';
}
function enhance(uid){
  const w=S.inv.find(x=>x.uid===uid); if(!w) return;
  if(wLv(w)>=ENH_MAX){ toast("これ以上は鍛えられない。","#e0645a"); return; }
  const r=RMAP[w.id], c=enhCost(w), mk=enhMatKey(w), mn=enhMatNum(w);
  if(S.gold<c){ toast("金が足りない。","#e0645a"); return; }
  if(have(mk)<mn){ toast(MAT[mk].n+" が足りない。","#e0645a"); return; }
  const before=wPower(w), bp=sellPrice(w);
  askConfirm("鍛え直す",
    '<div style="margin-bottom:8px"><b>'+r.n+'</b>　+'+wLv(w)+' → +'+(wLv(w)+1)+'</div>'+
    '<div class="kv"><span class="dim">費用</span><span class="hot">'+fmt(c)+'金</span></div>'+
    '<div class="kv"><span class="dim">鋼</span><span>'+MAT[mk].n+' ×'+mn+'</span></div>'+
    '<div class="note" style="margin-top:6px">等級は変わりません。力と特殊効果、そして売値が伸びます。</div>',
    "鍛える",()=>{
      S.gold-=c; S.mats[mk]-=mn; w.lv=wLv(w)+1;
      S.stats.enh=(S.stats.enh||0)+1;
      toast("<b>"+r.n+"</b> を鍛え直した。（+"+w.lv+"）　力 "+before+" → <b class='hot'>"+wPower(w)+"</b>",

/* ── 装備 ── */
const isEquipped=uid=>S.equip.main===uid||S.equip.sub===uid;
function wPower(w){
  if(!w) return 0;
  const r=RMAP[w.id];
  return Math.round(Math.sqrt(r.base)*(0.6+effMult(w)*0.5));
}
function equipped(){
  const m=S.inv.find(x=>x.uid===S.equip.main)||null;
  let sb=S.inv.find(x=>x.uid===S.equip.sub)||null;
  /* 相棒でない副えは、記録に残っていても効かせない */
  const pk=subKindOf(m);
  if(!pk||!sb||kindOf(sb)!==pk) sb=null;
  return {main:m,sub:sb};
}
function combatStats(){
  const b=baseStats(), e=equipped(), R=S.run;
  let atk=b.atk, def=b.def;
  const eff={chase:0,first:0,dodge:0,cut:0,crit:0,noDodge:false};
  const apply=(w,f)=>{
    if(!w) return;
    const k=RMAP[w.id].k, g=effMult(w);
    atk+=wPower(w)*f;
    if(k==="tanjin")      eff.chase+=(0.12+g*0.06)*f;
    else if(k==="ninja"){ eff.first+=f; eff.dodge+=(0.15+g*0.08)*f; }
    else if(k==="sword")  eff.cut+=(0.10+g*0.05)*f;
    else if(k==="katana") eff.crit+=(0.10+g*0.06)*f;
    else if(k==="great"){ atk+=wPower(w)*0.65*f; eff.noDodge=true; }
  };
  apply(e.main,1); apply(e.sub,0.5);
  /* 刀身に切った銘。主武器は丸ごと、副えは半分 */
  const mei=(w,f)=>{ meiObjs(w).forEach(M=>{ if(M.ef==="goldp") return;
    if(M.ef==="atkp") atk*=(1+M.per*f); else eff[M.ef]+=M.per*f; }); };
  mei(e.main,1); mei(e.sub,0.5);
  const ab=accBonus();                          /* 身につけた根付 */
  if(S.tomo){                                   /* 連れている付喪神の加護。根付で伸びる */
    const K=KAMIMAP[S.tomo], t=kamiTier(S.tomo);
    if(K&&t>0){ const pw=kamiPower(S.tomo)*(1+ab.kami); if(K.ef==="atk") atk*=(1+pw); else eff[K.ef]+=pw; }
  }
  atk*=(1+ab.atkp);
  eff.cut+=ab.cut; eff.crit+=ab.crit; eff.dodge+=ab.dodge; eff.chase+=ab.chase;
  if(R){ if(R.skills.includes("sharp")) atk*=1.15; if(R.skills.includes("tough")) def*=1.20; }
  eff.cut=Math.min(0.5,eff.cut); eff.chase=Math.min(0.6,eff.chase);
  eff.crit=Math.min(0.6,eff.crit); eff.dodge=Math.min(0.7,eff.dodge);
  return {atk:Math.round(atk),def:Math.round(def),eff};
}
function effList(){
  const cs=combatStats(), o=[];
  if(cs.eff.chase>0) o.push("追撃 "+Math.round(cs.eff.chase*100)+"%");
  if(cs.eff.first>0) o.push("先制");
  if(cs.eff.crit>0)  o.push("会心 "+Math.round(cs.eff.crit*100)+"%");
  if(cs.eff.cut>0)   o.push("被害軽減 "+Math.round(cs.eff.cut*100)+"%");
  if(cs.eff.dodge>0&&!cs.eff.noDodge) o.push("罠回避 "+Math.round(cs.eff.dodge*100)+"%");
  if(cs.eff.noDodge) o.push("罠を避けられない");
  return o;
}
