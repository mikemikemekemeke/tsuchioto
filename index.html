<style>
:root{
  --sumi:#14100e; --panel:#241d19; --line:#4a3f36;
  --ember:#ff7a1a; --hot:#ffd166; --quench:#7fb7c9;
  --ink:#efe6da; --dim:#9a8d80; --ok:#6fd48a; --bad:#e0645a;
  --gothic:"Meiryo UI","Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho","Noto Serif JP",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--sumi);color:var(--ink);font-family:var(--gothic);font-size:14px;line-height:1.5;overscroll-behavior:none;user-select:none;}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 100%,rgba(255,122,26,.10),transparent 60%),var(--sumi);}

#status{flex:0 0 auto;padding:8px 12px 6px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a1512,#14100e);}
.srow{display:flex;align-items:center;gap:10px;}
.brand{font-family:var(--mincho);font-size:19px;letter-spacing:.28em;color:var(--hot);text-shadow:0 0 12px rgba(255,122,26,.35);}
.brand small{display:block;font-family:var(--gothic);font-size:9px;letter-spacing:.18em;color:var(--dim);text-shadow:none;margin-top:-2px;}
.spacer{flex:1;}
.chip{font-size:11px;color:var(--dim);}
.chip b{font-family:var(--mincho);font-size:16px;color:var(--ink);font-weight:400;margin-left:3px;}
@media (max-width:400px){ .chip{font-size:10px;} .chip b{font-size:14px;margin-left:2px;} .srow{gap:7px;} }
.gold b{color:var(--hot);}
.bars{margin-top:6px;display:flex;gap:8px;align-items:center;}
.bar{flex:1;height:7px;border-radius:4px;background:#0d0a09;border:1px solid var(--line);overflow:hidden;}
.bar>i{display:block;height:100%;width:0%;transition:width .25s ease;}
.bar.exp>i{background:linear-gradient(90deg,#7a4a12,var(--hot));}
.bar.stm>i{background:linear-gradient(90deg,#2c5a66,var(--quench));}
.bar.elv>i{background:linear-gradient(90deg,#2a5c3a,var(--ok));}
.blabel{font-size:10px;color:var(--dim);width:50px;flex:0 0 auto;letter-spacing:.06em;}
.bnum{font-size:10px;color:var(--dim);width:58px;text-align:right;flex:0 0 auto;}

#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;}
h2.sec{font-family:var(--mincho);font-size:13px;font-weight:400;color:var(--hot);letter-spacing:.22em;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);}
h2.sec:first-child{margin-top:2px;}
.note{font-size:11px;color:var(--dim);line-height:1.7;}
.grouphead{font-family:var(--mincho);font-size:12px;letter-spacing:.2em;margin:14px 0 6px;color:#c9bdaf;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 11px;margin-bottom:8px;}
.card.locked{opacity:.42;}
.card.hl{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 20px rgba(255,122,26,.3);}
.ttl{font-family:var(--mincho);font-size:15px;letter-spacing:.05em;}
.mini{font-size:11px;color:var(--dim);}

.btn{font-family:var(--gothic);font-size:13px;font-weight:bold;color:#1a1108;
  background:linear-gradient(180deg,#ffb349,var(--ember));border:none;border-radius:5px;padding:9px 14px;cursor:pointer;
  box-shadow:0 2px 0 #7d3a06;letter-spacing:.06em;}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.sub{background:linear-gradient(180deg,#3c332c,#2a231e);color:var(--ink);box-shadow:0 2px 0 #14100e;border:1px solid var(--line);}
.btn.cool{background:linear-gradient(180deg,#9ed2e0,#5f9dae);color:#0d1b20;box-shadow:0 2px 0 #2f5a66;}
.btn:disabled{opacity:.35;box-shadow:none;transform:none;cursor:default;}
.btn.sm{font-size:11px;padding:6px 10px;}
.btn.xs{font-size:10px;padding:5px 8px;letter-spacing:0;}
.row{display:flex;align-items:center;gap:8px;}
.row.wrap{flex-wrap:wrap;}

.mat{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink);background:#191411;
  border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 4px;margin:2px 3px 2px 0;}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 6px currentColor,inset 0 -3px 4px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.35);}
.mat.short{color:var(--bad);border-color:#5c2a25;background:#241312;}

.lack{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
.lackttl{font-size:10px;color:var(--bad);letter-spacing:.14em;margin-bottom:5px;}
.lackrow{margin-bottom:6px;}
.lackname{font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.ways{display:flex;flex-wrap:wrap;gap:5px;}

/* 武器の絵。等級（出来栄え）で見え方が変わる */
.wic{width:42px;height:42px;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;
  background:#12100e;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.wic svg,.wic img{width:36px;height:36px;display:block;object-fit:contain;position:relative;z-index:2;}
.wic.big{width:76px;height:76px;border-radius:8px;}
.wic.big svg,.wic.big img{width:66px;height:66px;}
.wic.huge{width:150px;height:150px;border-radius:10px;margin:0 auto 12px;}
.wic.huge svg,.wic.huge img{width:132px;height:132px;}
.wic .fx{position:absolute;inset:0;z-index:1;}
.wic .in{position:absolute;inset:1.6px;z-index:1;background:#12100e;border-radius:4px;}

.wic.q0{border-color:#3b342d;}                                  /* 未鍛造・型のみ */
.wic.q1{border-color:#4a453f;}
.wic.q1 img,.wic.q1 svg{filter:grayscale(.55) saturate(.5) brightness(.78);}
.wic.q2{border-color:#5a5c62;background:#111214;}
.wic.q2 .fx{background:radial-gradient(circle at 50% 60%,rgba(207,214,224,.12),transparent 70%);}
.wic.q3{border-color:#3a5a44;background:#101512;}
.wic.q3 .fx{background:radial-gradient(circle at 50% 60%,rgba(111,212,138,.20),transparent 70%);}
.wic.q3 img,.wic.q3 svg{filter:drop-shadow(0 0 3px rgba(111,212,138,.5));}
.wic.q4{border-color:#2f5f78;background:#0e1419;}
.wic.q4 .fx{background:radial-gradient(circle at 50% 60%,rgba(127,183,201,.26),transparent 72%);}
.wic.q4 img,.wic.q4 svg{filter:saturate(1.06) drop-shadow(0 0 4px rgba(127,183,201,.75));}
.wic.q5{border-color:#523a76;background:#130f19;box-shadow:0 0 12px rgba(192,139,255,.25);}
.wic.q5 .fx{background:conic-gradient(from 0deg,rgba(192,139,255,.55),rgba(90,50,140,.12),rgba(226,196,255,.6),rgba(90,50,140,.12),rgba(192,139,255,.55));animation:spin 7s linear infinite;}
.wic.q5 img,.wic.q5 svg{filter:brightness(1.08) saturate(1.16) drop-shadow(0 0 6px rgba(192,139,255,.9));}
.wic.q6{border:none;background:none;box-shadow:0 0 18px rgba(255,209,102,.45);animation:pulse 2.4s ease-in-out infinite;}
.wic.q6 .fx{inset:-45%;background:conic-gradient(from 0deg,#ffd166,#fff3c4,#ff9a3a,#ffe7a0,#ff6b8a,#ffd166);animation:spin 4s linear infinite;opacity:.9;}
.wic.q6 img,.wic.q6 svg{filter:brightness(1.18) saturate(1.28) drop-shadow(0 0 5px rgba(255,240,190,.95)) drop-shadow(0 0 12px rgba(255,176,58,.75));}
.wic.dim{border-color:#332c26;background:#0f0d0b;box-shadow:none;animation:none;}
.wic.dim .fx{display:none;}
.wic.dim img,.wic.dim svg{filter:grayscale(1) brightness(.32) contrast(.9);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(255,209,102,.35);}50%{box-shadow:0 0 26px rgba(255,209,102,.7);}}

.grade{font-family:var(--mincho);font-size:12px;letter-spacing:.1em;}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--dim);}
.enh{font-size:10px;font-weight:700;border:1px solid #6b5a2a;background:#241d10;border-radius:3px;padding:1px 5px;color:#ffd166;margin-left:4px;}

#forgeWrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0b0908;}
#forge{display:block;width:100%;height:246px;}
#hitZone{position:absolute;inset:0;}
#strike{width:100%;margin-top:8px;padding:16px 0;font-size:17px;letter-spacing:.4em;font-family:var(--mincho);font-weight:400;}
.pips{display:flex;gap:5px;justify-content:center;margin-top:8px;}
.pip{width:9px;height:9px;border-radius:50%;background:#2a221d;border:1px solid var(--line);}
.pip.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 7px rgba(255,209,102,.7);}
.pip.perfect{background:#fff3c4;border-color:#fff3c4;}

.result{background:linear-gradient(180deg,#2c2119,#221b16);border:1px solid #6b4a1e;border-radius:6px;padding:12px;margin-bottom:10px;}
.rttl{font-size:10px;letter-spacing:.24em;color:var(--hot);margin-bottom:8px;}

.grpbar{display:flex;align-items:center;gap:8px;width:100%;background:#191411;border:1px solid var(--line);
  border-radius:5px;padding:9px 11px;margin:12px 0 8px;cursor:pointer;
  font-family:var(--mincho);font-size:13px;letter-spacing:.2em;text-align:left;color:#d8c9b4;}
.grpbar.open{background:#1f1813;color:var(--hot);}
.grpbar .cv{font-family:var(--gothic);font-size:10px;opacity:.8;letter-spacing:0;}
.grpbar .rc{margin-left:auto;font-family:var(--gothic);font-size:10px;letter-spacing:.04em;color:var(--dim);}

.toastbox{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:50;}
.toast{background:rgba(20,16,14,.95);border:1px solid var(--line);border-left:3px solid var(--hot);color:var(--ink);
  font-size:12px;padding:7px 13px;border-radius:4px;animation:tin .2s ease,tout .4s ease 2.4s forwards;max-width:88vw;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}}
@keyframes tout{to{opacity:0;transform:translateY(-6px);}}

#modal,#dmodal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(8,6,5,.78);visibility:hidden;opacity:0;transition:opacity .14s ease;}
#modal.open,#dmodal.open{visibility:visible;opacity:1;}
#dmodal{z-index:90;}
.mbox,.dbox{width:100%;max-width:350px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px;
  box-shadow:0 12px 40px rgba(0,0,0,.65);}
.dbox{max-width:360px;max-height:86dvh;overflow-y:auto;}
.mttl{font-family:var(--mincho);font-size:14px;letter-spacing:.16em;color:var(--hot);margin-bottom:10px;}
.mbody{font-size:12px;margin-bottom:14px;}
.mrow{display:flex;gap:8px;}
.mrow .btn{flex:1;}

#nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:linear-gradient(180deg,#1a1512,#100d0b);padding-bottom:env(safe-area-inset-bottom);}
#nav button{flex:1;background:none;border:none;color:var(--dim);padding:9px 0 8px;cursor:pointer;
  font-family:var(--mincho);font-size:13px;letter-spacing:.08em;position:relative;}
#nav button small{display:block;font-family:var(--gothic);font-size:8px;letter-spacing:.1em;opacity:.7;margin-top:1px;}
#nav button.on{color:var(--hot);}
#nav button.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:2px;background:var(--hot);box-shadow:0 0 8px var(--ember);}
#nav .badge{position:absolute;top:5px;right:20%;width:6px;height:6px;border-radius:50%;background:var(--bad);}

.combo{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;}
.combo .pb{flex:1;height:5px;border-radius:3px;background:#0d0a09;border:1px solid var(--line);overflow:hidden;}
.combo .pb i{display:block;height:100%;}
.combo .st{width:44px;text-align:right;font-size:10px;color:var(--dim);}
.combo.done .st{color:var(--ok);}

.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
.dim{color:var(--dim);} .hot{color:var(--hot);} .cool{color:var(--quench);} .ok{color:var(--ok);} .bad{color:var(--bad);}
.center{text-align:center;}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:26px 10px;line-height:1.9;}
.seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:54px;font-family:var(--gothic);font-size:11px;padding:6px 0;cursor:pointer;
  background:#191411;border:1px solid var(--line);color:var(--dim);border-radius:4px;}
.seg button.on{background:#3a2a18;color:var(--hot);border-color:#6b4a1e;}
.banner{background:#16241a;border:1px solid #2f5c3a;border-left:3px solid var(--ok);border-radius:5px;padding:8px 10px;font-size:12px;margin-bottom:10px;}

.stickytop{position:sticky;top:-12px;z-index:6;background:#14100e;margin:-12px -12px 0;padding:12px 12px 8px;
  border-bottom:1px solid var(--line);}

/* ── すごろく探索 ── */
.eqrow{display:flex;gap:8px;margin-bottom:8px;}
.stick{position:sticky;top:-12px;z-index:6;background:var(--sumi);
  margin:-12px -12px 0;padding:12px 12px 8px;
  box-shadow:0 8px 10px -8px rgba(0,0,0,.75);}
.stick h2.sec{margin-top:0;}
.eqslot{flex:1;min-width:0;background:#191411;border:1px solid var(--line);border-radius:5px;padding:8px 9px;cursor:pointer;text-align:left;font-family:var(--gothic);color:var(--ink);}
.eqslot.vacant{border-style:dashed;}
.eqlbl{font-size:10px;letter-spacing:.16em;color:var(--dim);margin-bottom:5px;}
.eqname{font-family:var(--mincho);font-size:13px;line-height:1.35;word-break:break-all;}
.board{display:flex;gap:4px;overflow-x:auto;padding:10px 4px 8px;background:#0f0c0a;border:1px solid var(--line);border-radius:6px;}
.tile{flex:0 0 auto;width:42px;height:50px;border-radius:5px;border:1px solid var(--line);background:#191411;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--dim);position:relative;}
.tile b{font-size:16px;line-height:1;font-family:var(--mincho);font-weight:400;}
.tile.done{opacity:.3;}
.tile.now{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 14px rgba(255,122,26,.4);background:#2a1d12;}
.tile.hid b{color:#4a3f36;}
.tile.bos{border-color:#7a2f2a;background:#241412;}
.pawn{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--hot);}
.dice{width:100%;padding:15px 0;font-size:17px;letter-spacing:.34em;font-family:var(--mincho);font-weight:400;}
.dnum{font-family:var(--mincho);font-size:38px;color:var(--hot);text-align:center;line-height:1.15;text-shadow:0 0 18px rgba(255,122,26,.5);}
.log{background:#12100e;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px;max-height:140px;overflow-y:auto;}
.log div{padding:3px 0;border-bottom:1px solid #201a16;}
.log div:last-child{border-bottom:none;}
.hpbar{height:9px;border-radius:5px;background:#0d0a09;border:1px solid var(--line);overflow:hidden;}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#7a2320,#e0645a);transition:width .2s ease;}
.skl{display:inline-flex;font-size:10px;background:#1b1a26;border:1px solid #3c3a56;color:#c9c4ee;border-radius:20px;padding:2px 9px;margin:2px 3px 2px 0;}
.kamidana{display:flex;gap:5px;margin-bottom:9px;padding:9px 7px 7px;border-radius:6px;
  background:linear-gradient(180deg,#241c14,#1a1511);border:1px solid #6b4a1e;
  box-shadow:inset 0 3px 10px rgba(255,209,102,.10),0 3px 0 #120e0b;}
.kami{flex:1;min-width:0;background:#141110;border:1px solid var(--line);border-radius:5px;
  padding:7px 3px 6px;text-align:center;color:var(--dim);font-family:var(--gothic);cursor:pointer;}
.kami .pic{display:block;width:100%;max-width:52px;margin:0 auto 3px;aspect-ratio:1;
  image-rendering:auto;filter:brightness(.22) grayscale(1) contrast(1.4);}
.kami.woke .pic{filter:drop-shadow(0 0 6px currentColor);}
.kami b{display:block;font-family:var(--mincho);font-size:13px;font-weight:400;letter-spacing:.04em;}
.kami span{display:block;font-size:9px;letter-spacing:.02em;}
.kami.woke{color:var(--ink);border-color:#5a4222;}

.kami.on{border-color:var(--hot);background:#1f1710;box-shadow:0 0 0 1px var(--hot),0 0 14px rgba(255,122,26,.28);}
.kami:disabled{cursor:default;}
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));
  background:radial-gradient(130% 70% at 50% 112%,rgba(255,122,26,.30),transparent 62%),
             radial-gradient(90% 50% at 50% -10%,rgba(127,183,201,.07),transparent 60%),#0d0a09;}
#title.gone{opacity:0;pointer-events:none;transition:opacity .45s ease;}
#title .tart{width:150px;height:150px;margin-bottom:2px;filter:drop-shadow(0 0 22px rgba(255,122,26,.55));}
#title .tart img{width:100%;height:100%;object-fit:contain;}
#title h1{font-family:var(--mincho);font-size:52px;font-weight:400;letter-spacing:.22em;
  margin:0;color:var(--ink);text-shadow:0 0 26px rgba(255,122,26,.5);text-indent:.22em;}
#title .yomi{font-family:var(--mincho);font-size:12px;letter-spacing:.5em;color:var(--hot);
  margin:2px 0 4px;text-indent:.5em;opacity:.85;}
#title .lead{font-size:11px;color:var(--dim);text-align:center;line-height:1.9;margin:10px 0 24px;}
#title .tbtns{width:100%;max-width:300px;display:flex;flex-direction:column;gap:9px;}
#title .tbtn{width:100%;padding:14px 12px;border-radius:6px;cursor:pointer;
  font-family:var(--mincho);font-size:17px;letter-spacing:.14em;
  background:linear-gradient(180deg,#3a2a18,#241a11);border:1px solid #7a5a28;color:var(--hot);
  box-shadow:0 3px 0 #140f0b,inset 0 1px 0 rgba(255,209,102,.18);}
#title .tbtn.sub{background:#191412;border-color:var(--line);color:var(--dim);font-size:14px;padding:11px;}
#title .tbtn small{display:block;font-family:var(--gothic);font-size:10px;letter-spacing:.02em;
  color:var(--dim);margin-top:3px;}
#title .tfoot{margin-top:20px;display:flex;gap:8px;align-items:center;}
#title .tfoot .mini{color:#6b6058;}
.sndbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:4px;
  font-size:10px;padding:3px 8px;cursor:pointer;font-family:var(--gothic);letter-spacing:.06em;}
.sndbtn.on{color:var(--hot);border-color:#7a5a28;}
.choice{display:flex;gap:8px;}
.choice button{flex:1;text-align:left;padding:10px;font-size:11px;line-height:1.5;background:#191411;border:1px solid var(--line);color:var(--ink);border-radius:5px;cursor:pointer;font-family:var(--gothic);}
.choice button b{display:block;font-family:var(--mincho);font-size:14px;margin-bottom:3px;letter-spacing:.08em;}
.choice button.risk{border-color:#6b3a1e;background:#1f1611;}
.choice button.risk b{color:var(--hot);}
/* スクロールのつまみは出さない。指で送る前提の画面で、盤面は前へ進むだけなので要らない */
#view,.board,.log,.dbox{scrollbar-width:none;-ms-overflow-style:none;}
#view::-webkit-scrollbar,.board::-webkit-scrollbar,.log::-webkit-scrollbar,.dbox::-webkit-scrollbar{
  display:none;width:0;height:0;}
.jumpbar{position:sticky;top:-12px;z-index:6;background:var(--sumi);
  margin:-12px -12px 10px;padding:12px 12px 9px;display:flex;gap:6px;
  box-shadow:0 8px 10px -8px rgba(0,0,0,.75);}
.jumpbar button{flex:1;padding:7px 0;font-size:11px;letter-spacing:.06em;border-radius:5px;
  background:#191411;border:1px solid var(--line);color:var(--dim);cursor:pointer;font-family:var(--gothic);}
.meitag{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:3px;font-size:9px;
  border:1px solid #6b4a1e;color:var(--hot);font-family:var(--gothic);vertical-align:middle;}
.shelf4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.shcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 3px 5px;min-height:70px;
  background:#191411;border:1px solid var(--line);border-radius:5px;cursor:pointer;
  font-family:var(--gothic);color:var(--ink);justify-content:center;}
.shcell .q{font-family:var(--mincho);font-size:13px;line-height:1;}
.shcell .g{font-size:9px;letter-spacing:.04em;}
.shcell.empty2{border-style:dashed;opacity:.45;cursor:default;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start;}
.gtile{display:flex;align-items:center;gap:7px;padding:6px 8px;min-width:0;text-align:left;cursor:pointer;
  background:#191411;border:1px solid var(--line);border-radius:5px;font-family:var(--gothic);color:var(--ink);}
.gtile.open{border-color:#6b4a1e;background:#241a12;}
.gtile.no{opacity:.45;}
.wic.sm{width:34px;height:34px;border-radius:5px;}
.wic.sm svg,.wic.sm img{width:28px;height:28px;}
.gtx{flex:1;min-width:0;}
.gn{display:block;font-family:var(--mincho);font-size:13px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gm{display:block;font-size:9px;color:var(--dim);margin-top:1px;}
.gdet{grid-column:1/-1;margin-top:0;}
.atile{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:#12100e;border:1px solid var(--line);font-family:var(--mincho);font-size:15px;
  text-shadow:0 0 8px currentColor;}
.gtile.open .atile{border-color:currentColor;}
/* 畳める見出し。h2.sec と同じ見た目のボタン */
.sech{display:flex;align-items:center;gap:7px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);
  border-radius:0;padding:5px 0;margin:16px 0 8px;cursor:pointer;text-align:left;
  font-family:var(--mincho);font-size:13px;color:var(--hot);letter-spacing:.22em;}
.sech:first-child{margin-top:2px;}
.sech .cv{font-family:var(--gothic);font-size:10px;letter-spacing:0;opacity:.8;}
.sech .rc{margin-left:auto;font-family:var(--gothic);font-size:10px;letter-spacing:.02em;color:var(--dim);}
.sech.fold{color:#b08a4a;}
.sech.sm{font-size:12px;letter-spacing:.2em;color:#c9bdaf;border-bottom:none;margin:12px 0 4px;}
.sech.sm.fold{color:#8a7a68;}
/* 在庫の札に売るボタンを添える */
.help details{border:1px solid var(--line);border-radius:5px;background:#191411;margin-bottom:6px;}
.help summary{cursor:pointer;padding:8px 10px;font-family:var(--mincho);font-size:13px;letter-spacing:.1em;color:var(--hot);list-style:none;}
.help summary::-webkit-details-marker{display:none;}
.help summary::before{content:"▶";font-family:var(--gothic);font-size:9px;margin-right:7px;opacity:.8;}
.help details[open] summary::before{content:"▼";}
.help .hb{padding:0 10px 9px;font-size:12px;line-height:1.75;}
.help .hb b{color:var(--ink);}
.help .hb .k{color:var(--hot);}
.help .hb ul{margin:4px 0 0;padding-left:16px;}
.help .hb li{margin:2px 0;}
.gwrap{display:flex;gap:4px;min-width:0;}
.gwrap .gtile{flex:1;min-width:0;}
.gwrap .gsell{flex:0 0 auto;padding:0 7px;font-size:10px;letter-spacing:0;border-radius:5px;}
.gtile .gm .bad{color:var(--bad);} .gtile .gm .ok{color:var(--ok);}
#scnwrap{width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:#06080a;margin-bottom:8px;line-height:0;}
#scnwrap canvas{display:block;width:100%;}
.hpick{display:flex;gap:8px;width:100%;max-width:300px;margin:0 0 10px;}
.hpick button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 8px;

<script>
"use strict";

/* ══════════ 素材 ══════════ */
const MAT={
  wood   :{n:"木材",     c:"#a97142", buy:6,   sell:3},
  copper :{n:"銅鉱石",   c:"#c87f4a", buy:10,  sell:5},
  coal   :{n:"石炭",     c:"#6a6873", buy:12,  sell:6},
  leather:{n:"獣革",     c:"#8b6b4a", buy:16,  sell:8},
  iron   :{n:"鉄鉱石",   c:"#98a0aa", buy:22,  sell:11},
  silver :{n:"銀鉱石",   c:"#d6e0ec", buy:55,  sell:27},
  magic  :{n:"魔鉱石",   c:"#a877e8", buy:120, sell:60},
  gold   :{n:"金鉱石",   c:"#e8bb3c", buy:160, sell:80},
  scale  :{n:"火竜の鱗", c:"#e0564a", buy:380, sell:190},
  star   :{n:"星鉄",     c:"#7fe0ec", buy:820, sell:410},
  rune   :{n:"古の刻印", c:"#f0e8b8", buy:0,   sell:600},
  /* 合金。店では買えず、精錬でしか作れない */
  bronze :{n:"青銅",     c:"#b98a4e", buy:0,   sell:27,   alloy:1},
  wrought:{n:"錬鉄",     c:"#8f97a2", buy:0,   sell:45,   alloy:2},
  tamaha :{n:"玉鋼",     c:"#e6eef8", buy:0,   sell:90,   alloy:3},
  makou  :{n:"魔鋼",     c:"#9b6ff0", buy:0,   sell:224,  alloy:4},
  ryuko  :{n:"竜鋼",     c:"#ef7a4a", buy:0,   sell:820,  alloy:5},
  shinko :{n:"神鋼",     c:"#ffe9a8", buy:0,   sell:1976, alloy:6}
};
const MATKEYS=Object.keys(MAT);
const ALLOYKEYS=MATKEYS.filter(k=>MAT[k].alloy);
/* 精錬　一次素材をまとめて合金にする。炉の当たり外れで一度に3〜5個できる */
const OUT_MIN=3, OUT_MAX=5, OUT_AVG=(OUT_MIN+OUT_MAX)/2;
const ALLOYS=[
  {k:"bronze", m:{copper:3,coal:2},                 need:1,  d:"銅を火に通し、粘りを出した合金。"},
  {k:"wrought",m:{iron:3,coal:2},                   need:3,  d:"鉄から不純物を叩き出したもの。"},
  {k:"tamaha", m:{iron:4,silver:1,coal:3},          need:6,  d:"炉底に沈む、鍛冶師の憧れ。"},
  {k:"makou",  m:{magic:2,gold:1,coal:4},           need:9,  d:"魔力を金で繋ぎ止めた鋼。"},
  {k:"ryuko",  m:{scale:2,star:1,coal:5},           need:12, d:"竜の鱗を溶かし込んだ鋼。"},
  {k:"shinko", m:{star:2,rune:1,ryuko:2,coal:6},    need:15, d:"神代の型にだけ許される鋼。"}
];
const ALMAP={}; ALLOYS.forEach(x=>ALMAP[x.k]=x);
/* 合金1個あたりの原価。産出を増やしたぶん、精錬して売るだけで儲かる抜け道ができないよう
   売値は常に原価の半分になるよう自動で決める。刻印のような非売品は売値の2倍を原価とみなす */
function alloyUnitCost(k){
  const a=ALMAP[k]; if(!a) return MAT[k].buy>0?MAT[k].buy:MAT[k].sell*2;
  let c=0; for(const m in a.m) c+=alloyUnitCost(m)*a.m[m];
  return c/OUT_AVG;
}
ALLOYS.forEach(a=>{ MAT[a.k].sell=Math.max(1,Math.round(alloyUnitCost(a.k)*0.5)); });
/* 世代ごとに使う鋼。鍛え直しの費えにも使う */
const GEN_ALLOY=["bronze","wrought","tamaha","makou","ryuko","shinko"];

const KAMI_PER=4, KAMI_MAX=3;                /* 神品4本で一段、三段まで（竜と星の型以降に限る） */
const KAMI_GEN=5;                              /* この世代から先の神品だけ捧げられる */
const kamiTier=k=>Math.min(KAMI_MAX,Math.floor((S.kami[k]||0)/KAMI_PER));
const kamiNext=k=>{ const t=kamiTier(k); return t>=KAMI_MAX?0:(KAMI_PER*(t+1)-(S.kami[k]||0)); };
/* 奉納料。売値に連動させると名声や世代で十万を超えて捧げられなくなるため、段ごとの定額にする */
const OFFER_COST=[8000,16000,24000];
function offerCost(w){ const r=RMAP[w.id]; return OFFER_COST[Math.min(OFFER_COST.length-1,kamiTier(r.k))]; }
function canOffer(w){ return w&&!RMAP[w.id].cast&&RMAP[w.id].g>=KAMI_GEN&&gradeIdx(w.q)===5&&w.uid!==S.equip.main&&w.uid!==S.equip.sub&&!S.shown.includes(w.uid); }

   狩場の中で売値の安い順に並べ、一段につき 1.2 倍ずつ重みを掛けていく（地獄なら 1.6 倍ずつ）。
   例：火竜の巣の鱗は 通常14% → 危険21% → 悪夢27% → 地獄34% */
const RARE_STEP=0.2;
function areaTbl(a,di){
  di=di|0; if(di<=0) return a.tbl;
  const keys=Object.keys(a.tbl).sort((x,y)=>MAT[x].sell-MAT[y].sell);
  const o={}; keys.forEach((k,i)=>{ o[k]=a.tbl[k]*Math.pow(1+RARE_STEP*di,i); });
  return o;
}

const SAVE_KEY="tsuchioto.save", SAVE_VER=14;
function saveable(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } }
const CAN_SAVE=saveable();
function mergeInto(dst,src){
  for(const k in src){
    const v=src[k];
    if(v&&typeof v==="object"&&!Array.isArray(v)&&dst[k]&&typeof dst[k]==="object"&&!Array.isArray(dst[k])) mergeInto(dst[k],v);
    else dst[k]=v;
  }
}
function saveGame(){
  if(!CAN_SAVE) return false;
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify({v:SAVE_VER,t:Date.now(),s:S})); return true; }
  catch(e){ return false; }
}
function readSave(){
  if(!CAN_SAVE) return null;
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(!d||d.v!==SAVE_VER||!d.s) return null;
    return d;
  }catch(e){ return null; }
}
function loadGame(){
  const d=readSave(); if(!d) return false;
  mergeInto(S,JSON.parse(JSON.stringify(DEFAULT_S)));

  S.inv.forEach(w=>{ if(w.mei&&!w.meis){ w.meis=[w.mei]; } delete w.mei; });

  if(!S.orderT||(S.orders||[]).some(o=>!o.rank)){ S.orders=[]; S.orderT=0; }

}

function smelt(k,times){
  const a=ALMAP[k]; if(!a) return;
  if(S.rank<a.need){ toast("まだこの鋼は扱えない。","#e0645a"); return; }
  let done=0,got=0;
  for(let i=0;i<times;i++){
    if(!canSmelt(a)) break;
    for(const m in a.m) S.mats[m]-=a.m[m];
    /* 炉が良いほど、もう一度振り直して良い方を取れることが増える（一段 12%） */
    const roll=()=>OUT_MIN+Math.floor(Math.random()*(OUT_MAX-OUT_MIN+1));
    let out=roll();
    if(Math.random()<(S.up.furnace||0)*0.12) out=Math.max(out,roll());
    S.mats[k]=(S.mats[k]||0)+out; got+=out; done++;
  }
  if(!done){ toast("素材が足りない。","#e0645a"); return; }
  const best=(done===1&&got===OUT_MAX);
  toast("<b>"+MAT[k].n+"</b> を "+got+"個 精錬した。"+(best?"　<b class='hot'>炉の機嫌がいい</b>":""),"#ffd166");

}

function shelfInfo(){
  const ws=S.shown.map(uid=>S.inv.find(x=>x.uid===uid)).filter(Boolean);
  let base=0; const cnt={};
  ws.forEach(w=>{ base+=w.q; cnt[RMAP[w.id].k]=(cnt[RMAP[w.id].k]||0)+1; });
  const pairA=Math.min(cnt.sword||0, cnt.tanjin||0);
  const pairB=Math.min(cnt.katana||0,cnt.ninja||0);
  const solo =cnt.great||0;
  const set=pairA*8+pairB*8+solo*6;
  return {base:Math.floor(base/10), pairA, pairB, solo, set, total:Math.floor(base/10)+set};
}

function titleNext(f){ return TITLES.find(x=>x.min>f)||null; }
function addFame(v){

    const tb=areaTbl(a,curDiff());
    let t=0; for(const x in tb) t+=tb[x];
    list.push({id:a.id,n:a.n,rate:Math.round(tb[k]/t*100),elv:a.elv,open:areaOpen(a)});
  });
  list.sort((x,y)=>x.open!==y.open?(x.open?-1:1):y.rate-x.rate);
  return {areas:list, buy:MAT[k].buy>0?MAT[k].buy:0};
}
function lackBlock(r){
  const lacks=[];
  for(const k in r.m){ const d=r.m[k]-have(k); if(d>0) lacks.push({k,d,need:r.m[k]}); }
  if(!lacks.length) return "";
  let h='<div class="lack"><div class="lackttl">足りない素材</div>';
  lacks.forEach(L=>{
    const m=MAT[L.k], src=sources(L.k);
    h+='<div class="lackrow"><div class="lackname"><i class="dot" style="color:'+m.c+';background:'+m.c+'"></i>'+
       '<b>'+m.n+'</b><span class="mini">　'+have(L.k)+'／'+L.need+'（あと'+L.d+'）</span></div><div class="ways">';
    src.areas.slice(0,2).forEach(a=>{
      h+= a.open
        ? '<button class="btn cool xs" data-act="goto" data-tab="quest" data-hl="'+a.id+'">'+a.n+'で探索　'+a.rate+'%</button>'
        : '<button class="btn sub xs" disabled>'+a.n+'（探索Lv'+a.elv+'で開放）</button>';
    });
    if(m.alloy){
      const al=ALMAP[L.k], ok=canSmelt(al);
      h+='<button class="btn xs" data-act="smelt" data-id="'+L.k+'" data-n="'+Math.ceil(L.d/OUT_MIN)+'"'+(ok?"":" disabled")+'>精錬する（'+OUT_MIN+'〜'+OUT_MAX+'個できる）</button>';
      h+='<span class="tag">'+Object.keys(al.m).map(x=>MAT[x].n+"×"+al.m[x]).join("・")+'</span>';
      if(S.rank<al.need) h+='<span class="tag">腕前が足りない</span>';
    }
    else h+= src.buy>0
      ? '<button class="btn xs" data-act="goto" data-tab="shop" data-hl="'+L.k+'" data-qty="'+L.d+'" data-back="'+r.id+'">商店で'+L.d+'個買う　'+fmt(src.buy*L.d)+'金</button>'
      : '<span class="tag">店では買えない</span>';
    h+='</div></div>';
  });
  return h+'</div>';
}
function matChip(k,need){
  const m=MAT[k], h=have(k), short=(need!==undefined&&h<need);
  const label=(need!==undefined)?(m.n+" "+h+"/"+need):(m.n+" "+h);
  return '<span class="mat'+(short?" short":"")+'"><i class="dot" style="color:'+m.c+';background:'+m.c+'"></i>'+label+'</span>';
}

/* ══════════ 腕前 ══════════ */
function addExp(v){
  S.exp+=v; let up=false;
  while(S.rank<21&&S.exp>=needExp(S.rank)){ S.exp-=needExp(S.rank); S.rank++; up=true; }
  if(S.rank>=21) S.exp=0;
  if(up){
    toast("腕が上がった。<b class='hot'>"+rankName(S.rank)+"</b>","#ffd166");
    const nr=RECIPES.filter(x=>x.rank===S.rank);
    nr.forEach(x=>toast("新しい型を覚えた ── "+x.n,"#7fb7c9"));
    if(nr.length){ S.openGen={}; S.openGen[nr[0].g]=true; }
  }
}
function addExpE(v){
  S.eExp+=v; let up=false;
  while(S.eLv<20&&S.eExp>=needExpE(S.eLv)){ S.eExp-=needExpE(S.eLv); S.eLv++; up=true; }
  if(S.eLv>=20) S.eExp=0;
  if(up){
    toast("探索に慣れてきた。<b class='ok'>探索 Lv"+S.eLv+"</b>","#6fd48a");
    AREAS.filter(a=>a.elv===S.eLv).forEach(a=>toast("道が開けた ── "+a.n,"#6fd48a"));
  }
}
function paintStatus(){
  document.getElementById("stRank").textContent=rankName(S.rank);
  document.getElementById("stELv").textContent=S.eLv;
  const fe=document.getElementById("stFame"); fe.textContent=fmt(fame()); fe.title=titleOf(fame()).n;
  document.getElementById("stGold").textContent=fmt(S.gold);
  const nl=needExpE(S.eLv);
  document.getElementById("barELv").style.width=Math.min(100,S.eExp/nl*100)+"%";
  document.getElementById("numELv").textContent=Math.floor(S.eExp)+"/"+nl;
  const ne=needExp(S.rank);
  document.getElementById("barExp").style.width=Math.min(100,S.exp/ne*100)+"%";
  document.getElementById("numExp").textContent=Math.floor(S.exp)+"/"+ne;
  const sm=staminaMax();
  document.getElementById("barStm").style.width=Math.min(100,S.stamina/sm*100)+"%";
  document.getElementById("numStm").textContent=Math.floor(S.stamina)+"/"+sm;
}

/* ══════════ 鍛冶 ══════════ */
const F={on:false,rec:null,need:0,hits:0,scores:[],heat:100,pos:.5,dir:1,speed:.6,
  zone:.5,pw:.04,gw:.13,hammer:0,sparks:[],flash:0,shake:0,msg:"",msgT:0,msgC:"#ffd166",penalty:0,lock:0,miss:0};
function widths(){
  const b=S.up.bellows, hf=0.5+0.5*(F.heat/100);
  /* 会心帯の上を素通りするたびに、狙いどころがほんの少しずつ狭まる */
  const mf=Math.max(0.40,1-F.miss*0.05);
  F.pw=(0.030+b*0.0045)*hf*mf; F.gw=(0.115+b*0.012)*hf*mf;
}
function newZone(){ let z; do{ z=0.13+Math.random()*0.74; }while(Math.abs(z-F.pos)<0.15); F.zone=z; F.miss=0; }
function startForge(id){
  const r=RMAP[id];
  if(!r||!unlocked(r)) return;
  if(!canMake(r)){ toast("素材が足りない。下の案内から集めてくれ。","#e0645a"); return; }
  for(const k in r.m) S.mats[k]-=r.m[k];
  F.on=true; F.rec=r; F.need=hitsOf(r); F.hits=0; F.scores=[]; S.ftab="forge";
  F.heat=100; F.pos=.5; F.dir=1; F.speed=(0.52+r.g*0.055)*(1-S.up.hammer*0.035);
  F.penalty=0; F.sparks.length=0; F.hammer=0; F.flash=0; F.shake=0;
  F.msg="打て"; F.msgT=1.0; F.msgC="#ffd166"; F.lock=performance.now()+320;
  newZone(); widths(); render();
}
function reheat(){
  if(!F.on) return;
  if(have("coal")<1){ toast("石炭がない。","#e0645a"); return; }
  const pen=Math.max(1,6-(S.up.furnace||0));
  S.mats.coal--; F.heat=100; F.penalty+=pen;
  F.msg="再加熱"; F.msgT=.8; F.msgC="#ff7a1a";
  toast("炉に戻した。出来栄えに <b class='bad'>-"+pen+"</b>","#ff7a1a"); render();
}
function strike(){
  if(!F.on||performance.now()<F.lock) return;
  const d=Math.abs(F.pos-F.zone);
  let sc,msg,col;
  if(d<=F.pw){ sc=100; msg="会心"; col="#ffd166"; }
  else if(d<=F.gw){ const t=(d-F.pw)/Math.max(1e-4,F.gw-F.pw); sc=Math.round(92-42*t); msg="好打"; col="#6fd48a"; }
  else { sc=Math.max(0,Math.round(38-(d-F.gw)*150)); msg=sc>10?"甘い":"打ち損じ"; col="#e0645a"; F.heat=Math.max(0,F.heat-12); }
  if(F.heat<15) sc=Math.min(sc,40);
  F.scores.push(sc); F.hits++;
  F.hammer=1; F.flash=1; F.shake=Math.min(1,sc/100);
  scnForgeHit();
  F.msg=msg; F.msgT=.65; F.msgC=col;
  sfxHammer(sc);
  spawnSparks(sc);
  if(F.hits>=F.need){ finishForge(); return; }
  F.speed*=1.075; F.heat=Math.max(0,F.heat-5);
  newZone(); widths(); paintPips();
}
function spawnSparks(sc){
  const n=8+Math.round(sc/4);
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(Math.random()-.5)*2.4, v=60+Math.random()*220*(.4+sc/140);
    F.sparks.push({x:0,y:0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.6,t:0,
      c:sc>=100?"#fff3c4":(sc>=55?"#ffcf6a":"#ff8a3a")});
  }
  if(F.sparks.length>420) F.sparks.splice(0,F.sparks.length-420);
}
function finishForge(){
  const avg=F.scores.reduce((a,b)=>a+b,0)/F.scores.length;
  /* 90から先は伸びが半分になる。全打会心だけでは神品に届かず、設備と図鑑が要る */
  let raw=avg+S.up.anvil*2+dexQualityBonus()-F.penalty;
  if(raw>88) raw=88+(raw-88)*0.45;
  let q=Math.max(0,Math.min(100,Math.round(raw)));
  const r=F.rec, gi=gradeIdx(q), g=GRADES[gi];
  if(S.inv.length>=80) toast("倉庫がいっぱいだ。売るか飾るかしてくれ。","#e0645a");
  else S.inv.push({uid:S.uid++,id:r.id,q:q,lv:0});
  const d=S.dex[r.id]||(S.dex[r.id]={count:0,best:0});
  d.count++; d.best=Math.max(d.best,q);
  S.stats.forged++; if(g.n==="神品") S.stats.shinpin++;
  const ex=r.g*40+q;
  addExp(ex); checkCombo();
  S.lastResult={id:r.id,q:q,gi:gi,exp:ex,
    price:Math.round(r.base*g.mult*(1+S.up.merchant*0.06)*(1+fameSell()/100)*(1+dexSellBonus(r.k)))};
  F.on=false; F.rec=null; F.msg=g.n; F.msgT=1.6; F.msgC=g.c;
  if(S.chain) S.chain.made++;
  render();
  chainNext();
}

/* ── 炉の描画 ── */
let fc=null,ctx=null,dpr=1,lastT=0,ambient=[],tintCv=null,tintCx=null;
function setupCanvas(){
  fc=document.getElementById("forge"); if(!fc){ ctx=null; return; }
  ctx=fc.getContext("2d");
  const rect=fc.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  fc.width=Math.floor(rect.width*dpr); fc.height=Math.floor(246*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawBlank(rec,ax,ay,heat){
  const hh=heat/100, hue=10+48*hh, lig=26+46*hh;
  const im=IMGS[rec.img];
  if(im&&im.complete&&im.naturalWidth){
    const C=180, half=C/2;
    if(!tintCv){ tintCv=document.createElement("canvas"); tintCv.width=tintCv.height=C; tintCx=tintCv.getContext("2d"); }
    const s=58+rec.g*5;
    tintCx.clearRect(0,0,C,C);
    tintCx.save(); tintCx.translate(half,half); tintCx.rotate(-Math.PI/4);
    tintCx.drawImage(im,-s/2,-s/2,s,s); tintCx.restore();
    tintCx.globalCompositeOperation="source-atop";
    tintCx.globalAlpha=0.28+0.60*hh;
    tintCx.fillStyle="hsl("+hue+",96%,"+(30+30*hh)+"%)"; tintCx.fillRect(0,0,C,C);
    tintCx.globalCompositeOperation="lighter";
    tintCx.globalAlpha=0.18+0.42*hh;
    tintCx.fillStyle="hsl("+(hue+8)+",100%,"+(16+24*hh)+"%)"; tintCx.fillRect(0,0,C,C);
    /* lighter は透けている所まで塗ってしまう。元の形で切り抜き直す（v17で修正） */
    tintCx.globalCompositeOperation="destination-in"; tintCx.globalAlpha=1;
    tintCx.save(); tintCx.translate(half,half); tintCx.rotate(-Math.PI/4);
    tintCx.drawImage(im,-s/2,-s/2,s,s); tintCx.restore();
    tintCx.globalCompositeOperation="source-over"; tintCx.globalAlpha=1;
    ctx.save(); ctx.shadowColor="hsla("+hue+",100%,58%,.95)"; ctx.shadowBlur=12+26*hh;
    ctx.drawImage(tintCv,ax-half,ay-56-half); ctx.restore();
    return;
  }
  /* 絵のない枠は図形で描く */
  ctx.save();
  ctx.shadowColor="hsla("+hue+",100%,55%,.9)"; ctx.shadowBlur=14+22*hh;
  ctx.fillStyle="hsl("+hue+",95%,"+lig+"%)";
  ctx.strokeStyle="hsl("+hue+",95%,"+lig+"%)";
  const y=ay-58, sl=rec.img;
  if(sl==="chakram"){
    ctx.lineWidth=5; ctx.beginPath(); ctx.arc(ax,y,17,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(ax+Math.cos(a)*24,y+Math.sin(a)*24);
      ctx.lineTo(ax+Math.cos(a+.28)*16,y+Math.sin(a+.28)*16);
      ctx.lineTo(ax+Math.cos(a-.28)*16,y+Math.sin(a-.28)*16);
      ctx.closePath(); ctx.fill(); }
  } else if(sl==="shuriken"){
    ctx.beginPath();
    for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr=(i%2===0)?23:8;
      const px=ax+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fill();
  } else if(sl==="kunai"){
    ctx.fillRect(ax-16,y-3,26,6);
    ctx.beginPath(); ctx.moveTo(ax+10,y-4); ctx.lineTo(ax+22,y); ctx.lineTo(ax+10,y+4); ctx.closePath(); ctx.fill();
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ax-21,y,5,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.fillRect(ax-22,y-3,44,6);
    ctx.beginPath(); ctx.moveTo(ax+22,y-3); ctx.lineTo(ax+31,y); ctx.lineTo(ax+22,y+3); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawScene(dt){
  if(!ctx) return;
  const w=fc.width/dpr,h=fc.height/dpr,gy=h-42,sy=gy-8;
  const hasBg=forgeBg.complete&&forgeBg.naturalWidth>0;
  if(hasBg){
    /* 幅いっぱいに敷き、床の線が合うよう下を揃える */
    const sc=Math.max(w/forgeBg.naturalWidth, sy/forgeBg.naturalHeight);
    const dw=forgeBg.naturalWidth*sc, dh=forgeBg.naturalHeight*sc;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(forgeBg,0,sy-dh,dw,dh);
    ctx.fillStyle="rgba(8,6,5,.22)"; ctx.fillRect(0,0,w,sy);
  }else{
    const bg=ctx.createLinearGradient(0,0,0,sy);
    bg.addColorStop(0,"#0a0807"); bg.addColorStop(1,"#1a100a");
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,sy);
  }
  const heat=F.on?F.heat:45;
  const flick=.82+Math.sin(performance.now()/90)*.06+Math.random()*.05;
  const fx=hasBg?w*0.10:34, fy=hasBg?sy-40:sy-26;
  const fg=ctx.createRadialGradient(fx,fy,4,fx,fy,hasBg?150:120);
  fg.addColorStop(0,"rgba(255,170,60,"+(.55*flick*(.4+heat/160))+")");
  fg.addColorStop(1,"rgba(255,90,10,0)");
  ctx.fillStyle=fg; ctx.fillRect(0,0,w,sy);
  if(!hasBg){
    ctx.fillStyle="#241a14"; ctx.fillRect(10,sy-70,52,62);
    ctx.fillStyle="rgba(255,130,30,"+(.45+.4*flick*(heat/100))+")"; ctx.fillRect(18,sy-58,36,42);
  }
  if(Math.random()<.35) ambient.push({x:(hasBg?w*0.06:20)+Math.random()*40,y:hasBg?sy-44:sy-30,vy:-14-Math.random()*22,vx:(Math.random()-.5)*10,t:0,l:2.2+Math.random()});
  ctx.save();
  for(let i=ambient.length-1;i>=0;i--){
    const p=ambient[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx+=Math.sin(p.t*3)*6*dt;
    if(p.t>p.l){ ambient.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,1-p.t/p.l)*.7; ctx.fillStyle="#ff9a3a"; ctx.fillRect(p.x,p.y,1.6,1.6);
  }
  ctx.restore();
  let sh=0; if(F.shake>0){ sh=F.shake*3; F.shake=Math.max(0,F.shake-dt*5); }
  ctx.save(); ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  /* 金床は角（つの）を左向きにして、右側は鍛冶師の立ち位置として空けてある */
  const ax=w*.52, ay=sy-14;
  const anvilIm=anvilImgs[anvilStage()];
  if(anvilIm&&anvilIm.complete&&anvilIm.naturalWidth){
    /* 絵の金床。高さ 60 に合わせ、足元を ay に置く */
    const ah=64, aw=ah*anvilIm.naturalWidth/anvilIm.naturalHeight;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(anvilIm,ax-aw*0.62,ay-ah+2,aw,ah);
  }else{
    /* 図形の金床。台木の上に本体を置き、段が上がると縁が明るくなる */
    const st=anvilStage(), edge=["#4a443c","#6b6157","#8a7a5a"][st];
    ctx.fillStyle="#2a2622";
    ctx.beginPath(); ctx.moveTo(ax-58,ay); ctx.lineTo(ax+44,ay); ctx.lineTo(ax+34,ay-16); ctx.lineTo(ax-38,ay-16); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#332e29"; ctx.fillRect(ax-20,ay-40,40,26);
    ctx.fillStyle="#3d3730";
    ctx.beginPath(); ctx.moveTo(ax-62,ay-40); ctx.lineTo(ax+40,ay-40); ctx.lineTo(ax+40,ay-52); ctx.lineTo(ax-52,ay-52); ctx.closePath(); ctx.fill();
    ctx.fillStyle=edge; ctx.fillRect(ax-62,ay-56,102,5);
    if(st>=1){ ctx.fillStyle="rgba(255,209,102,.18)"; ctx.fillRect(ax-62,ay-56,102,2); }
    if(st>=2){ ctx.fillStyle="#c9a24a"; ctx.fillRect(ax-52,ay-49,4,7); ctx.fillRect(ax+32,ay-49,4,7); }
  }
  if(F.on) drawBlank(F.rec,ax,ay,F.heat);
  else { ctx.fillStyle="#3a332c"; ctx.fillRect(ax-22,ay-60,44,5); }
  const heroOK=drawForgeHero(ctx,ax,ay,dt);   /* 金床より後に描くので、体が切れない */
  if(F.hammer>0) F.hammer=Math.max(0,F.hammer-dt*6);
  if(!heroOK){                                 /* 姿が読めないときだけ、従来の槌を振る */
    const swing=F.on?(.35-F.hammer*1.25):.3;
    ctx.save(); ctx.translate(ax+56,ay-104); ctx.rotate(swing);
    ctx.fillStyle="#6b5847"; ctx.fillRect(-3,0,6,54);
    ctx.fillStyle="#787069"; ctx.fillRect(-16,-14,32,18);
    ctx.fillStyle="#948b83"; ctx.fillRect(-16,-14,32,5);
    ctx.restore();
  }
  ctx.save(); ctx.translate(ax,ay-58);
  for(let i=F.sparks.length-1;i>=0;i--){
    const p=F.sparks[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt;
    if(p.t>p.l){ F.sparks.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,1-p.t/p.l); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,2,2);
  }
  ctx.restore(); ctx.globalAlpha=1; ctx.restore();
  if(F.flash>0){ F.flash=Math.max(0,F.flash-dt*4); ctx.fillStyle="rgba(255,235,180,"+(F.flash*.2)+")"; ctx.fillRect(0,0,w,sy); }
  if(F.msgT>0){
    F.msgT-=dt; ctx.save(); ctx.globalAlpha=Math.min(1,F.msgT*2.2);
    ctx.font='300 30px "Yu Mincho","Hiragino Mincho ProN",serif'; ctx.textAlign="center";
    ctx.fillStyle=F.msgC; ctx.shadowColor=F.msgC; ctx.shadowBlur=18;
    ctx.fillText(F.msg,w/2,52); ctx.restore();
  }
  if(F.on){
    ctx.save(); ctx.font='10px "Meiryo UI",sans-serif'; ctx.textAlign="right";
    ctx.fillStyle="#9a8d80"; ctx.fillText("炉 温",w-10,16);
    const tw=64; ctx.fillStyle="#0d0a09"; ctx.fillRect(w-10-tw,20,tw,5);
    ctx.fillStyle=F.heat<20?"#e0645a":(F.heat<45?"#ff9a3a":"#ffd166");
    ctx.fillRect(w-10-tw,20,tw*F.heat/100,5); ctx.restore();
  }
  drawGauge(w,gy);
}
function drawGauge(w,gy){
  const pad=14,gw=w-pad*2,gh=16,y=gy+2;
  ctx.fillStyle="#0c0a09"; roundRect(pad,y,gw,gh,8); ctx.fill();
  ctx.strokeStyle="#4a3f36"; ctx.lineWidth=1; roundRect(pad+.5,y+.5,gw-1,gh-1,8); ctx.stroke();
  if(!F.on){
    ctx.font='11px "Meiryo UI",sans-serif'; ctx.textAlign="center"; ctx.fillStyle="#6c6058";
    ctx.fillText("型を選んで炉に入れる",pad+gw/2,y+12); return;
  }
  const gx1=(F.zone-F.gw)*gw+pad, gx2=(F.zone+F.gw)*gw+pad;
  ctx.fillStyle="rgba(111,212,138,.20)";
  ctx.fillRect(Math.max(pad,gx1),y+2,Math.min(gx2,pad+gw)-Math.max(pad,gx1),gh-4);
  const px1=(F.zone-F.pw)*gw+pad, px2=(F.zone+F.pw)*gw+pad;
  const pg=ctx.createLinearGradient(px1,0,px2,0);
  pg.addColorStop(0,"rgba(255,209,102,.35)"); pg.addColorStop(.5,"rgba(255,243,196,.95)"); pg.addColorStop(1,"rgba(255,209,102,.35)");
  ctx.fillStyle=pg; ctx.fillRect(px1,y+2,px2-px1,gh-4);
  const mx=F.pos*gw+pad;
  ctx.save(); ctx.shadowColor="#fff"; ctx.shadowBlur=10;
  ctx.fillStyle="#fff"; ctx.fillRect(mx-1.5,y-3,3,gh+6); ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ══════════ 時間 ══════════ */
let stmAcc=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t;
  const iv=Math.max(1.0,2.4-S.up.larder*.25);
  stmAcc+=dt;
  if(stmAcc>=iv){ stmAcc-=iv; if(S.stamina<staminaMax()){ S.stamina=Math.min(staminaMax(),S.stamina+regenAmt()); paintStatus(); refreshQuestBtns(); }
    if(checkOrders()){ toast("注文書が入れ替わった。","#7fb7c9"); if(S.tab==="shop"&&!S.run) render(); else paintNavBadge(); } }
  if(S.tab==="quest"&&S.run) scnDraw(dt);
  if(S.tab!=="forge"||!ctx) return;
  if(F.on){
    const prev=F.pos;
    F.pos+=F.dir*F.speed*dt;
    if(F.pos>1){ F.pos=1; F.dir=-1; }
    if(F.pos<0){ F.pos=0; F.dir=1; }
    if((prev-F.zone)*(F.pos-F.zone)<0) F.miss++;
    F.heat=Math.max(0,F.heat-Math.max(2.2,4.6-S.up.bellows*.45)*dt);
    widths();
  }
  drawScene(dt);
}

function pickFrom(tbl){
  let tot=0; for(const k in tbl) tot+=tbl[k];
  let r=Math.random()*tot;
  for(const k in tbl){ r-=tbl[k]; if(r<=0) return k; }
  return Object.keys(tbl)[0];
}

/* ── 鍛え直し（強化） ──
   等級そのものは動かさない。等級の倍率だけを一段につき7%伸ばし、力・特殊効果・売値に効かせる。
   出来栄えを直接上げると神品が溢れて神棚の設計が崩れるため、この形にしてある。 */
const ENH_MAX=10, ENH_PER=0.07;
const wLv=w=>(w&&w.lv)||0;
function effMult(w){ return GRADES[gradeIdx(w.q)].mult*(1+wLv(w)*ENH_PER); }
function enhMatKey(w){ return GEN_ALLOY[RMAP[w.id].g-1]; }
function enhMatNum(w){ return 1+Math.floor(wLv(w)/2); }
/* 費えは常にその時点の売値より高くつく。鍛えて売れば儲かる、という抜け道を作らないため */
function enhCost(w){ return Math.round(sellPrice(w)*(0.9+0.35*wLv(w))); }
function canEnh(w){
  if(!w||wLv(w)>=ENH_MAX||!nightmareOpen()) return false;
  return S.gold>=enhCost(w)&&have(enhMatKey(w))>=enhMatNum(w);
}
function enhTag(w){
  return wLv(w)>0?'<span class="enh">+'+wLv(w)+'</span>':'';
}
function enhance(uid){
  const w=S.inv.find(x=>x.uid===uid); if(!w) return;
  if(wLv(w)>=ENH_MAX){ toast("これ以上は鍛えられない。","#e0645a"); return; }
  const r=RMAP[w.id], c=enhCost(w), mk=enhMatKey(w), mn=enhMatNum(w);
  if(S.gold<c){ toast("金が足りない。","#e0645a"); return; }
  if(have(mk)<mn){ toast(MAT[mk].n+" が足りない。","#e0645a"); return; }
  const before=wPower(w), bp=sellPrice(w);
  askConfirm("鍛え直す",
    '<div style="margin-bottom:8px"><b>'+r.n+'</b>　+'+wLv(w)+' → +'+(wLv(w)+1)+'</div>'+
    '<div class="kv"><span class="dim">費用</span><span class="hot">'+fmt(c)+'金</span></div>'+
    '<div class="kv"><span class="dim">鋼</span><span>'+MAT[mk].n+' ×'+mn+'</span></div>'+
    '<div class="note" style="margin-top:6px">等級は変わりません。力と特殊効果、そして売値が伸びます。</div>',
    "鍛える",()=>{
      S.gold-=c; S.mats[mk]-=mn; w.lv=wLv(w)+1;
      S.stats.enh=(S.stats.enh||0)+1;
      toast("<b>"+r.n+"</b> を鍛え直した。（+"+w.lv+"）　力 "+before+" → <b class='hot'>"+wPower(w)+"</b>",
        "#ffd166");
      render();
    });
}

/* ── 装備 ── */
const isEquipped=uid=>S.equip.main===uid||S.equip.sub===uid;
function wPower(w){
  if(!w) return 0;
  const r=RMAP[w.id];
  return Math.round(Math.sqrt(r.base)*(0.6+effMult(w)*0.5));
}
function equipped(){
  const m=S.inv.find(x=>x.uid===S.equip.main)||null;
  let sb=S.inv.find(x=>x.uid===S.equip.sub)||null;
  if(m&&RMAP[m.id].k==="great") sb=null;
  return {main:m,sub:sb};
}
function combatStats(){
  const b=baseStats(), e=equipped(), R=S.run;
  let atk=b.atk, def=b.def;
  const eff={chase:0,first:0,dodge:0,cut:0,crit:0,noDodge:false};
  const apply=(w,f)=>{
    if(!w) return;
    const k=RMAP[w.id].k, g=effMult(w);
    atk+=wPower(w)*f;
    if(k==="tanjin")      eff.chase+=(0.12+g*0.06)*f;
    else if(k==="ninja"){ eff.first+=f; eff.dodge+=(0.15+g*0.08)*f; }
    else if(k==="sword")  eff.cut+=(0.10+g*0.05)*f;
    else if(k==="katana") eff.crit+=(0.10+g*0.06)*f;
    else if(k==="great"){ atk+=wPower(w)*0.65*f; eff.noDodge=true; }
  };
  apply(e.main,1); apply(e.sub,0.5);
  /* 刀身に切った銘。主武器は丸ごと、副えは半分 */
  const mei=(w,f)=>{ meiObjs(w).forEach(M=>{ if(M.ef==="goldp") return;
    if(M.ef==="atkp") atk*=(1+M.per*f); else eff[M.ef]+=M.per*f; }); };
  mei(e.main,1); mei(e.sub,0.5);
  const ab=accBonus();                          /* 身につけた根付 */
  if(S.tomo){                                   /* 連れている付喪神の加護。根付で伸びる */
    const K=KAMIMAP[S.tomo], t=kamiTier(S.tomo);
    if(K&&t>0){ const pw=K.per*t*(1+ab.kami); if(K.ef==="atk") atk*=(1+pw); else eff[K.ef]+=pw; }
  }
  atk*=(1+ab.atkp);
  eff.cut+=ab.cut; eff.crit+=ab.crit; eff.dodge+=ab.dodge; eff.chase+=ab.chase;
  if(R){ if(R.skills.includes("sharp")) atk*=1.15; if(R.skills.includes("tough")) def*=1.20; }
  eff.cut=Math.min(0.5,eff.cut); eff.chase=Math.min(0.6,eff.chase);
  eff.crit=Math.min(0.6,eff.crit); eff.dodge=Math.min(0.7,eff.dodge);
  return {atk:Math.round(atk),def:Math.round(def),eff};
}
function effList(){
  const cs=combatStats(), o=[];
  if(cs.eff.chase>0) o.push("追撃 "+Math.round(cs.eff.chase*100)+"%");
  if(cs.eff.first>0) o.push("先制");
  if(cs.eff.crit>0)  o.push("会心 "+Math.round(cs.eff.crit*100)+"%");
  if(cs.eff.cut>0)   o.push("被害軽減 "+Math.round(cs.eff.cut*100)+"%");
  if(cs.eff.dodge>0&&!cs.eff.noDodge) o.push("罠回避 "+Math.round(cs.eff.dodge*100)+"%");
  if(cs.eff.noDodge) o.push("罠を避けられない");
  return o;
}

/* ── おすすめの装備 ──
   「冒険に適した」を、一度の斬り合いで見込める働きに置き換えて数にする。
   見込む一撃 × 会心と追撃の上乗せ × 受ける害の減りぶん。罠回避と体力上限はわずかに加える。
   組み合わせは力の強い順に主12本×副12本まで。根付は武器を決めたあと、一つずつ足して効くものを二つ選ぶ */
function equipScore(){
  const cs=combatStats(), e=cs.eff, ab=accBonus();
  let v=cs.atk*(1+0.8*e.crit)*(1+0.6*e.chase)/(1-Math.min(0.5,e.cut));
  if(e.first>0) v*=1.04;
  if(!e.noDodge) v*=(1+0.15*e.dodge);
  v*=(1+ab.stam/Math.max(1,staminaMax()));
  return v;
}
function recommendEquip(){
  if(S.run){ toast("探索の途中は替えられない。","#e0645a"); return; }
  const pool=S.inv.filter(w=>!S.shown.includes(w.uid)).sort((a,b)=>wPower(b)-wPower(a));
  if(!pool.length){ toast("装備できる武器がない。","#e0645a"); return; }
  const mains=pool.slice(0,12), subs=pool.filter(w=>RMAP[w.id].k!=="great").slice(0,12);
  const keep={main:S.equip.main,sub:S.equip.sub,a:S.accEq.a,b:S.accEq.b};
  const before={cs:combatStats(),sc:equipScore()};
  let best=null, bs=-1;
  const tryEq=(m,sb)=>{
    S.equip.main=m?m.uid:null; S.equip.sub=sb?sb.uid:null;
    const v=equipScore(); if(v>bs){ bs=v; best={main:m,sub:sb}; }
  };
  mains.forEach(m=>{
    if(RMAP[m.id].k==="great"){ tryEq(m,null); return; }
    tryEq(m,null); subs.forEach(sb=>{ if(sb.uid!==m.uid) tryEq(m,sb); });
  });
  S.equip.main=best.main?best.main.uid:null; S.equip.sub=best.sub?best.sub.uid:null;
  /* 根付。ひとつ目を選び、それを着けたまま二つ目を選ぶ */
  S.accEq.a=null; S.accEq.b=null;
  const accs=S.acc.slice();
  ["a","b"].forEach(slot=>{
    let bx=null, bv=equipScore();
    accs.forEach(x=>{
      if(S.accEq.a===x.uid||S.accEq.b===x.uid) return;
      S.accEq[slot]=x.uid; const v=equipScore(); S.accEq[slot]=null;
      if(v>bv+1e-9){ bv=v; bx=x; }
    });
    S.accEq[slot]=bx?bx.uid:null;
  });
  const after={cs:combatStats(),sc:equipScore()};
  const pick={main:S.equip.main,sub:S.equip.sub,a:S.accEq.a,b:S.accEq.b};
  const same=(pick.main===keep.main&&pick.sub===keep.sub&&pick.a===keep.a&&pick.b===keep.b);
  /* いったん元に戻し、確認を取ってから入れ替える */
  S.equip.main=keep.main; S.equip.sub=keep.sub; S.accEq.a=keep.a; S.accEq.b=keep.b;
  if(same){ toast("いまの装備がいちばん向いている。","#6fd48a"); return; }
  const nm=u=>{ const w=S.inv.find(x=>x.uid===u); return w?(RMAP[w.id].n+(wLv(w)>0?("+"+wLv(w)):"")):"なし"; };
  const an=u=>{ const x=S.acc.find(z=>z.uid===u); return x?(ACCMAP[x.id].n+"（"+accGrade(x).n+"）"):"なし"; };
  const apply=()=>{
    S.equip.main=pick.main; S.equip.sub=pick.sub; S.accEq.a=pick.a; S.accEq.b=pick.b;
    toast("おすすめの装備に替えた。　攻撃 "+before.cs.atk+" → <b class='hot'>"+after.cs.atk+"</b>","#ffd166"); render();
  };
  askConfirm("おすすめの装備",
    '<div class="kv"><span class="dim">主武器</span><span>'+nm(pick.main)+'</span></div>'+
    '<div class="kv"><span class="dim">副武器</span><span>'+nm(pick.sub)+'</span></div>'+
    '<div class="kv"><span class="dim">根付　一</span><span>'+an(pick.a)+'</span></div>'+
    '<div class="kv"><span class="dim">根付　二</span><span>'+an(pick.b)+'</span></div>'+
    '<div class="kv" style="border-top:1px solid var(--line);margin-top:5px;padding-top:6px"><span class="dim">攻撃</span><span>'+before.cs.atk+' → <b class="hot">'+after.cs.atk+'</b></span></div>'+
    '<div class="kv"><span class="dim">防御</span><span>'+before.cs.def+' → <b class="cool">'+after.cs.def+'</b></span></div>'+
    '<div class="kv"><span class="dim">見込みの働き</span><span>'+fmt(before.sc)+' → <b class="hot">'+fmt(after.sc)+'</b></span></div>'+
    '<div class="note" style="margin-top:6px">一度の斬り合いで見込める働きが最も大きくなる組み合わせです。持ち帰りや拾う金の根付は数に入れていません。</div>',
    "替える",apply);
}
/* ── おすすめの飾り棚 ──
   評判は「出来の合計÷10」に「対の数×8」「大剣×6」を足したもの。
   対の組数と大剣の本数を総当たりし、残りの空きは出来の高い順に埋めて、いちばん評判が高い並びを選ぶ */
function shelfScore(ws){
  let base=0; const cnt={};
  ws.forEach(w=>{ base+=w.q; cnt[RMAP[w.id].k]=(cnt[RMAP[w.id].k]||0)+1; });
  return Math.floor(base/10)+Math.min(cnt.sword||0,cnt.tanjin||0)*8+Math.min(cnt.katana||0,cnt.ninja||0)*8+(cnt.great||0)*6;
}
function recommendShelf(){
  const max=shelfMax();
  const pool=S.inv.filter(w=>!isEquipped(w.uid)).sort((a,b)=>b.q-a.q);
  if(!pool.length){ toast("飾れる武器がない。","#e0645a"); return; }
  const byK={}; KINDS.forEach(k=>byK[k.id]=pool.filter(w=>RMAP[w.id].k===k.id));
  let best=null, bs=-1;
  const maxA=Math.min(byK.sword.length,byK.tanjin.length,Math.floor(max/2));
  const maxB=Math.min(byK.katana.length,byK.ninja.length,Math.floor(max/2));
  for(let pa=0;pa<=maxA;pa++) for(let pb=0;pb<=maxB;pb++){
    if(pa*2+pb*2>max) continue;
    for(let g=0;g<=Math.min(byK.great.length,max-pa*2-pb*2);g++){
      const set=[].concat(byK.sword.slice(0,pa),byK.tanjin.slice(0,pa),byK.katana.slice(0,pb),byK.ninja.slice(0,pb),byK.great.slice(0,g));
      const used=new Set(set.map(w=>w.uid));
      for(const w of pool){ if(set.length>=max) break; if(!used.has(w.uid)){ set.push(w); used.add(w.uid); } }
      const v=shelfScore(set); if(v>bs){ bs=v; best=set; }
    }
  }
  const now=shelfInfo().total;
  const ids=best.map(w=>w.uid);
  if(ids.length===S.shown.length&&ids.every(u=>S.shown.includes(u))){ toast("いまの並びがいちばん評判がいい。","#6fd48a"); return; }
  askConfirm("おすすめの飾り棚",
    '<div class="note" style="margin-bottom:6px">いま飾ってある品はいったん下ろし、次の並びに替えます。</div>'+
    best.map(w=>'<div class="kv"><span>'+RMAP[w.id].n+enhTag(w)+'</span><span style="color:'+grade(w.q).c+'">'+grade(w.q).n+'　'+w.q+'</span></div>').join("")+
    '<div class="kv" style="border-top:1px solid var(--line);margin-top:5px;padding-top:6px"><span class="dim">売値への上乗せ</span><span>+'+now+'% → <b class="hot">+'+bs+'%</b></span></div>',
    "並べる",()=>{ S.shown=ids; toast("飾り棚を並べ替えた。評判 <b class='hot'>+"+bs+"%</b>","#ffd166"); render(); });
}

/* ── 走りの進行 ── */
function pushLog(t){ const R=S.run; if(!R) return; R.log.unshift(t); if(R.log.length>40) R.log.pop(); }

/* ── おまかせ進行 ──
   分岐・技・行商までまとめて任せる。方針は出発前と道中のどちらでも変えられる。 */
const AUTO_SKILL_ORDER=["sharp","tough","dash","legs","eye","luck"]; /* 生き延びる技を優先 */
let autoT=null;
function autoClear(){ if(autoT){ clearTimeout(autoT); autoT=null; } }
function autoRoute(){
  const R=S.run, m=R.route||"safe";
  if(m==="risk") return "risk";
  if(m==="alt")  return ((R.seg||0)%2===0)?"safe":"risk";
  return "safe";
}
function autoSkill(){
  const R=S.run, o=R.offer||[];
  let best="none", bs=-1;
  o.forEach(id=>{
    let sc=AUTO_SKILL_ORDER.length-AUTO_SKILL_ORDER.indexOf(id);
    if(R.skills.includes(id)) sc=-1;            /* 重ねても効かないので避ける */
    if(sc>bs){ bs=sc; best=id; }
  });
  return (bs<0)?(o[0]||"none"):best;
}
function autoMerchant(){
  const R=S.run, a=AMAP[R.area];
  const fp=Math.round(40+a.ei*140), mp=Math.round(120+a.ei*280);
  if(S.stamina<staminaMax()*0.62&&S.gold>=fp) return "food";
  if(S.gold>=mp*8) return "mat";               /* 金が潤沢なら素材に替える */
  return "go";
}
function autoTick(){
  autoClear();
  const R=S.run;
  if(!R||!R.auto||S.tab!=="quest") return;
  if(R.phase==="move") return;                  /* 駒送りは自前で連鎖する */
  if(modal.classList.contains("open")||dmodal.classList.contains("open")) return;
  const wait={choice:380,roll:420,battle:420,skill:520,merchant:520}[R.phase];
  if(!wait) return;
  const ph=R.phase, sp=R.speed||1;
  autoT=setTimeout(()=>{
    autoT=null;
    const R2=S.run;
    if(!R2||!R2.auto||S.tab!=="quest"||R2.phase!==ph) return;
    if(modal.classList.contains("open")||dmodal.classList.contains("open")) return;
    if(ph==="choice")        chooseRoute(autoRoute());
    else if(ph==="roll")     rollDice();
    else if(ph==="battle")   battleTurn();
    else if(ph==="skill")    takeSkill(autoSkill());
    else if(ph==="merchant") merchantBuy(autoMerchant());
  },wait/sp);
}
const ROUTE_LABEL={safe:"安全寄り",risk:"険しい寄り",alt:"交互"};
function startRun(id){
  if(S.run) return;
  const a=AMAP[id]; if(!a) return;
  const di=curDiff(), D=DIFFS[di], cost=skipCost(a,di);
  if(!diffOpen(a,di)){ toast("まだこの段へは踏み込めない。","#e0645a"); return; }
  if(!equipped().main){ toast("主武器を装備してから出発してください。","#e0645a"); return; }
  if(needShinpin(di)&&!shinpinOK()){ toast(D.n+"は神品の装備でしか踏み込めない。"+SHINPIN_TEXT,"#e0645a"); return; }
  if(S.stamina<cost){ toast("体力が足りない。少し鎚を振って待て。","#e0645a"); return; }
  S.run={area:id,diff:di,len:a.len,pos:0,board:[{t:"start"}],skills:[],mats:{},gold:0,
         phase:"choice",enemy:null,offer:null,log:[],dice:0,speed:Math.min(S.runSpeed||1,maxSpeedAt(id,di)),
         auto:S.autoCfg.on,route:S.autoCfg.route,seg:0,kills:0,stone:0};
  pushLog("<b class='hot'>"+a.n+(di?("・"+D.n):"")+"</b> に踏み入った。");
  scnReset(); SC.area=id;
  render();
}
function appendSeg(mode){
  const R=S.run;
  while(R.board.length<R.len&&(R.board.length-1-R.pos)<4){
    for(let i=0;i<SEG&&R.board.length<R.len;i++){
      const last=(R.board.length===R.len-1);
      R.board.push({t:last?"boss":pickFrom(mode==="risk"?WRISK:WSAFE)});
    }
  }
}
function chooseRoute(mode){
  const R=S.run; if(!R||R.phase!=="choice") return;
  appendSeg(mode);
  R.seg=(R.seg||0)+1;
  pushLog(mode==="risk"?"険しい道を選んだ。":"安全な道を選んだ。");
  R.phase="roll"; render();
}
function nextPhase(){
  const R=S.run; if(!R) return;
  if(R.pos>=R.len-1) return;
  const ahead=R.board.length-1-R.pos;
  R.phase=(R.board.length<R.len&&ahead<4)?"choice":"roll";
  render();
}
function rollDice(){
  const R=S.run; if(!R||R.phase!=="roll") return;
  const min=R.skills.includes("legs")?2:1;
  let n=min+Math.floor(Math.random()*(3-min+1));
  if(R.skills.includes("dash")) n+=1;
  R.dice=n; R.phase="move"; render();
  setTimeout(()=>stepMove(n),260/R.speed);
}
function stepMove(left){
  const R=S.run; if(!R) return;
  const limit=Math.min(R.len-1,R.board.length-1);
  if(left<=0||R.pos>=limit){ landTile(); return; }
  R.pos++; render();
  setTimeout(()=>stepMove(left-1),210/R.speed);
}
function landTile(){
  const R=S.run; if(!R) return;
  const a=AMAP[R.area], tile=R.board[R.pos], cs=combatStats();
  const prog=R.pos/Math.max(1,R.len-1);
  if(tile.t==="boss"||tile.t==="enemy"){ spawnEnemy(tile.t==="boss",prog); return; }
  if(tile.t==="mat"){
    const Dm=dScale(R.diff||0);
    const n=Math.max(1,Math.round((3+Math.floor(Math.random()*3)+S.up.apprentice+(allGot()?1:0)+
      (R.skills.includes("eye")?1:0)+Math.round(accBonus().loot))*Dm.mat));
    const got={};
    const tb=areaTbl(a,R.diff||0);
    for(let i=0;i<n;i++){ const k=pickFrom(tb); got[k]=(got[k]||0)+1; R.mats[k]=(R.mats[k]||0)+1; }
    pushLog("鉱脈を掘った　"+Object.keys(got).map(k=>MAT[k].n+"×"+got[k]).join("、"));
  }
  else if(tile.t==="chest"){
    let g=Math.round((60+a.ei*220)*(0.7+Math.random()*0.8)*dScale(R.diff||0).gold*goldMul());
    if(R.skills.includes("luck")) g=Math.round(g*1.5);
    R.gold+=g; pushLog("宝箱を開けた　<b class='hot'>+"+fmt(g)+"金</b>");
  }
  else if(tile.t==="skill"){
    const pool=SKILLS.slice(), o=[];
    for(let i=0;i<2;i++) o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);
    R.offer=o; R.phase="skill"; render(); return;
  }
  else if(tile.t==="trap"){
    if(!cs.eff.noDodge&&Math.random()<cs.eff.dodge){ pushLog("<b class='cool'>罠を見切った。</b>"); }
    else{
      const d=Math.max(2,Math.round(staminaMax()*0.032*(0.8+Math.random()*0.5)));
      S.stamina=Math.max(0,S.stamina-d);
      pushLog("罠を踏んだ　体力 <b class='bad'>-"+d+"</b>");
    scnHurt();
      if(S.stamina<=0){ retreat(); return; }
    }
  }
  else if(tile.t==="rest"){
    const h=Math.round(staminaMax()*0.14)+5;
    S.stamina=Math.min(staminaMax(),S.stamina+h);
    pushLog("焚火で休んだ　体力 <b class='ok'>+"+h+"</b>");
    scnRest();
  }
  else if(tile.t==="merchant"){ R.phase="merchant"; render(); return; }
  paintStatus(); nextPhase();
}
function takeSkill(id){
  const R=S.run; if(!R||R.phase!=="skill") return;
  if(id!=="none"){ R.skills.push(id); pushLog("<b class='hot'>"+SKMAP[id].n+"</b> を身につけた。"); }
  R.offer=null; nextPhase();
}
function merchantBuy(kind){
  const R=S.run, a=AMAP[R.area]; if(!R||R.phase!=="merchant") return;
  const fp=Math.round(40+a.ei*140);
  if(kind==="food"){
    if(S.gold<fp){ toast("金が足りない。","#e0645a"); return; }
    S.gold-=fp; const h=Math.round(staminaMax()*0.25);
    S.stamina=Math.min(staminaMax(),S.stamina+h);
    pushLog("行商から保存食を買った　体力 <b class='ok'>+"+h+"</b>");
  }else if(kind==="mat"){
    const p=Math.round(120+a.ei*280);
    if(S.gold<p){ toast("金が足りない。","#e0645a"); return; }
    S.gold-=p; const k=pickFrom(areaTbl(a,R.diff||0)); R.mats[k]=(R.mats[k]||0)+3;
    pushLog("行商から "+MAT[k].n+"×3 を買った");
  }else pushLog("行商とすれ違った。");
  paintStatus(); nextPhase();
}

/* ── 戦い ── */
function spawnEnemy(boss,prog){
  const R=S.run, a=AMAP[R.area], cs=combatStats();
  const nm=boss?a.boss:FOES[R.area][Math.floor(Math.random()*FOES[R.area].length)];
  let hp=Math.round(a.ehp*(1+prog*0.5));
  let atk=a.eatk*(1+prog*0.3);
  let def=Math.round(a.edef*(1+prog*0.2));
  const D=dScale(R.diff||0);                    /* 難度は素の値に掛けるだけ。狩場の並びは触らない */
  hp=Math.round(hp*D.hp); atk*=D.atk; def=Math.round(def*D.def);
  if(boss){ hp=Math.round(hp*2.4); atk*=1.35; def=Math.round(def*1.2); }
  R.enemy={n:nm,hp:hp,max:hp,atk:atk,def:def,boss:boss,first:cs.eff.first>0,
           gold:Math.round((30+a.ei*130)*(boss?4:1)),drop:boss?(3+Math.floor(Math.random()*3)):(1+Math.floor(Math.random()*2))};
  R.phase="battle";
  pushLog(boss?("<b class='bad'>"+nm+"が立ちはだかった。</b>"):(nm+"が現れた。"));
  render();
}
function battleTurn(){
  const R=S.run; if(!R||R.phase!=="battle"||!R.enemy) return;
  const cs=combatStats(), E=R.enemy;
  const pierce=100/(100+E.def);
  let dmg=Math.max(1,Math.round(cs.atk*pierce*(0.88+Math.random()*0.24)));
  const crit=Math.random()<cs.eff.crit;
  if(crit) dmg=Math.round(dmg*1.8);
  scnStrike(crit);
  E.hp-=dmg;
  pushLog((crit?"<b class='hot'>会心</b>　":"")+"斬りつけた　<b>"+fmt(dmg)+"</b>");
  if(E.hp>0&&Math.random()<cs.eff.chase){
    const d2=Math.max(1,Math.round(cs.atk*0.6*pierce)); E.hp-=d2;
    pushLog("<b class='cool'>追撃</b>　<b>"+fmt(d2)+"</b>");
  }
  if(E.hp<=0){ winBattle(); return; }
  {
    let ed=E.atk*(100/(100+cs.def))*(0.88+Math.random()*0.24)*(1-cs.eff.cut);
    if(E.first){ E.first=false; ed*=0.35; pushLog("<b class='cool'>先手を取った。</b>"); }
    ed=Math.max(1,Math.round(ed));
    S.stamina=Math.max(0,S.stamina-ed);
    pushLog("反撃を受けた　体力 <b class='bad'>-"+ed+"</b>");
    scnHurt();
    if(S.stamina<=0){ retreat(); return; }
  }
  paintStatus(); render();
}
function winBattle(){
  const R=S.run, a=AMAP[R.area], E=R.enemy;
  R.kills++;
  const D=dScale(R.diff||0);
  const g=Math.round(E.gold*(0.8+Math.random()*0.5)*D.gold*goldMul()); R.gold+=g;
  const got={};
  const dn=Math.max(1,Math.round(E.drop*D.mat));
  const tb=areaTbl(a,R.diff||0);
  for(let i=0;i<dn;i++){ const k=pickFrom(tb); got[k]=(got[k]||0)+1; R.mats[k]=(R.mats[k]||0)+1; }
  pushLog("<b class='ok'>"+E.n+"を倒した</b>　+"+fmt(g)+"金　"+
    Object.keys(got).map(k=>MAT[k].n+"×"+got[k]).join("、"));
  /* 主の落とし物。危険以上でだけ出る */
  if(E.boss&&D.i>0){
    if(Math.random()<D.acc){
      const x=rollAcc(a,D.i);
      if(gainAcc(x)) pushLog("<b class='hot'>"+ACCMAP[x.id].n+"</b>（"+GRADES[gradeIdx(x.q)].n+"）を拾った");
    }
    if(D.mei>0){
      const ms=D.mei+Math.floor(Math.random()*2);
      S.meiStone+=ms; R.stone=(R.stone||0)+ms;
      pushLog("<b class='hot'>銘石</b> を "+ms+"つ拾った");
    }
  }
  const wasBoss=E.boss; R.enemy=null; paintStatus();
  if(wasBoss){ endRun(true,R.mats,R.gold,"win"); return; }
  nextPhase();
}
function fleeBattle(){
  const R=S.run; if(!R||!R.enemy) return;
  if(R.enemy.boss){ toast("主からは逃げられない。","#e0645a"); return; }
  const c=Math.max(3,Math.round(R.enemy.atk*(100/(100+combatStats().def))*2.5));
  S.stamina=Math.max(0,S.stamina-c);
  pushLog("背を向けて走った　体力 <b class='bad'>-"+c+"</b>");
  scnHurt();
  R.enemy=null; paintStatus();
  if(S.stamina<=0){ retreat(); return; }
  nextPhase();
}
function retreat(){
  const R=S.run; if(!R) return;
  const half={};
  for(const k in R.mats){ const n=Math.floor(R.mats[k]/2); if(n>0) half[k]=n; }
  endRun(false,half,Math.floor(R.gold/2),"flee");
}
/* 主を討ったときと引き返すときは、場面の見せ場をはさんでから結果へ移る。
   R.fin を立てるとおまかせも操作も止まるので、二重に走ることはない */
function endRun(cleared,mats,gold,kind){
  const R=S.run; if(!R||R.fin) return;
  R.fin=true; R.phase="fin"; R.enemy=null; autoClear();
  if(kind==="win") scnWin(); else scnFlee();
  render();
  setTimeout(()=>{ if(S.run&&S.run.fin) finishRun(cleared,mats,gold); }, kind==="win"?1200:1000);
}
function finishRun(cleared,mats,gold){
  const R=S.run; if(!R) return;
  const a=AMAP[R.area];
  for(const k in mats) S.mats[k]=(S.mats[k]||0)+mats[k];
  S.gold+=gold; S.stats.earned+=gold; S.stats.trips++;
  const D=dScale(R.diff||0);
  addExpE(Math.round((20+a.ei*20)*(cleared?1.3:0.5)*D.exp));
  if(cleared){
    S.clears[R.area]=clearsOf(R.area)+1;
    bumpClearD(R.area,D.i);
    if(!S.cleared[R.area]){
      S.cleared[R.area]=true;
      toast("<b class='hot'>"+a.n+"の主を討った。</b>","#ffd166");
    }
    noticeOpened();
  }
  S.lastRun={area:R.area,diff:D.i,cleared:cleared,mats:mats,gold:gold,kills:R.kills,pos:R.pos,len:R.len,
             skip:false,stone:R.stone||0};
  toast(cleared?("<b>"+a.n+(D.i?("・"+D.n):"")+"</b> を踏破した。"):("<b>"+a.n+"</b> から引き返した。持ち帰りは半分。"),
        cleared?"#6fd48a":"#e0645a");
  if(cleared) noticeDiff(R.area);
  S.run=null; autoClear(); render();
}

/* ── 早駆け（踏破後） ── */
function skipRun(id,times){
  const a=AMAP[id];
  const di=curDiff(), D=DIFFS[di], cost=skipCost(a,di);
  if(!diffOpen(a,di)){ toast("まだこの段へは踏み込めない。","#e0645a"); return; }
  if(needShinpin(di)&&!shinpinOK()){ toast(D.n+"は神品の装備でしか駆けられない。"+SHINPIN_TEXT,"#e0645a"); return; }
  if(!skipOpen(id,di)){ toast("早駆けはこの段を "+CLEAR_STEPS.skip+" 度踏破してから。（いま "+clearsD(id,di)+" 度）","#e0645a"); return; }
  let done=0, stone=0; const mats={}; let gold=0; const accs=[];
  const tb=areaTbl(a,di);
  for(let i=0;i<times;i++){
    if(S.stamina<cost) break;
    S.stamina-=cost;
    const n=Math.max(1,Math.round((Math.round(a.len*0.28)+S.up.apprentice+(allGot()?1:0)+
      Math.round(accBonus().loot))*D.mat));
    for(let j=0;j<n;j++){ const k=pickFrom(tb); mats[k]=(mats[k]||0)+1; S.mats[k]=(S.mats[k]||0)+1; }
    const g=Math.round((40+a.ei*190)*(0.8+Math.random()*0.5)*D.gold*goldMul());
    gold+=g; S.gold+=g; S.stats.earned+=g; S.stats.trips++;
    addExpE(Math.round((20+a.ei*20)*1.1*D.exp));
    S.clears[id]=clearsOf(id)+1;
    bumpClearD(id,di);
    /* 早駆けは盤面を省くぶん、落とし物は走り切るより渋い */
    if(D.i>0){
      if(Math.random()<D.acc*0.5){ const x=rollAcc(a,D.i); if(gainAcc(x)) accs.push(x); }
      if(D.mei>0&&Math.random()<0.6){ const ms=Math.max(1,Math.round(D.mei*0.6)); S.meiStone+=ms; stone+=ms; }
    }
    done++;
  }
  if(!done){ toast("体力が足りない。","#e0645a"); return; }
  S.lastRun={area:id,diff:di,cleared:true,mats:mats,gold:gold,kills:0,pos:a.len-1,len:a.len,
             skip:true,runs:done,stone:stone,accs:accs.length};
  toast("<b>"+a.n+(di?("・"+D.n):"")+"</b> を "+done+"回 駆け抜けた。","#7fb7c9");
  noticeOpened(); noticeDiff(id);
  render();
}

/* ══════════ 注文 ══════════
   札は4枚。12時間ごとに板ごと入れ替わる。納めた札は空きになり、次の入れ替えまで埋まらない。
   格は名声で決まり、上の格ほど金以外の報酬がつく */
const ORDER_SLOTS=4, ORDER_HOURS=12, ORDER_MS=ORDER_HOURS*3600*1000;
const ORDER_RANKS=[
  {id:"jo",n:"常連",fame:0,  give:3, minQ:[25,50],   qty:[1,3],gmul:1.0,c:"#c9bdaf",w:10,d:"金で払う"},
  {id:"jk",n:"上客",fame:30, give:8, minQ:[50,70],   qty:[2,3],gmul:1.3,c:"#6fd48a",w:6, d:"金に加えて銘石"},
  {id:"dm",n:"大名",fame:100,give:20,minQ:[70,85],   qty:[1,2],gmul:1.6,c:"#7fb7c9",w:5, d:"金に加えて根付か稀な石"},
  {id:"sd",n:"神殿",fame:250,give:50,minQ:[97],      qty:[1,1],gmul:2.0,c:"#ffd166",w:3, d:"金に加えて付喪神の神威"}
];
const ORMAP={}; ORDER_RANKS.forEach(x=>ORMAP[x.id]=x);
let orderSeq=1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function orderRank(){
  const f=fame(), tbl={};
  /* 常連は名声が上がるほど減り、上の格は名声が上がるほど増える */
  ORDER_RANKS.forEach(R=>{ if(f<R.fame) return;
    tbl[R.id]=(R.id==="jo")?R.w*Math.max(0.3,1-f/400):R.w*(1+(f-R.fame)/200); });
  return ORMAP[pickFrom(tbl)];
}
function makeOrder(){
  const R=orderRank();
  const un=RECIPES.filter(unlocked); if(!un.length) return null;
  const top=un[un.length-1].g;
  let pool;
  if(R.id==="sd")      pool=un.filter(x=>x.g>=KAMI_GEN);
  else if(R.id==="dm") pool=un.filter(x=>x.g>=top-1);
  else                 pool=un.filter(x=>x.g>=top-2);
  if(!pool.length) pool=un.filter(x=>x.g===top);
  const r=pick(pool);
  const qty=R.qty[0]+Math.floor(Math.random()*(R.qty[1]-R.qty[0]+1));
  const minQ=pick(R.minQ);
  const tm=1+TITLES.indexOf(titleOf(fame()))*0.25;          /* 称号で 1.0〜2.0倍 */
  const o={oid:orderSeq++,rank:R.id,id:r.id,qty,minQ,
    gold:Math.round(r.base*grade(minQ).mult*qty*1.75*R.gmul*tm), exp:Math.round(r.g*28*qty), give:R.give};
  if(R.id==="jk") o.stone=2+Math.floor(Math.random()*3);
  if(R.id==="dm"){ if(Math.random()<0.5) o.acc=1; else o.mat=(Math.random()<0.5)?{k:"rune",n:1}:{k:"star",n:2}; }
  if(R.id==="sd") o.kami=1;
  return o;
}
/* 12時間ごとの入れ替え。閉じていた間に何回分過ぎていても、開いたときに一度だけ引き直す */
function checkOrders(force){
  const now=Date.now();
  if(!force&&S.orderT&&now-S.orderT<ORDER_MS) return false;
  S.orders=[]; orderSeq=Math.max(orderSeq,1);
  for(let i=0;i<ORDER_SLOTS;i++){ const o=makeOrder(); if(o) S.orders.push(o); }
  S.orders.sort((a,b)=>ORDER_RANKS.indexOf(ORMAP[b.rank])-ORDER_RANKS.indexOf(ORMAP[a.rank]));
  if(S.chain) S.chain=null;
  S.orderT=now;
  return true;
}
function orderLeft(){ return Math.max(0,S.orderT+ORDER_MS-Date.now()); }
function fmtLeft(ms){ const m=Math.ceil(ms/60000), h=Math.floor(m/60); return h?(h+"時間"+(m%60)+"分"):(m+"分"); }
function fillOrders(){ if(!S.orderT) checkOrders(true); }
function orderRewardText(o){
  const t=[fmt(o.gold)+"金"];
  if(o.stone) t.push("銘石 "+o.stone);
  if(o.acc) t.push("根付（名匠以上）");
  if(o.mat) t.push(MAT[o.mat.k].n+" ×"+o.mat.n);
  if(o.kami) t.push(KAMIMAP[RMAP[o.id].k].n.replace(/（.*/,"")+"の神威 +"+o.kami);
  t.push("名声 +"+o.give);
  return t;
}
function startChain(oid){
  const o=S.orders.find(x=>x.oid===oid); if(!o) return;
  const remain=o.qty-matchOrder(o).length;
  if(remain<=0){ toast("もう足りている。そのまま納品できる。","#6fd48a"); return; }
  S.chain={oid:oid, made:0, cap:24};
  S.tab="forge"; S.hl=null; S.lastBuy=null;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="forge"));
  const r=RMAP[o.id];
  S.openGen={}; S.openGen[r.g]=true;
  if(canMake(r)) startForge(o.id);
  else { toast("素材が足りない。案内から集めてくれ。","#e0645a"); render(); }
}
function chainNext(){
  if(!S.chain) return;
  const o=S.orders.find(x=>x.oid===S.chain.oid);
  if(!o){ S.chain=null; render(); return; }
  const remain=o.qty-matchOrder(o).length;
  if(remain<=0){ S.chain=null; toast("注文の数がそろった。商店で納品できる。","#ffd166"); render(); return; }
  if(S.chain.made>=S.chain.cap){ S.chain=null; toast("ひとまず手を止めた。","#9a8d80"); render(); return; }
  const r=RMAP[o.id];
  if(!canMake(r)){ S.chain=null; toast("素材が尽きた。連続鍛造を止める。","#e0645a"); render(); return; }
  setTimeout(()=>{ if(!S.chain) return;
    if(S.tab!=="forge"){ S.chain=null; toast("鍛冶場を離れたので連続鍛造を止めた。","#9a8d80"); return; }
    startForge(o.id); }, 900);
}
function chainInfo(){
  if(!S.chain) return null;
  const o=S.orders.find(x=>x.oid===S.chain.oid);
  if(!o) return null;
  return {o:o, r:RMAP[o.id], got:matchOrder(o).length, need:o.qty};
}
/* 納品には鍛えていない品・出来の低い品から回す。装備中と飾り棚のものは手を付けない */
function matchOrder(o){
  return S.inv.filter(w=>w.id===o.id&&w.q>=o.minQ&&!S.shown.includes(w.uid)&&!isEquipped(w.uid))
    .sort((a,b)=>wLv(a)-wLv(b)||a.q-b.q);
}
function deliver(oid){
  const i=S.orders.findIndex(o=>o.oid===oid); if(i<0) return;
  const o=S.orders[i], list=matchOrder(o), r=RMAP[o.id];
  if(list.length<o.qty){ toast("品が揃っていない。","#e0645a"); return; }
  const use=list.slice(0,o.qty).map(w=>w.uid);
  S.inv=S.inv.filter(w=>!use.includes(w.uid));
  S.gold+=o.gold; S.stats.earned+=o.gold; S.stats.sold+=o.qty; S.stats.delivered=(S.stats.delivered||0)+1;
  const got=[fmt(o.gold)+"金"];
  if(o.stone){ S.meiStone+=o.stone; got.push("銘石 +"+o.stone); }
  if(o.acc){ const A=pick(ACCS); const x={uid:S.accUid++,id:A.id,q:85+Math.floor(Math.random()*16)}; if(gainAcc(x)) got.push(A.n+"（"+accGrade(x).n+"）"); }
  if(o.mat){ S.mats[o.mat.k]=(S.mats[o.mat.k]||0)+o.mat.n; got.push(MAT[o.mat.k].n+" ×"+o.mat.n); }
  if(o.kami){
    S.stats.temple=(S.stats.temple||0)+1;
    const k=r.k, before=kamiTier(k); S.kami[k]=(S.kami[k]||0)+o.kami; const after=kamiTier(k);
    got.push(KAMIMAP[k].n.replace(/（.*/,"")+"の神威 +"+o.kami);
    if(after>before){ if(!S.tomo) S.tomo=k; toast("<b class='hot'>"+KAMIMAP[k].n+"</b> が"+(after===1?"目を覚ました":"次の姿になった")+"。","#ffd166"); }
  }
  addExp(o.exp); addFame(o.give);
  S.orders.splice(i,1);
  if(o.kami) AREAS.forEach(a=>noticeDiff(a.id));
  toast("納品した。<b class='hot'>"+got.join("　")+"</b>　名声 +"+o.give,"#ffd166"); render();
}

/* ══════════ 売買 ══════════ */
function buyMat(k,n){
  const m=MAT[k];
  if(m.buy===0){ toast("これは売り物ではない。","#e0645a"); return; }
  const p=m.buy*n;
  if(S.gold<p){ toast("金が足りない。（"+fmt(p)+"金 必要）","#e0645a"); return; }
  askConfirm("購入の確認",
    '<div class="row" style="margin-bottom:8px"><i class="dot" style="color:'+m.c+';background:'+m.c+'"></i>'+
    '<div style="flex:1"><b>'+m.n+'</b> ×'+n+'</div></div>'+
    '<div class="kv"><span class="dim">単価</span><span>'+fmt(m.buy)+'金</span></div>'+
    '<div class="kv"><span class="dim">代金</span><span class="hot">'+fmt(p)+'金</span></div>'+
    '<div class="kv"><span class="dim">支払後の所持金</span><span>'+fmt(S.gold-p)+'金</span></div>'+
    '<div class="kv"><span class="dim">購入後の手持ち</span><span>'+(have(k)+n)+'個</span></div>',
    "買う",()=>{
      S.gold-=p; S.mats[k]=(S.mats[k]||0)+n; S.lastBuy={k,n,p};
      if(S.needMat&&S.needMat.k===k) S.needMat=null;
      toast("<b>"+m.n+" ×"+n+"</b> を買った。<b class='bad'>-"+fmt(p)+"金</b>　手持ち "+have(k)+"個","#6fd48a");
      if(backForgeDone()) return;
      render();
    });
}
function sellMat(k,n){
  if(have(k)<n) return;
  const g=MAT[k].sell*n;
  askConfirm("引き取りの確認",
    '<div style="margin-bottom:8px"><b>'+MAT[k].n+'</b> ×'+n+' を手放します。</div>'+
    '<div class="kv"><span class="dim">受取</span><span class="hot">'+fmt(g)+'金</span></div>',
    "売る",()=>{ S.mats[k]-=n; S.gold+=g; S.stats.earned+=g;
      toast(MAT[k].n+" ×"+n+" を売った。<b class='hot'>+"+fmt(g)+"金</b>","#ffd166"); render(); });
}
const foodPrice=()=>Math.round(staminaMax()*1.6);
const foodHeal =()=>Math.round(staminaMax()*0.3);
function buyFood(){
  const pr=foodPrice(), hl=foodHeal();

    '<div class="kv"><span class="dim">体力</span><span class="cool">+'+hl+'</span></div>',

}
function sellWeapon(uid){
  const w=S.inv.find(x=>x.uid===uid); if(!w) return;
  if(S.shown.includes(uid)){ toast("飾ってある品は売れない。","#e0645a"); return; }
  if(isEquipped(uid)){ toast("装備している品は売れない。","#e0645a"); return; }
  const p=sellPrice(w), r=RMAP[w.id], gi=gradeIdx(w.q), g=GRADES[gi];
  askConfirm("売却の確認",
    '<div class="row" style="margin-bottom:8px">'+wIcon(r,gi)+
    '<div style="flex:1"><b>'+r.n+enhTag(w)+'</b><div class="mini"><span style="color:'+g.c+'">'+g.n+'</span>　出来 '+w.q+'</div></div></div>'+
    '<div class="kv"><span class="dim">売値</span><span class="hot">'+fmt(p)+'金</span></div>'+
    (wLv(w)>0?'<div class="note" style="margin-top:6px">+'+wLv(w)+'まで鍛えた品です。注いだ金と鋼は戻りません。</div>':""),
    "売る",()=>{ S.gold+=p; S.stats.earned+=p; S.stats.sold++;
      S.inv=S.inv.filter(x=>x.uid!==uid);
      toast(r.n+" を売った。<b class='hot'>+"+fmt(p)+"金</b>","#ffd166"); render(); });
}
function sellBelow(th){
  const t=S.inv.filter(w=>w.q<th&&wLv(w)===0&&!S.shown.includes(w.uid)&&!isEquipped(w.uid));
  if(!t.length){ toast("該当する品がない。","#e0645a"); return; }
  let sum=0; t.forEach(w=>sum+=sellPrice(w));
  askConfirm("まとめて売る",
    '<div class="kv"><span class="dim">対象</span><span>'+t.length+'点</span></div>'+
    '<div class="kv"><span class="dim">合計</span><span class="hot">'+fmt(sum)+'金</span></div>'+
    '<div class="note" style="margin-top:6px">'+GRADES[gradeIdx(th-1)].n+'以下が対象です。飾ってある品・装備中の品・鍛え直した品は含みません。</div>',
    "売る",()=>{ const ids=t.map(w=>w.uid);
      S.inv=S.inv.filter(w=>!ids.includes(w.uid));
      S.gold+=sum; S.stats.earned+=sum; S.stats.sold+=t.length;
      toast(t.length+"点を売った。<b class='hot'>+"+fmt(sum)+"金</b>","#ffd166"); render(); });
}
function toggleShow(uid){
  const i=S.shown.indexOf(uid);
  if(i<0&&isEquipped(uid)){ toast("装備している品は飾れない。","#e0645a"); return; }
  if(i>=0) S.shown.splice(i,1);
  else{ if(S.shown.length>=shelfMax()){ toast("飾り棚が埋まっている。","#e0645a"); return; } S.shown.push(uid); }
  render();
}
function buyUp(id){
  const u=UMAP[id]; if(S.up[id]>=u.max) return;

  if(S.gold<c){ toast("金が足りない。","#e0645a"); return; }

    '<div class="kv"><span class="dim">支払後の所持金</span><span>'+fmt(S.gold-c)+'金</span></div>',

}

const SC={
  wrap:null, cv:null, g:null, w:0, h:0, dpr:1, ready:false,
  area:"mori", scroll:0, t:0, spd:0,
