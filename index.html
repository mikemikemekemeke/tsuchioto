/* ── おすすめの装備 ──
   「冒険に適した」を、一度の斬り合いで見込める働きに置き換えて数にする。
   見込む一撃 × 会心と追撃の上乗せ × 受ける害の減りぶん。罠回避と体力上限はわずかに加える。
   組み合わせは力の強い順に主12本×副12本まで。根付は武器を決めたあと、一つずつ足して効くものを二つ選ぶ */
function equipScore(){
  const cs=combatStats(), e=cs.eff, ab=accBonus();
  let v=cs.atk*(1+0.8*e.crit)*(1+0.6*e.chase)/(1-Math.min(0.5,e.cut));
  if(e.first>0) v*=1.04;
  if(!e.noDodge) v*=(1+0.15*e.dodge);
  v*=(1+ab.stam/Math.max(1,staminaMax()));
  return v;
}
function recommendEquip(){
  if(S.run){ toast("探索の途中は替えられない。","#e0645a"); return; }
  const pool=S.inv.filter(w=>!S.shown.includes(w.uid)).sort((a,b)=>wPower(b)-wPower(a));
  if(!pool.length){ toast("装備できる武器がない。","#e0645a"); return; }
  const mains=pool.filter(w=>isMainKind(kindOf(w))).slice(0,12);
  if(!mains.length){ toast("主武器に持てる長剣・刀・大剣がない。","#e0645a"); return; }
  const keep={main:S.equip.main,sub:S.equip.sub,a:S.accEq.a,b:S.accEq.b};
  const before={cs:combatStats(),sc:equipScore()};
  let best=null, bs=-1;
  const tryEq=(m,sb)=>{
    S.equip.main=m?m.uid:null; S.equip.sub=sb?sb.uid:null;
    const v=equipScore(); if(v>bs){ bs=v; best={main:m,sub:sb}; }
  };
  mains.forEach(m=>{
    const pk=subKindOf(m);
    if(!pk){ tryEq(m,null); return; }
    tryEq(m,null);
    pool.filter(w=>kindOf(w)===pk).slice(0,12).forEach(sb=>{ if(sb.uid!==m.uid) tryEq(m,sb); });
  });
  S.equip.main=best.main?best.main.uid:null; S.equip.sub=best.sub?best.sub.uid:null;
  /* 根付。ひとつ目を選び、それを着けたまま二つ目を選ぶ */
  S.accEq.a=null; S.accEq.b=null;
  const accs=S.acc.slice();
  ["a","b"].forEach(slot=>{
    let bx=null, bv=equipScore();
    accs.forEach(x=>{
      if(S.accEq.a===x.uid||S.accEq.b===x.uid) return;
      S.accEq[slot]=x.uid; const v=equipScore(); S.accEq[slot]=null;
      if(v>bv+1e-9){ bv=v; bx=x; }
    });
    S.accEq[slot]=bx?bx.uid:null;
  });
  const after={cs:combatStats(),sc:equipScore()};
  const pick={main:S.equip.main,sub:S.equip.sub,a:S.accEq.a,b:S.accEq.b};
  const same=(pick.main===keep.main&&pick.sub===keep.sub&&pick.a===keep.a&&pick.b===keep.b);
  /* いったん元に戻し、確認を取ってから入れ替える */
  S.equip.main=keep.main; S.equip.sub=keep.sub; S.accEq.a=keep.a; S.accEq.b=keep.b;
  if(same){ toast("いまの装備がいちばん向いている。","#6fd48a"); return; }
  const nm=u=>{ const w=S.inv.find(x=>x.uid===u); return w?(RMAP[w.id].n+(wLv(w)>0?("+"+wLv(w)):"")):"なし"; };
  const an=u=>{ const x=S.acc.find(z=>z.uid===u); return x?(ACCMAP[x.id].n+"（"+accGrade(x).n+"）"):"なし"; };
  const apply=()=>{
    S.equip.main=pick.main; S.equip.sub=pick.sub; S.accEq.a=pick.a; S.accEq.b=pick.b;
    toast("おすすめの装備に替えた。　攻撃 "+before.cs.atk+" → <b class='hot'>"+after.cs.atk+"</b>","#ffd166"); render();
  };
  askConfirm("おすすめの装備",
    '<div class="kv"><span class="dim">主武器</span><span>'+nm(pick.main)+'</span></div>'+
    '<div class="kv"><span class="dim">副武器</span><span>'+nm(pick.sub)+'</span></div>'+
    '<div class="kv"><span class="dim">根付　一</span><span>'+an(pick.a)+'</span></div>'+
    '<div class="kv"><span class="dim">根付　二</span><span>'+an(pick.b)+'</span></div>'+
    '<div class="kv" style="border-top:1px solid var(--line);margin-top:5px;padding-top:6px"><span class="dim">攻撃</span><span>'+before.cs.atk+' → <b class="hot">'+after.cs.atk+'</b></span></div>'+
    '<div class="kv"><span class="dim">防御</span><span>'+before.cs.def+' → <b class="cool">'+after.cs.def+'</b></span></div>'+
    '<div class="kv"><span class="dim">見込みの働き</span><span>'+fmt(before.sc)+' → <b class="hot">'+fmt(after.sc)+'</b></span></div>'+
    '<div class="note" style="margin-top:6px">一度の斬り合いで見込める働きが最も大きくなる組み合わせです。持ち帰りや拾う金の根付は数に入れていません。</div>',
    "替える",apply);
}
/* ── おすすめの飾り棚 ──
   評判は「出来の合計÷10」に「対の数×8」「大剣×6」を足したもの。
   対の組数と大剣の本数を総当たりし、残りの空きは出来の高い順に埋めて、いちばん評判が高い並びを選ぶ */
function shelfScore(ws){
  let base=0; const cnt={};
  ws.forEach(w=>{ base+=w.q; cnt[RMAP[w.id].k]=(cnt[RMAP[w.id].k]||0)+1; });
  return Math.floor(base/10)+Math.min(cnt.sword||0,cnt.tanjin||0)*8+Math.min(cnt.katana||0,cnt.ninja||0)*8+(cnt.great||0)*6;
}
function recommendShelf(){
  const max=shelfMax();
  const pool=S.inv.filter(w=>!isEquipped(w.uid)).sort((a,b)=>b.q-a.q);
  if(!pool.length){ toast("飾れる武器がない。","#e0645a"); return; }
  const byK={}; KINDS.forEach(k=>byK[k.id]=pool.filter(w=>RMAP[w.id].k===k.id));
  let best=null, bs=-1;
  const maxA=Math.min(byK.sword.length,byK.tanjin.length,Math.floor(max/2));
  const maxB=Math.min(byK.katana.length,byK.ninja.length,Math.floor(max/2));
  for(let pa=0;pa<=maxA;pa++) for(let pb=0;pb<=maxB;pb++){
    if(pa*2+pb*2>max) continue;
    for(let g=0;g<=Math.min(byK.great.length,max-pa*2-pb*2);g++){
      const set=[].concat(byK.sword.slice(0,pa),byK.tanjin.slice(0,pa),byK.katana.slice(0,pb),byK.ninja.slice(0,pb),byK.great.slice(0,g));
      const used=new Set(set.map(w=>w.uid));
      for(const w of pool){ if(set.length>=max) break; if(!used.has(w.uid)){ set.push(w); used.add(w.uid); } }
      const v=shelfScore(set); if(v>bs){ bs=v; best=set; }
    }
  }
  const now=shelfInfo().total;
  const ids=best.map(w=>w.uid);
  if(ids.length===S.shown.length&&ids.every(u=>S.shown.includes(u))){ toast("いまの並びがいちばん評判がいい。","#6fd48a"); return; }
  askConfirm("おすすめの飾り棚",
    '<div class="note" style="margin-bottom:6px">いま飾ってある品はいったん下ろし、次の並びに替えます。</div>'+
    best.map(w=>'<div class="kv"><span>'+RMAP[w.id].n+enhTag(w)+'</span><span style="color:'+grade(w.q).c+'">'+grade(w.q).n+'　'+w.q+'</span></div>').join("")+
    '<div class="kv" style="border-top:1px solid var(--line);margin-top:5px;padding-top:6px"><span class="dim">売値への上乗せ</span><span>+'+now+'% → <b class="hot">+'+bs+'%</b></span></div>',
    "並べる",()=>{ S.shown=ids; toast("飾り棚を並べ替えた。評判 <b class='hot'>+"+bs+"%</b>","#ffd166"); render(); });
}

/* ── 走りの進行 ── */
function pushLog(t){ const R=S.run; if(!R) return; R.log.unshift(t); if(R.log.length>40) R.log.pop(); }

/* ── おまかせ進行 ──
   分岐・技・行商までまとめて任せる。方針は出発前と道中のどちらでも変えられる。 */
const AUTO_SKILL_ORDER=["sharp","tough","dash","legs","eye","luck"]; /* 生き延びる技を優先 */
let autoT=null;
function autoClear(){ if(autoT){ clearTimeout(autoT); autoT=null; } }
function autoRoute(){
  const R=S.run, m=R.route||"safe";
  if(m==="risk") return "risk";
  if(m==="alt")  return ((R.seg||0)%2===0)?"safe":"risk";
  return "safe";
}
function autoSkill(){
  const R=S.run, o=R.offer||[];
  let best="none", bs=-1;
  o.forEach(id=>{
    let sc=AUTO_SKILL_ORDER.length-AUTO_SKILL_ORDER.indexOf(id);
    if(R.skills.includes(id)) sc=-1;            /* 重ねても効かないので避ける */
    if(sc>bs){ bs=sc; best=id; }
  });
  return (bs<0)?(o[0]||"none"):best;
}
function autoMerchant(){
  const R=S.run, a=AMAP[R.area];
  const fp=Math.round(40+a.ei*140), mp=Math.round(120+a.ei*280);
  if(S.stamina<staminaMax()*0.62&&S.gold>=fp) return "food";
  if(S.gold>=mp*8) return "mat";               /* 金が潤沢なら素材に替える */
  return "go";
}
/* 走りの画面を写す。探索の画面にいなければ作り直さず、上の帯と札の印だけ更新する。
   （鍛冶場で render() を呼ぶと打っている途中の鎚が止まるため） */
function qrender(){
  if(S.tab==="quest"){ render(); return; }
  paintStatus(); paintNavBadge(); autoSave(); autoTick();
}
function autoTick(){
  autoClear();
  const R=S.run;
  if(!R||!R.auto) return;
  if(R.phase==="move") return;                  /* 駒送りは自前で連鎖する */
  if(modal.classList.contains("open")||dmodal.classList.contains("open")) return;
  const wait={choice:380,roll:420,battle:420,skill:520,merchant:520}[R.phase];
  if(!wait) return;
  const ph=R.phase, sp=R.speed||1;
  autoT=setTimeout(()=>{
    autoT=null;
    const R2=S.run;
    if(!R2||!R2.auto||R2.phase!==ph) return;
    if(modal.classList.contains("open")||dmodal.classList.contains("open")) return;
    if(ph==="choice")        chooseRoute(autoRoute());
    else if(ph==="roll")     rollDice();
    else if(ph==="battle")   battleTurn();
    else if(ph==="skill")    takeSkill(autoSkill());
    else if(ph==="merchant") merchantBuy(autoMerchant());
  },wait/sp);
}
const ROUTE_LABEL={safe:"安全寄り",risk:"険しい寄り",alt:"交互"};
const REP_CHOICES=[1,3,5,10];
function startRun(id,rep){
  if(S.run) return;
  const a=AMAP[id]; if(!a) return;
  const di=curDiff(), D=DIFFS[di], cost=skipCost(a,di);
  if(!diffOpen(a,di)){ toast("まだこの段へは踏み込めない。","#e0645a"); return; }
  if(!equipped().main){ toast("主武器を装備してから出発してください。","#e0645a"); return; }
  if(needShinpin(di)&&!shinpinOK()){ toast(D.n+"は神品の装備でしか踏み込めない。"+SHINPIN_TEXT,"#e0645a"); return; }
  if(S.stamina<cost){ toast("体力が足りない。少し鎚を振って待て。","#e0645a"); return; }
  S.run={area:id,diff:di,len:a.len,pos:0,board:[{t:"start"}],skills:[],mats:{},gold:0,
         phase:"choice",enemy:null,offer:null,log:[],dice:0,speed:Math.min(S.runSpeed||1,maxSpeedAt(id,di)),
         auto:S.autoCfg.on,route:S.autoCfg.route,seg:0,kills:0,stone:0};
  /* 連続探索。おまかせが入のときだけ。rep は {n:全体, i:何本目, mats, gold, kills, stone} */
  if(!rep&&S.autoCfg.on&&(S.autoCfg.rep||1)>1) rep={n:S.autoCfg.rep,i:1,mats:{},gold:0,kills:0,stone:0};
  if(rep&&rep.n>1) S.run.rep=rep;
  pushLog("<b class='hot'>"+a.n+(di?("・"+D.n):"")+"</b> に踏み入った。"+(S.run.rep?("（連続 "+S.run.rep.i+"／"+S.run.rep.n+"）"):""));
  scnReset(); SC.area=id;
  qrender();
  tutEv("run",id);
}
/* 連続探索の次の一本。踏破できて、おまかせが入のままで、体力が足りるときだけ続く */
let repT=null;
function repNext(area,di,rep){
  if(repT){ clearTimeout(repT); repT=null; }
  repT=setTimeout(()=>{
    repT=null;
    if(S.run) return;
    const a=AMAP[area]; if(!a) return;
    if(!S.autoCfg.on){ toast("おまかせが切なので連続探索を止めた。（"+rep.i+"／"+rep.n+"）","#9a8d80"); return; }
    if(S.stamina<skipCost(a,di)){ toast("体力が足りないので連続探索を止めた。（"+rep.i+"／"+rep.n+"）","#e0645a"); return; }
    S.diff=di;
    startRun(area,{n:rep.n,i:rep.i+1,mats:rep.mats,gold:rep.gold,kills:rep.kills,stone:rep.stone});
  },900);
}
function appendSeg(mode){
  const R=S.run;
  while(R.board.length<R.len&&(R.board.length-1-R.pos)<4){
    for(let i=0;i<SEG&&R.board.length<R.len;i++){
      const last=(R.board.length===R.len-1);
      R.board.push({t:last?"boss":pickFrom(mode==="risk"?WRISK:WSAFE)});
    }
  }
}
function chooseRoute(mode){
  const R=S.run; if(!R||R.phase!=="choice") return;
  appendSeg(mode);
  R.seg=(R.seg||0)+1;
  pushLog(mode==="risk"?"険しい道を選んだ。":"安全な道を選んだ。");
  R.phase="roll"; qrender();
}
function nextPhase(){
  const R=S.run; if(!R) return;
  if(R.pos>=R.len-1) return;
  const ahead=R.board.length-1-R.pos;
  R.phase=(R.board.length<R.len&&ahead<4)?"choice":"roll";
  qrender();
}
function rollDice(){
  const R=S.run; if(!R||R.phase!=="roll") return;
  const min=R.skills.includes("legs")?2:1;
  let n=min+Math.floor(Math.random()*(3-min+1));
  if(R.skills.includes("dash")) n+=1;
  R.dice=n; R.phase="move"; qrender();
  setTimeout(()=>stepMove(n),260/R.speed);
}
function stepMove(left){
  const R=S.run; if(!R) return;
  const limit=Math.min(R.len-1,R.board.length-1);
  if(left<=0||R.pos>=limit){ landTile(); return; }
  R.pos++; qrender();
  setTimeout(()=>stepMove(left-1),210/R.speed);
}
function landTile(){
  const R=S.run; if(!R) return;
  const a=AMAP[R.area], tile=R.board[R.pos], cs=combatStats();
  const prog=R.pos/Math.max(1,R.len-1);
  if(tile.t==="boss"||tile.t==="enemy"){ spawnEnemy(tile.t==="boss",prog); return; }
  if(tile.t==="mat"){
    const Dm=dScale(R.diff||0);
    const n=Math.max(1,Math.round((3+Math.floor(Math.random()*3)+S.up.apprentice+(allGot()?1:0)+
      (R.skills.includes("eye")?1:0)+Math.round(accBonus().loot))*Dm.mat));
    const got={};
    const tb=areaTbl(a,R.diff||0);
    for(let i=0;i<n;i++){ const k=pickFrom(tb); got[k]=(got[k]||0)+1; R.mats[k]=(R.mats[k]||0)+1; }
    pushLog("鉱脈を掘った　"+Object.keys(got).map(k=>MAT[k].n+"×"+got[k]).join("、"));
  }
  else if(tile.t==="chest"){
    let g=Math.round((60+a.ei*220)*(0.7+Math.random()*0.8)*dScale(R.diff||0).gold*goldMul());
    if(R.skills.includes("luck")) g=Math.round(g*1.5);
    R.gold+=g; pushLog("宝箱を開けた　<b class='hot'>+"+fmt(g)+"金</b>");
  }
  else if(tile.t==="skill"){
    const pool=SKILLS.slice(), o=[];
    for(let i=0;i<2;i++) o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);
    R.offer=o; R.phase="skill"; qrender(); return;
  }
  else if(tile.t==="trap"){
    if(!cs.eff.noDodge&&Math.random()<cs.eff.dodge){ pushLog("<b class='cool'>罠を見切った。</b>"); }
    else{
      const d=Math.max(2,Math.round(staminaMax()*0.032*(0.8+Math.random()*0.5)));
      S.stamina=Math.max(0,S.stamina-d);
      pushLog("罠を踏んだ　体力 <b class='bad'>-"+d+"</b>");
    scnHurt();
      if(S.stamina<=0){ retreat(); return; }
    }
  }
  else if(tile.t==="rest"){
    const h=Math.round(staminaMax()*0.14)+5;
    S.stamina=Math.min(staminaMax(),S.stamina+h);
    pushLog("焚火で休んだ　体力 <b class='ok'>+"+h+"</b>");
    scnRest();
  }
  else if(tile.t==="merchant"){ R.phase="merchant"; qrender(); return; }
  paintStatus(); nextPhase();
}
function takeSkill(id){
  const R=S.run; if(!R||R.phase!=="skill") return;
  if(id!=="none"){ R.skills.push(id); pushLog("<b class='hot'>"+SKMAP[id].n+"</b> を身につけた。"); }
  R.offer=null; nextPhase();
}
function merchantBuy(kind){
  const R=S.run, a=AMAP[R.area]; if(!R||R.phase!=="merchant") return;
  const fp=Math.round(40+a.ei*140);
  if(kind==="food"){
    if(S.gold<fp){ toast("金が足りない。","#e0645a"); return; }
    S.gold-=fp; const h=Math.round(staminaMax()*0.25);
    S.stamina=Math.min(staminaMax(),S.stamina+h);
    pushLog("行商から保存食を買った　体力 <b class='ok'>+"+h+"</b>");
  }else if(kind==="mat"){
    const p=Math.round(120+a.ei*280);
    if(S.gold<p){ toast("金が足りない。","#e0645a"); return; }
    S.gold-=p; const k=pickFrom(areaTbl(a,R.diff||0)); R.mats[k]=(R.mats[k]||0)+3;
    pushLog("行商から "+MAT[k].n+"×3 を買った");
  }else pushLog("行商とすれ違った。");
  paintStatus(); nextPhase();
}

/* ── 戦い ── */
function spawnEnemy(boss,prog){
  const R=S.run, a=AMAP[R.area], cs=combatStats();
  const nm=boss?a.boss:FOES[R.area][Math.floor(Math.random()*FOES[R.area].length)];
  let hp=Math.round(a.ehp*(1+prog*0.5));
  let atk=a.eatk*(1+prog*0.3);
  let def=Math.round(a.edef*(1+prog*0.2));
  const D=dScale(R.diff||0);                    /* 難度は素の値に掛けるだけ。狩場の並びは触らない */
  hp=Math.round(hp*D.hp); atk*=D.atk; def=Math.round(def*D.def);
  if(boss){ hp=Math.round(hp*2.4); atk*=1.35; def=Math.round(def*1.2); }
  R.enemy={n:nm,hp:hp,max:hp,atk:atk,def:def,boss:boss,first:cs.eff.first>0,
           gold:Math.round((30+a.ei*130)*(boss?4:1)),drop:boss?(3+Math.floor(Math.random()*3)):(1+Math.floor(Math.random()*2))};
  R.phase="battle";
  pushLog(boss?("<b class='bad'>"+nm+"が立ちはだかった。</b>"):(nm+"が現れた。"));
  qrender();
}
function battleTurn(){
  const R=S.run; if(!R||R.phase!=="battle"||!R.enemy) return;
  const cs=combatStats(), E=R.enemy;
  const pierce=100/(100+E.def);
  let dmg=Math.max(1,Math.round(cs.atk*pierce*(0.88+Math.random()*0.24)));
  const crit=Math.random()<cs.eff.crit;
  if(crit) dmg=Math.round(dmg*1.8);
  scnStrike(crit);
  E.hp-=dmg;
  pushLog((crit?"<b class='hot'>会心</b>　":"")+"斬りつけた　<b>"+fmt(dmg)+"</b>");
  if(E.hp>0&&Math.random()<cs.eff.chase){
    const d2=Math.max(1,Math.round(cs.atk*0.6*pierce)); E.hp-=d2;
    pushLog("<b class='cool'>追撃</b>　<b>"+fmt(d2)+"</b>");
  }
  if(E.hp<=0){ winBattle(); return; }
  {
    let ed=E.atk*(100/(100+cs.def))*(0.88+Math.random()*0.24)*(1-cs.eff.cut);
    if(E.first){ E.first=false; ed*=0.35; pushLog("<b class='cool'>先手を取った。</b>"); }
    ed=Math.max(1,Math.round(ed));
    S.stamina=Math.max(0,S.stamina-ed);
    pushLog("反撃を受けた　体力 <b class='bad'>-"+ed+"</b>");
    scnHurt();
    if(S.stamina<=0){ retreat(); return; }
  }
  paintStatus(); qrender();
}
function winBattle(){
  const R=S.run, a=AMAP[R.area], E=R.enemy;
  R.kills++;
  const D=dScale(R.diff||0);
  const g=Math.round(E.gold*(0.8+Math.random()*0.5)*D.gold*goldMul()); R.gold+=g;
  const got={};
  const dn=Math.max(1,Math.round(E.drop*D.mat));
  const tb=areaTbl(a,R.diff||0);
  for(let i=0;i<dn;i++){ const k=pickFrom(tb); got[k]=(got[k]||0)+1; R.mats[k]=(R.mats[k]||0)+1; }
  pushLog("<b class='ok'>"+E.n+"を倒した</b>　+"+fmt(g)+"金　"+
    Object.keys(got).map(k=>MAT[k].n+"×"+got[k]).join("、"));
  /* 主の落とし物。危険以上でだけ出る */
  if(E.boss&&D.i>0){
    if(Math.random()<D.acc){
      const x=rollAcc(a,D.i), m=takeAcc(x);
      if(m) pushLog(m);
    }
    if(D.mei>0){
      const ms=D.mei+Math.floor(Math.random()*2);
      S.meiStone+=ms; R.stone=(R.stone||0)+ms;
      pushLog("<b class='hot'>銘石</b> を "+ms+"つ拾った");
    }
  }
  const wasBoss=E.boss; R.enemy=null; paintStatus();
  if(wasBoss){ endRun(true,R.mats,R.gold,"win"); return; }
  nextPhase();
}
function fleeBattle(){
  const R=S.run; if(!R||!R.enemy) return;
  if(R.enemy.boss){ toast("主からは逃げられない。","#e0645a"); return; }
  const c=Math.max(3,Math.round(R.enemy.atk*(100/(100+combatStats().def))*2.5));
  S.stamina=Math.max(0,S.stamina-c);
  pushLog("背を向けて走った　体力 <b class='bad'>-"+c+"</b>");
  scnHurt();
  R.enemy=null; paintStatus();
  if(S.stamina<=0){ retreat(); return; }
  nextPhase();
}
function retreat(){
  const R=S.run; if(!R) return;
  const half={};
  for(const k in R.mats){ const n=Math.floor(R.mats[k]/2); if(n>0) half[k]=n; }
  endRun(false,half,Math.floor(R.gold/2),"flee");
}
/* 主を討ったときと引き返すときは、場面の見せ場をはさんでから結果へ移る。
   R.fin を立てるとおまかせも操作も止まるので、二重に走ることはない */
function endRun(cleared,mats,gold,kind){
  const R=S.run; if(!R||R.fin) return;
  R.fin=true; R.phase="fin"; R.enemy=null; autoClear();
  if(kind==="win") scnWin(); else scnFlee();
  qrender();
  setTimeout(()=>{ if(S.run&&S.run.fin) finishRun(cleared,mats,gold); }, kind==="win"?1200:1000);
}
function finishRun(cleared,mats,gold){
  const R=S.run; if(!R) return;
  const a=AMAP[R.area];
  for(const k in mats) S.mats[k]=(S.mats[k]||0)+mats[k];
  S.gold+=gold; S.stats.earned+=gold; S.stats.trips++;
  const D=dScale(R.diff||0);
  addExpE(Math.round((20+a.ei*20)*(cleared?1.3:0.5)*D.exp));
  if(cleared){
    S.clears[R.area]=clearsOf(R.area)+1;
    bumpClearD(R.area,D.i);
    if(!S.cleared[R.area]){
      S.cleared[R.area]=true;
      toast("<b class='hot'>"+a.n+"の主を討った。</b>","#ffd166");
    }
    noticeOpened();
  }
  S.lastRun={area:R.area,diff:D.i,cleared:cleared,mats:mats,gold:gold,kills:R.kills,pos:R.pos,len:R.len,
             skip:false,stone:R.stone||0};
  const rep=R.rep;
  if(rep){
    /* 連続探索の通算。結果の札には一本ごとではなく、ここまでの合計を出す */
    for(const k in mats) rep.mats[k]=(rep.mats[k]||0)+mats[k];
    rep.gold+=gold; rep.kills+=R.kills; rep.stone+=(R.stone||0);
    S.lastRun={area:R.area,diff:D.i,cleared:cleared,mats:rep.mats,gold:rep.gold,kills:rep.kills,pos:R.pos,len:R.len,
               skip:false,stone:rep.stone,runs:rep.i,repN:rep.n};
  }
  const more=cleared&&rep&&R.auto&&rep.i<rep.n;
  toast(cleared?("<b>"+a.n+(D.i?("・"+D.n):"")+"</b> を踏破した。"+(rep?("（"+rep.i+"／"+rep.n+"）"):"")):("<b>"+a.n+"</b> から引き返した。持ち帰りは半分。"),
        cleared?"#6fd48a":"#e0645a");
  if(cleared) noticeDiff(R.area);
  if(rep&&!more&&rep.i>=rep.n) toast("連続探索 "+rep.n+"回 を終えた。","#7fb7c9");
  else if(rep&&!cleared) toast("連続探索はここで止めた。（"+rep.i+"／"+rep.n+"）","#9a8d80");
  S.run=null; autoClear(); qrender();
  if(more) repNext(R.area,D.i,rep);
}

/* ── 早駆け（踏破後） ── */
function skipRun(id,times){
  const a=AMAP[id];
  const di=curDiff(), D=DIFFS[di], cost=skipCost(a,di);
  if(!diffOpen(a,di)){ toast("まだこの段へは踏み込めない。","#e0645a"); return; }
  if(needShinpin(di)&&!shinpinOK()){ toast(D.n+"は神品の装備でしか駆けられない。"+SHINPIN_TEXT,"#e0645a"); return; }
  if(!skipOpen(id,di)){ toast("早駆けはこの段を "+CLEAR_STEPS.skip+" 度踏破してから。（いま "+clearsD(id,di)+" 度）","#e0645a"); return; }
  let done=0, stone=0; const mats={}; let gold=0; const accs=[];
  const tb=areaTbl(a,di);
  for(let i=0;i<times;i++){
    if(S.stamina<cost) break;
    S.stamina-=cost;
    const n=Math.max(1,Math.round((Math.round(a.len*0.28)+S.up.apprentice+(allGot()?1:0)+
      Math.round(accBonus().loot))*D.mat));
    for(let j=0;j<n;j++){ const k=pickFrom(tb); mats[k]=(mats[k]||0)+1; S.mats[k]=(S.mats[k]||0)+1; }
    const g=Math.round((40+a.ei*190)*(0.8+Math.random()*0.5)*D.gold*goldMul());
    gold+=g; S.gold+=g; S.stats.earned+=g; S.stats.trips++;
    addExpE(Math.round((20+a.ei*20)*1.1*D.exp));
    S.clears[id]=clearsOf(id)+1;
    bumpClearD(id,di);
    /* 早駆けは盤面を省くぶん、落とし物は走り切るより渋い */
    if(D.i>0){
      if(Math.random()<D.acc*0.5){ const x=rollAcc(a,D.i); if(takeAcc(x)) accs.push(x); }
      if(D.mei>0&&Math.random()<0.6){ const ms=Math.max(1,Math.round(D.mei*0.6)); S.meiStone+=ms; stone+=ms; }
    }
    done++;
  }
  if(!done){ toast("体力が足りない。","#e0645a"); return; }
  S.lastRun={area:id,diff:di,cleared:true,mats:mats,gold:gold,kills:0,pos:a.len-1,len:a.len,
             skip:true,runs:done,stone:stone,accs:accs.length};
  toast("<b>"+a.n+(di?("・"+D.n):"")+"</b> を "+done+"回 駆け抜けた。","#7fb7c9");
  noticeOpened(); noticeDiff(id);
  render();
}

/* ══════════ 注文 ══════════
   札は4枚。0時を起点に8時間ごと（0時・8時・16時）に板ごと入れ替わる。
   納めた札は空きになり、次の入れ替えまで埋まらない。
   格は名声で決まり、上の格ほど金以外の報酬がつく */
const ORDER_SLOTS=4, ORDER_HOURS=8, ORDER_MS=ORDER_HOURS*3600*1000;
const ORDER_RANKS=[
  {id:"jo",n:"常連",fame:0,  give:3, minQ:[25,50],   qty:[1,3],gmul:1.0,c:"#c9bdaf",w:10,d:"金で払う"},
  {id:"jk",n:"上客",fame:30, give:8, minQ:[50,75],   qty:[2,3],gmul:1.3,c:"#6fd48a",w:6, d:"金に加えて銘石"},
  {id:"dm",n:"大名",fame:100,give:20,minQ:[75,85],   qty:[1,2],gmul:1.6,c:"#7fb7c9",w:5, d:"金に加えて根付か稀な石"},
  {id:"sd",n:"神殿",fame:250,give:50,minQ:[97],      qty:[1,1],gmul:2.0,c:"#ffd166",w:3, d:"金に加えて付喪神の神威"}
];
const ORMAP={}; ORDER_RANKS.forEach(x=>ORMAP[x.id]=x);
const DM_ACC_Q=85;                 /* 大名の注文でもらえる根付の下限。良業物から上 */
let orderSeq=1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function orderRank(){
  const f=fame(), tbl={};
  /* 常連は名声が上がるほど減り、上の格は名声が上がるほど増える */
  ORDER_RANKS.forEach(R=>{ if(f<R.fame) return;
    tbl[R.id]=(R.id==="jo")?R.w*Math.max(0.3,1-f/400):R.w*(1+(f-R.fame)/200); });
  return ORMAP[pickFrom(tbl)];
}
function makeOrder(){
  const R=orderRank();
  const un=RECIPES.filter(unlocked); if(!un.length) return null;
  const top=un[un.length-1].g;
  let pool;
  if(R.id==="sd")      pool=un.filter(x=>x.g>=KAMI_GEN);
  else if(R.id==="dm") pool=un.filter(x=>x.g>=top-1);
  else                 pool=un.filter(x=>x.g>=top-2);
  if(!pool.length) pool=un.filter(x=>x.g===top);
  const r=pick(pool);
  const qty=R.qty[0]+Math.floor(Math.random()*(R.qty[1]-R.qty[0]+1));
  const minQ=pick(R.minQ);
  const tm=1+TITLES.indexOf(titleOf(fame()))*0.25;          /* 称号で 1.0〜2.0倍 */
  const o={oid:orderSeq++,rank:R.id,id:r.id,qty,minQ,
    gold:Math.round(r.base*grade(minQ).mult*qty*1.75*R.gmul*tm), exp:Math.round(r.g*28*qty), give:R.give};
  if(R.id==="jk") o.stone=2+Math.floor(Math.random()*3);
  if(R.id==="dm"){ if(Math.random()<0.5) o.acc=1; else o.mat=(Math.random()<0.5)?{k:"rune",n:1}:{k:"star",n:2}; }
  if(R.id==="sd") o.kami=1;
  return o;
}
/* その時刻が属する区切りの頭を返す。0時を起点に8時間ごとなので、0時・8時・16時のどれか。
   一日はちょうど三区切りなので、日付をまたいでもずれない */
function orderSlotStart(t){
  const d=new Date(t);
  const base=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0).getTime();
  return base+Math.floor((t-base)/ORDER_MS)*ORDER_MS;
}
/* 8時間ごとの入れ替え。閉じていた間に何回分過ぎていても、開いたときに一度だけ引き直す */
function checkOrders(force){
  const now=Date.now(), slot=orderSlotStart(now);
  if(!force&&S.orderT&&S.orderT>=slot) return false;
  S.orders=[]; orderSeq=Math.max(orderSeq,1);
  for(let i=0;i<ORDER_SLOTS;i++){ const o=makeOrder(); if(o) S.orders.push(o); }
  S.orders.sort((a,b)=>ORDER_RANKS.indexOf(ORMAP[b.rank])-ORDER_RANKS.indexOf(ORMAP[a.rank]));
  if(S.chain) S.chain=null;
  S.orderT=slot;
  return true;
}
function orderLeft(){ return Math.max(0,orderSlotStart(Date.now())+ORDER_MS-Date.now()); }
function fmtLeft(ms){ const m=Math.ceil(ms/60000), h=Math.floor(m/60); return h?(h+"時間"+(m%60)+"分"):(m+"分"); }
function fillOrders(){ if(!S.orderT) checkOrders(true); }
function orderRewardText(o){
  const t=[fmt(o.gold)+"金"];
  if(o.stone) t.push("銘石 "+o.stone);
  if(o.acc) t.push("根付（"+grade(DM_ACC_Q).n+"以上）");
  if(o.mat) t.push(MAT[o.mat.k].n+" ×"+o.mat.n);
  if(o.kami) t.push(KAMIMAP[RMAP[o.id].k].n.replace(/（.*/,"")+"の神威 +"+o.kami);
  t.push("名声 +"+o.give);
  return t;
}
function startChain(oid){
  const o=S.orders.find(x=>x.oid===oid); if(!o) return;
  const remain=o.qty-matchOrder(o).length;
  if(remain<=0){ toast("もう足りている。そのまま納品できる。","#6fd48a"); return; }
  S.chain={oid:oid, made:0, cap:24};
  S.tab="forge"; S.hl=null; S.lastBuy=null;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="forge"));
  const r=RMAP[o.id];
  S.openGen={}; S.openGen[r.g]=true;
  if(canMake(r)) startForge(o.id);
  else { toast("素材が足りない。案内から集めてくれ。","#e0645a"); render(); }
}
function chainNext(){
  if(!S.chain) return;
  if(F.practice) return;
  const o=S.orders.find(x=>x.oid===S.chain.oid);
  if(!o){ S.chain=null; render(); return; }
  const remain=o.qty-matchOrder(o).length;
  if(remain<=0){ S.chain=null; toast("注文の数がそろった。商店で納品できる。","#ffd166"); render(); return; }
  if(S.chain.made>=S.chain.cap){ S.chain=null; toast("ひとまず手を止めた。","#9a8d80"); render(); return; }
  const r=RMAP[o.id];
  if(!canMake(r)){ S.chain=null; toast("素材が尽きた。連続鍛造を止める。","#e0645a"); render(); return; }
  setTimeout(()=>{ if(!S.chain) return;
    if(S.tab!=="forge"){ S.chain=null; toast("鍛冶場を離れたので連続鍛造を止めた。","#9a8d80"); return; }
    startForge(o.id); }, 900);
}
function chainInfo(){
  if(!S.chain) return null;
  const o=S.orders.find(x=>x.oid===S.chain.oid);
  if(!o) return null;
  return {o:o, r:RMAP[o.id], got:matchOrder(o).length, need:o.qty};
}
/* 納品には鍛えていない品・出来の低い品から回す。装備中と飾り棚のものは手を付けない */
function matchOrder(o){
  return S.inv.filter(w=>w.id===o.id&&w.q>=o.minQ&&!S.shown.includes(w.uid)&&!isEquipped(w.uid))
    .sort((a,b)=>wLv(a)-wLv(b)||a.q-b.q);
}
function deliver(oid){
  const i=S.orders.findIndex(o=>o.oid===oid); if(i<0) return;
  const o=S.orders[i], list=matchOrder(o), r=RMAP[o.id];
  if(list.length<o.qty){ toast("品が揃っていない。","#e0645a"); return; }
  const use=list.slice(0,o.qty).map(w=>w.uid);
  S.inv=S.inv.filter(w=>!use.includes(w.uid));
  S.gold+=o.gold; S.stats.earned+=o.gold; S.stats.sold+=o.qty; S.stats.delivered=(S.stats.delivered||0)+1;
  const got=[fmt(o.gold)+"金"];
  if(o.stone){ S.meiStone+=o.stone; got.push("銘石 +"+o.stone); }
  if(o.acc){ const A=pick(ACCS); const x={uid:S.accUid++,id:A.id,q:DM_ACC_Q+Math.floor(Math.random()*16)}; if(gainAcc(x)) got.push(A.n+"（"+accGrade(x).n+"）"); }
  if(o.mat){ S.mats[o.mat.k]=(S.mats[o.mat.k]||0)+o.mat.n; got.push(MAT[o.mat.k].n+" ×"+o.mat.n); }
  if(o.kami){
    S.stats.temple=(S.stats.temple||0)+1;
    const k=r.k, before=kamiTier(k); S.kami[k]=(S.kami[k]||0)+o.kami; const after=kamiTier(k);
    got.push(KAMIMAP[k].n.replace(/（.*/,"")+"の神威 +"+o.kami);
    if(after>before){ if(!S.tomo) S.tomo=k; toast("<b class='hot'>"+KAMIMAP[k].n+"</b> が"+(after===1?"目を覚ました":"次の姿になった")+"。","#ffd166"); }
  }
  addExp(o.exp); addFame(o.give);
  S.orders.splice(i,1);
  if(o.kami) AREAS.forEach(a=>noticeDiff(a.id));
  toast("納品した。<b class='hot'>"+got.join("　")+"</b>　名声 +"+o.give,"#ffd166"); render();
}

/* ══════════ 売買 ══════════ */
function buyMat(k,n){
  const m=MAT[k];
  if(m.buy===0){ toast("これは売り物ではない。","#e0645a"); return; }
  const p=m.buy*n;
  if(S.gold<p){ toast("金が足りない。（"+fmt(p)+"金 必要）","#e0645a"); return; }
  askConfirm("購入の確認",
    '<div class="row" style="margin-bottom:8px"><i class="dot" style="color:'+m.c+';background:'+m.c+'"></i>'+
    '<div style="flex:1"><b>'+m.n+'</b> ×'+n+'</div></div>'+
    '<div class="kv"><span class="dim">単価</span><span>'+fmt(m.buy)+'金</span></div>'+
    '<div class="kv"><span class="dim">代金</span><span class="hot">'+fmt(p)+'金</span></div>'+
    '<div class="kv"><span class="dim">支払後の所持金</span><span>'+fmt(S.gold-p)+'金</span></div>'+
    '<div class="kv"><span class="dim">購入後の手持ち</span><span>'+(have(k)+n)+'個</span></div>',
    "買う",()=>{
      S.gold-=p; S.mats[k]=(S.mats[k]||0)+n; S.lastBuy={k,n,p};
      if(S.needMat&&S.needMat.k===k) S.needMat=null;
      toast("<b>"+m.n+" ×"+n+"</b> を買った。<b class='bad'>-"+fmt(p)+"金</b>　手持ち "+have(k)+"個","#6fd48a");
      if(backForgeDone()) return;
      render();
    });
}
function sellMat(k,n){
  if(have(k)<n) return;
  const g=MAT[k].sell*n;
  askConfirm("引き取りの確認",
    '<div style="margin-bottom:8px"><b>'+MAT[k].n+'</b> ×'+n+' を手放します。</div>'+
    '<div class="kv"><span class="dim">受取</span><span class="hot">'+fmt(g)+'金</span></div>',
    "売る",()=>{ S.mats[k]-=n; S.gold+=g; S.stats.earned+=g;
      toast(MAT[k].n+" ×"+n+" を売った。<b class='hot'>+"+fmt(g)+"金</b>","#ffd166"); render(); });
}
const foodPrice=()=>Math.round(staminaMax()*1.6);
const foodHeal =()=>Math.round(staminaMax()*0.3);
function buyFood(){
  const pr=foodPrice(), hl=foodHeal();
  if(S.gold<pr){ toast("金が足りない。","#e0645a"); return; }
  if(S.stamina>=staminaMax()){ toast("腹はいっぱいだ。","#e0645a"); return; }
  askConfirm("購入の確認",
    '<div style="margin-bottom:8px"><b>携帯食</b> ×1</div>'+
    '<div class="kv"><span class="dim">代金</span><span class="hot">'+fmt(pr)+'金</span></div>'+
    '<div class="kv"><span class="dim">体力</span><span class="cool">+'+hl+'</span></div>',
    "買う",()=>{ S.gold-=pr; S.stamina=Math.min(staminaMax(),S.stamina+hl);
      S.lastBuy={k:null,n:1,p:pr,label:"携帯食"};
      toast("<b>携帯食</b> を買った。<b class='bad'>-"+fmt(pr)+"金</b>　体力 <b class='cool'>+"+hl+"</b>","#6fd48a"); render(); });
}
function sellWeapon(uid){
  const w=S.inv.find(x=>x.uid===uid); if(!w) return;
  if(locked(w)){ toast(LOCK_MSG,"#e0645a"); return; }
  if(S.shown.includes(uid)){ toast("飾ってある品は売れない。","#e0645a"); return; }
  if(isEquipped(uid)){ toast("装備している品は売れない。","#e0645a"); return; }
  const p=sellPrice(w), r=RMAP[w.id], gi=gradeIdx(w.q), g=GRADES[gi];
  askConfirm("売却の確認",
    '<div class="row" style="margin-bottom:8px">'+wIcon(r,gi)+
    '<div style="flex:1"><b>'+r.n+enhTag(w)+'</b><div class="mini"><span style="color:'+g.c+'">'+g.n+'</span>　出来 '+w.q+'</div></div></div>'+
    '<div class="kv"><span class="dim">売値</span><span class="hot">'+fmt(p)+'金</span></div>'+
    (wLv(w)>0?'<div class="note" style="margin-top:6px">+'+wLv(w)+'まで鍛えた品です。注いだ金と鋼は戻りません。</div>':""),
    "売る",()=>{ S.gold+=p; S.stats.earned+=p; S.stats.sold++;
      S.inv=S.inv.filter(x=>x.uid!==uid);
      toast(r.n+" を売った。<b class='hot'>+"+fmt(p)+"金</b>","#ffd166"); render(); tutEv("sold"); });
}
function sellBelow(th){
  const t=S.inv.filter(w=>w.q<th&&wLv(w)===0&&!locked(w)&&!S.shown.includes(w.uid)&&!isEquipped(w.uid));
  if(!t.length){ toast("該当する品がない。","#e0645a"); return; }
  let sum=0; t.forEach(w=>sum+=sellPrice(w));
  askConfirm("まとめて売る",
    '<div class="kv"><span class="dim">対象</span><span>'+t.length+'点</span></div>'+
    '<div class="kv"><span class="dim">合計</span><span class="hot">'+fmt(sum)+'金</span></div>'+
    '<div class="note" style="margin-top:6px">'+GRADES[gradeIdx(th-1)].n+'以下が対象です。飾ってある品・装備中の品・鍛え直した品は含みません。</div>',
    "売る",()=>{ const ids=t.map(w=>w.uid);
      S.inv=S.inv.filter(w=>!ids.includes(w.uid));
      S.gold+=sum; S.stats.earned+=sum; S.stats.sold+=t.length;
      toast(t.length+"点を売った。<b class='hot'>+"+fmt(sum)+"金</b>","#ffd166"); render(); });
}
function toggleShow(uid){
  const i=S.shown.indexOf(uid);
  if(i<0&&isEquipped(uid)){ toast("装備している品は飾れない。","#e0645a"); return; }
  if(i>=0) S.shown.splice(i,1);
  else{ if(S.shown.length>=shelfMax()){ toast("飾り棚が埋まっている。","#e0645a"); return; } S.shown.push(uid); }
  render();
}
function buyUp(id){
  const u=UMAP[id]; if(S.up[id]>=u.max) return;
  const c=upCost(id);
  if(S.gold<c){ toast("金が足りない。","#e0645a"); return; }
  askConfirm("工房を整える",
    '<div style="margin-bottom:8px"><b>'+u.n+'</b>　'+S.up[id]+' → '+(S.up[id]+1)+'</div>'+
    '<div class="note" style="margin-bottom:8px">'+u.desc+'</div>'+
    '<div class="kv"><span class="dim">費用</span><span class="hot">'+fmt(c)+'金</span></div>'+
    '<div class="kv"><span class="dim">支払後の所持金</span><span>'+fmt(S.gold-c)+'金</span></div>',
    "整える",()=>{ S.gold-=c; S.up[id]++;
      toast("<b>"+u.n+"</b> を強くした。（"+S.up[id]+"／"+u.max+"）　<b class='bad'>-"+fmt(c)+"金</b>","#7fb7c9"); render(); });
}

const SC={
  wrap:null, cv:null, g:null, w:0, h:0, dpr:1, ready:false,
  area:"mori", scroll:0, t:0, spd:0,
  hitT:0, hurtT:0, winT:0, fleeT:0, restT:0, shake:0, flash:0, crit:false,
  fx:[], motes:[],
  foe:{on:false,arch:"quad",sc:1,boss:false,name:"",in:0,hitT:0,dieT:0,lunge:0}
};
function scnInit(){
  SC.wrap=document.getElementById("scnwrap");
  SC.cv=document.getElementById("scn");
  if(!SC.cv) return;
  SC.g=SC.cv.getContext("2d");
  SC.ready=true;
}
function scnSize(){
  if(!SC.ready||!SC.wrap||SC.wrap.style.display==="none") return;
  const w=SC.wrap.clientWidth||320;
  const h=Math.round(Math.max(108,Math.min(150,w*0.36)));
  const dpr=Math.min(3,window.devicePixelRatio||1);
  if(w===SC.w&&h===SC.h&&dpr===SC.dpr) return;
  SC.w=w; SC.h=h; SC.dpr=dpr;
  SC.cv.width=Math.round(w*dpr); SC.cv.height=Math.round(h*dpr);
  SC.cv.style.width=w+"px"; SC.cv.style.height=h+"px";
  SC.motes=[];
  for(let i=0;i<20;i++) SC.motes.push({x:Math.random()*w,y:Math.random()*h*0.8,
    v:0.25+Math.random()*0.9, s:0.7+Math.random()*1.7, p:Math.random()*6.28});
}
/* 走りの状態を画面へ写す。呼ぶのは render() の末尾だけ */
function scnSync(){
  if(!SC.ready) return;
  const R=S.run;
  const slot=document.getElementById("scnSlot");
  if(!R||!slot||S.tab!=="quest"){
    if(SC.wrap.parentNode!==document.body){ document.body.appendChild(SC.wrap); }
    SC.wrap.style.display="none";
    return;
  }
  SC.wrap.style.display="block";
  if(SC.wrap.parentNode!==slot) slot.appendChild(SC.wrap);
  scnSize();
  if(SC.area!==R.area){ SC.area=R.area; SC.scroll=0; SC.fx.length=0; }
  const F=SC.foe;
  if(R.enemy){
    if(!F.on||F.name!==R.enemy.n){
      const a=FOE_ART[R.enemy.n]||["quad",1];
      F.on=true; F.name=R.enemy.n; F.arch=a[0]; F.sc=a[1]; F.boss=!!R.enemy.boss;
      F.in=0; F.hitT=0; F.dieT=0; F.lunge=0;
    }
  }else if(F.on&&F.dieT<=0){ F.dieT=0.5; }
}
function scnReset(){
  if(!SC.ready) return;
  SC.scroll=0; SC.spd=0; SC.fx.length=0;
  SC.hitT=SC.hurtT=SC.winT=SC.fleeT=SC.restT=SC.shake=SC.flash=0;
  SC.foe.on=false; SC.foe.name=""; SC.foe.dieT=0; SC.foe.in=0;
}
function scnStrike(crit){ if(!SC.ready) return; SC.hitT=0.46; SC.crit=!!crit; }
function scnHurt(){ if(!SC.ready) return; SC.hurtT=0.42; SC.shake=1; SC.flash=1; SC.foe.lunge=1; }
function scnWin(){ if(!SC.ready) return; SC.winT=1.6; SC.hurtT=0; SC.hitT=0; }
function scnFlee(){ if(!SC.ready) return; SC.fleeT=1.4; SC.hurtT=0; SC.hitT=0; }
function scnRest(){ if(!SC.ready) return; SC.restT=1.1; }
function scnFoeHit(){ if(!SC.ready) return; SC.foe.hitT=0.22; }

/* ── 小物 ── */
function hrnd(a,b){ const x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); }
function tile(off,p,w,fn){
  const k0=Math.floor(off/p)-1, k1=Math.ceil((off+w)/p)+1;
  for(let k=k0;k<=k1;k++) fn(k,k*p-off);
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function spark(x,y,n,c,pw){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, v=(30+Math.random()*130)*pw;
    SC.fx.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:0.38+Math.random()*0.42,
      m:0.38+Math.random()*0.42,c:c,s:1+Math.random()*2});
  }
}

/* ── 背景の三層 ── */
function drawBack(g,th,w,h,gy){
  const sk=g.createLinearGradient(0,0,0,gy);
  sk.addColorStop(0,th.sky[0]); sk.addColorStop(1,th.sky[1]);
  g.fillStyle=sk; g.fillRect(0,0,w,gy+1);
  const off=SC.scroll;
  /* 遠景 */
  g.fillStyle=th.far;
  const K=th.kind;
  if(K==="tree"){
    g.beginPath(); g.moveTo(0,gy);
    for(let x=0;x<=w;x+=8){ const u=(x+off*0.14)/w;
      g.lineTo(x,gy-14-18*Math.abs(Math.sin(u*1.7))-7*Math.sin(u*5.1)); }
    g.lineTo(w,gy); g.closePath(); g.fill();
    tile(off*0.22,34,w,(k,x)=>{ const hh=16+hrnd(k,1)*16;
      g.beginPath(); g.moveTo(x,gy-4); g.lineTo(x+7,gy-4-hh); g.lineTo(x+14,gy-4); g.closePath(); g.fill(); });
  }else if(K==="beam"){
    tile(off*0.2,58,w,(k,x)=>{ const hh=26+hrnd(k,2)*14;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x,gy-hh); g.quadraticCurveTo(x+18,gy-hh-12,x+36,gy-hh);
      g.lineTo(x+36,gy); g.closePath(); g.fill(); });
  }else if(K==="crystal"){
    tile(off*0.18,40,w,(k,x)=>{ const hh=18+hrnd(k,3)*26;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x+8,gy-hh); g.lineTo(x+17,gy-hh*0.5); g.lineTo(x+24,gy); g.closePath(); g.fill(); });
  }else if(K==="basalt"){
    g.beginPath(); g.moveTo(0,gy);
    tile(off*0.12,110,w,(k,x)=>{ const hh=30+hrnd(k,4)*24;
      g.moveTo(x-28,gy); g.lineTo(x,gy-hh); g.lineTo(x+28,gy); });
    g.closePath(); g.fill();
    const lg=g.createLinearGradient(0,gy-30,0,gy);
    lg.addColorStop(0,"rgba(255,90,30,0)"); lg.addColorStop(1,"rgba(255,110,40,.22)");
    g.fillStyle=lg; g.fillRect(0,gy-30,w,30);
  }else if(K==="ruin"){
    tile(off*0.18,46,w,(k,x)=>{ const hh=14+hrnd(k,5)*34, wd=7+hrnd(k,6)*7;
      g.fillRect(x,gy-hh,wd,hh); });
  }else if(K==="shaft"){
    tile(off*0.2,26,w,(k,x)=>{ g.fillRect(x,0,9,gy); });
    const lg=g.createLinearGradient(0,gy-26,0,gy);
    lg.addColorStop(0,"rgba(60,220,160,0)"); lg.addColorStop(1,"rgba(60,220,160,.14)");
    g.fillStyle=lg; g.fillRect(0,gy-26,w,26);
  }else{ /* altar */
    for(let i=0;i<3;i++){
      g.globalAlpha=0.20+i*0.1;
      tile(off*(0.08+i*0.05),120,w,(k,x)=>{ const y=gy-52+i*15+hrnd(k,7+i)*8;
        g.beginPath(); g.ellipse(x+40,y,52,8,0,0,6.29); g.fill(); });
    }
    g.globalAlpha=1;
  }
  /* 地平の明かり。奥行きが出て、狩場ごとの色味もはっきりする */
  {
    const hg=g.createLinearGradient(0,gy-h*0.34,0,gy);
    hg.addColorStop(0,"rgba(0,0,0,0)");
    hg.addColorStop(1,hexA(th.ac,0.16));
    g.fillStyle=hg; g.fillRect(0,gy-h*0.34,w,h*0.34);
  }
  /* 中景 */
  g.fillStyle=th.mid;
  if(K==="tree"){
    tile(off*0.52,52,w,(k,x)=>{ const hh=34+hrnd(k,11)*30;
      g.beginPath(); g.moveTo(x-12,gy); g.lineTo(x,gy-hh); g.lineTo(x+12,gy); g.closePath(); g.fill();
      g.fillRect(x-2,gy-8,4,8); });
  }else if(K==="beam"){
    tile(off*0.55,64,w,(k,x)=>{ const hh=40+hrnd(k,12)*14;
      g.fillRect(x,gy-hh,5,hh); g.fillRect(x+34,gy-hh,5,hh); g.fillRect(x-3,gy-hh-6,45,7); });
  }else if(K==="crystal"){
    tile(off*0.55,46,w,(k,x)=>{ const hh=22+hrnd(k,13)*34;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x+6,gy-hh); g.lineTo(x+14,gy-hh*0.55); g.lineTo(x+20,gy); g.closePath(); g.fill();
      g.save(); g.globalAlpha=.5; g.fillStyle=th.ac; g.shadowColor=th.ac; g.shadowBlur=9;
      g.beginPath(); g.moveTo(x+4,gy-hh*0.75); g.lineTo(x+6,gy-hh); g.lineTo(x+9,gy-hh*0.7); g.closePath(); g.fill(); g.restore();
      g.fillStyle=th.mid; });
  }else if(K==="basalt"){
    tile(off*0.55,50,w,(k,x)=>{ const hh=26+hrnd(k,14)*28;
      g.beginPath(); g.moveTo(x,gy); g.lineTo(x+3,gy-hh); g.lineTo(x+13,gy-hh*0.8); g.lineTo(x+17,gy); g.closePath(); g.fill(); });
  }else if(K==="ruin"){
    tile(off*0.55,72,w,(k,x)=>{ const hh=30+hrnd(k,15)*30;
      g.fillRect(x,gy-hh,10,hh); g.fillRect(x-3,gy-hh-5,16,5);
      if(hrnd(k,16)>0.55) g.fillRect(x+26,gy-7,26,7); });
  }else if(K==="shaft"){
    tile(off*0.55,58,w,(k,x)=>{ g.fillRect(x,0,4,gy-24-hrnd(k,17)*20);
      g.fillRect(x-9,gy-34,22,5); });
  }else{
    tile(off*0.5,86,w,(k,x)=>{ const hh=18+hrnd(k,18)*16;
      g.fillRect(x,gy-hh,30,hh); g.fillRect(x-4,gy-hh-5,38,5); });
  }
  /* 地面 */
  const gg=g.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,th.g1); gg.addColorStop(1,th.g2);
  g.fillStyle=gg; g.fillRect(0,gy,w,h-gy);
  g.fillStyle="rgba(0,0,0,.35)"; g.fillRect(0,gy,w,1);
  g.fillStyle="rgba(255,255,255,.05)";
  tile(off,17,w,(k,x)=>{ const y=gy+3+hrnd(k,21)*(h-gy-5);
    g.fillRect(x+hrnd(k,22)*9,y,2+hrnd(k,23)*4,1); });
}
function drawMotes(g,th,w,h,dt){
  const kind=th.mote;
  const col={leaf:"#7fa06a",dust:"#c0a070",glim:"#9fd8e8",ember:"#ff8a3a",star:"#d8c8ff",mote:"#ffe6a8"}[kind]||"#fff";
  SC.motes.forEach(m=>{
    m.x-=(m.v*24+ (kind==="ember"?0:0))*dt*(0.4+SC.spd*0.9);
    m.p+=dt*1.6;
    if(kind==="ember") m.y-=dt*16; else m.y+=Math.sin(m.p)*0.22;
    if(m.x<-6){ m.x=w+6; m.y=Math.random()*h*0.8; }
    if(m.y<-6) m.y=h*0.85;
    g.globalAlpha=0.16+0.3*Math.abs(Math.sin(m.p));
    g.fillStyle=col;
    g.beginPath(); g.arc(m.x,m.y,m.s,0,6.29); g.fill();
  });
  g.globalAlpha=1;
}

/* ── 敵の影絵 ── */
function foeShape(g,arch,hh,ac,t){
  /* 原点は足元の中央。左（主人公の側）を向く */
  const u=hh, ink="#08080b";
  g.fillStyle=ink; g.strokeStyle=ac; g.lineWidth=1.1;
  const eye=(x,y,r)=>{ g.save(); g.fillStyle=ac; g.shadowColor=ac; g.shadowBlur=8;
    g.beginPath(); g.ellipse(x,y,r,r*0.62,0,0,6.29); g.fill(); g.restore(); };
  const bob=Math.sin(t*2.6)*u*0.018;
  g.translate(0,bob);
  if(arch==="quad"||arch==="boar"){
    const bw=u*(arch==="boar"?0.92:0.84), bh=u*(arch==="boar"?0.42:0.36);
    g.beginPath(); g.ellipse(0,-u*0.50,bw*0.5,bh*0.5,0,0,6.29); g.fill();
    for(let i=0;i<4;i++){ const lx=-bw*0.34+i*bw*0.22;
      g.fillRect(lx,-u*0.34,u*0.075,u*0.34); }
    g.beginPath(); g.ellipse(-bw*0.52,-u*(arch==="boar"?0.52:0.62),u*0.19,u*0.16,0,0,6.29); g.fill();
    if(arch==="boar"){
      g.beginPath(); g.moveTo(-bw*0.66,-u*0.48); g.lineTo(-bw*0.80,-u*0.60); g.lineTo(-bw*0.64,-u*0.56); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-bw*0.60,-u*0.44); g.lineTo(-bw*0.74,-u*0.54); g.lineTo(-bw*0.58,-u*0.52); g.closePath(); g.fill();
    }else{
      g.beginPath(); g.moveTo(-bw*0.58,-u*0.74); g.lineTo(-bw*0.52,-u*0.90); g.lineTo(-bw*0.44,-u*0.72); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-bw*0.44,-u*0.74); g.lineTo(-bw*0.38,-u*0.88); g.lineTo(-bw*0.32,-u*0.72); g.closePath(); g.fill();
    }
    g.beginPath(); g.moveTo(bw*0.46,-u*0.56); g.quadraticCurveTo(bw*0.74,-u*0.74,bw*0.66,-u*0.34);
    g.lineTo(bw*0.52,-u*0.46); g.closePath(); g.fill();
    eye(-bw*0.58,-u*0.62,u*0.045);
  }else if(arch==="human"){
    g.fillRect(-u*0.16,-u*0.40,u*0.11,u*0.40);
    g.fillRect(u*0.04,-u*0.40,u*0.11,u*0.40);
    g.beginPath(); g.moveTo(-u*0.20,-u*0.40); g.lineTo(-u*0.15,-u*0.76);
    g.lineTo(u*0.15,-u*0.76); g.lineTo(u*0.20,-u*0.40); g.closePath(); g.fill();
    g.beginPath(); g.arc(0,-u*0.86,u*0.115,0,6.29); g.fill();
    g.save(); g.translate(-u*0.16,-u*0.70); g.rotate(-0.5+Math.sin(t*2.2)*0.06);
    g.fillRect(-u*0.05,-u*0.04,u*0.10,u*0.34);
    g.fillRect(-u*0.03,-u*0.40,u*0.06,u*0.38); g.restore();
    g.beginPath(); g.moveTo(u*0.12,-u*0.80); g.quadraticCurveTo(u*0.42,-u*0.50,u*0.20,-u*0.06);
    g.lineTo(u*0.10,-u*0.30); g.closePath(); g.fill();
    eye(-u*0.05,-u*0.87,u*0.035); eye(u*0.05,-u*0.87,u*0.035);
  }else if(arch==="swarm"){
    for(let i=0;i<6;i++){
      const px=(hrnd(i,31)-0.5)*u*0.9, py=-u*(0.30+hrnd(i,32)*0.72)+Math.sin(t*4+i)*u*0.05;
      const s=u*(0.10+hrnd(i,33)*0.07);
      g.beginPath(); g.moveTo(px,py);
      g.quadraticCurveTo(px-s*1.5,py-s*0.9+Math.sin(t*9+i)*s*0.4,px-s*2.1,py+s*0.3);
      g.quadraticCurveTo(px-s*1.1,py+s*0.2,px,py+s*0.5);
      g.quadraticCurveTo(px+s*1.1,py+s*0.2,px+s*2.1,py+s*0.3);
      g.quadraticCurveTo(px+s*1.5,py-s*0.9-Math.sin(t*9+i)*s*0.4,px,py); g.fill();
      if(i%2===0) eye(px,py+s*0.1,u*0.022);
    }
  }else if(arch==="bug"){
    for(let i=0;i<6;i++){ const sx=(i<3?-1:1), k=i%3;
      g.save(); g.translate(0,-u*0.30); g.rotate(sx*(0.5+k*0.34)+Math.sin(t*5+i)*0.07);
      g.fillRect(-u*0.02,0,u*0.045,u*0.42); g.restore(); }
    g.beginPath(); g.ellipse(u*0.10,-u*0.42,u*0.30,u*0.22,0,0,6.29); g.fill();
    g.beginPath(); g.ellipse(-u*0.24,-u*0.42,u*0.18,u*0.16,0,0,6.29); g.fill();
    g.beginPath(); g.ellipse(-u*0.46,-u*0.40,u*0.12,u*0.11,0,0,6.29); g.fill();
    g.beginPath(); g.moveTo(-u*0.54,-u*0.44); g.lineTo(-u*0.70,-u*0.54); g.lineTo(-u*0.52,-u*0.38); g.closePath(); g.fill();
    eye(-u*0.48,-u*0.44,u*0.032); eye(-u*0.44,-u*0.36,u*0.032);
  }else if(arch==="golem"){
    g.fillRect(-u*0.20,-u*0.34,u*0.15,u*0.34);
    g.fillRect(u*0.06,-u*0.34,u*0.15,u*0.34);
    g.fillRect(-u*0.28,-u*0.80,u*0.56,u*0.48);
    g.fillRect(-u*0.40,-u*0.74,u*0.13,u*0.40);
    g.fillRect(u*0.28,-u*0.74,u*0.13,u*0.40);
    g.fillRect(-u*0.15,-u*1.00,u*0.30,u*0.22);
    g.beginPath(); g.moveTo(-u*0.30,-u*0.80); g.lineTo(-u*0.44,-u*0.96); g.lineTo(-u*0.20,-u*0.86); g.closePath(); g.fill();
    eye(-u*0.06,-u*0.90,u*0.04); eye(u*0.06,-u*0.90,u*0.04);
  }else if(arch==="dragon"){
    g.beginPath(); g.moveTo(u*0.34,-u*0.44);
    g.quadraticCurveTo(u*0.80,-u*0.30,u*0.72,-u*0.02);
    g.quadraticCurveTo(u*0.60,-u*0.26,u*0.30,-u*0.34); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(0,-u*0.52,u*0.36,u*0.24,0,0,6.29); g.fill();
    g.fillRect(-u*0.22,-u*0.32,u*0.09,u*0.32);
    g.fillRect(u*0.10,-u*0.32,u*0.09,u*0.32);
    g.beginPath(); g.moveTo(-u*0.06,-u*0.70); g.quadraticCurveTo(-u*0.44,-u*0.86,-u*0.46,-u*1.04);
    g.quadraticCurveTo(-u*0.30,-u*0.80,-u*0.02,-u*0.62); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(-u*0.50,-u*1.06,u*0.15,u*0.10,-0.3,0,6.29); g.fill();
    g.beginPath(); g.moveTo(-u*0.50,-u*1.14); g.lineTo(-u*0.44,-u*1.32); g.lineTo(-u*0.38,-u*1.12); g.closePath(); g.fill();
    const wf=Math.sin(t*3.1)*u*0.10;
    g.beginPath(); g.moveTo(u*0.02,-u*0.68);
    g.lineTo(u*0.26,-u*1.16-wf); g.lineTo(u*0.48,-u*0.86-wf*0.5); g.lineTo(u*0.20,-u*0.64); g.closePath(); g.fill();
    eye(-u*0.56,-u*1.08,u*0.035);
  }else{ /* wisp */
    const fy=-u*0.66+Math.sin(t*1.9)*u*0.05;
    g.save(); g.globalAlpha=.55;
    g.beginPath(); g.moveTo(-u*0.20,fy); g.quadraticCurveTo(-u*0.04,fy+u*0.34,u*0.10+Math.sin(t*2.4)*u*0.06,fy+u*0.62);
    g.quadraticCurveTo(u*0.14,fy+u*0.30,u*0.22,fy); g.closePath(); g.fill(); g.restore();
    g.beginPath(); g.ellipse(0,fy,u*0.25,u*0.27,0,0,6.29); g.fill();
    g.save(); g.globalAlpha=.20; g.fillStyle=ac; g.shadowColor=ac; g.shadowBlur=14;
    g.beginPath(); g.arc(0,fy,u*0.30,0,6.29); g.fill(); g.restore();
    eye(-u*0.09,fy-u*0.03,u*0.04); eye(u*0.07,fy-u*0.03,u*0.04);
  }
}
function drawFoe(g,th,w,h,gy,t,dt){
  const F=SC.foe;
  if(!F.on) return;
  F.in=Math.min(1,F.in+dt*3.0);
  if(F.hitT>0) F.hitT-=dt;
  if(F.lunge>0) F.lunge=Math.max(0,F.lunge-dt*3.2);
  let dying=0;
  if(F.dieT>0){ F.dieT-=dt; dying=1-Math.max(0,F.dieT)/0.5; if(F.dieT<=0){ F.on=false; F.name=""; return; } }
  const hh=h*0.46*F.sc*(F.boss?1.08:1);
  const ent=1-Math.pow(1-F.in,3);
  const x=w*0.78+ (1-ent)*w*0.30 - F.lunge*w*0.10;
  g.save();
  g.globalAlpha=(1-dying)*ent;
  g.translate(x, gy+2+dying*8);
  if(dying) g.rotate(dying*0.5);
  foeShape(g,F.arch,hh,th.ac,t);
  g.restore();
  if(F.hitT>0){
    g.save(); g.globalAlpha=Math.max(0,F.hitT/0.22)*0.55; g.fillStyle="#fff";
    g.globalCompositeOperation="lighter";
    g.beginPath(); g.ellipse(x,gy-hh*0.5,hh*0.42,hh*0.5,0,0,6.29); g.fill(); g.restore();
  }
}

/* ── 主人公 ── */
function drawHero(g,w,h,gy,t,dt){
  const im=heroImg[heroKey()];
  if(!im||!im.complete||!im.naturalWidth) return;
  const H=HERO[heroKey()];
  const stand=h*0.60;
  const ch=stand*HERO_CH/HERO_STAND, cw=ch*HERO_CW/HERO_CH;
  let idx=H.idle[0], flip=false, dx=0, dy=0;
  const moving=(SC.spd>0.02);
  if(SC.fleeT>0){
    flip=true; idx=H.walk[Math.floor(t*11)%4];
    dy=-Math.abs(Math.sin(t*11*Math.PI))*2;
  }else if(SC.winT>0){
    idx=H.win; dy=-Math.abs(Math.sin(t*5))*3;
  }else if(SC.hurtT>0){
    idx=H.hurt; dx=-4*(SC.hurtT/0.42);
  }else if(SC.hitT>0){
    if(SC.hitT>0.30){ idx=H.up; dx=6*(1-(SC.hitT-0.30)/0.16); }
    else{ idx=H.hit; dx=14*Math.max(0,SC.hitT/0.30); }
  }else if(SC.restT>0){
    idx=H.rest;
  }else if(SC.foe.on){
    idx=H.idle[Math.floor(t*3)%2];
  }else if(moving){
    idx=H.walk[Math.floor(t*(6+SC.spd*4))%4];
    dy=-Math.abs(Math.sin(t*(6+SC.spd*4)*Math.PI))*1.6;
  }else{
    idx=H.idle[Math.floor(t*2)%2];
  }
  const cx=w*0.30+dx;
  g.save();
  g.globalAlpha=0.28; g.fillStyle="#000";
  g.beginPath(); g.ellipse(cx,gy+3,stand*0.20,stand*0.045,0,0,6.29); g.fill();
  g.restore();
  g.save(); g.translate(cx,gy+2+dy);
  if(flip) g.scale(-1,1);
  g.imageSmoothingEnabled=false;
  g.drawImage(im, idx*HERO_CW,0,HERO_CW,HERO_CH, -cw/2,-ch, cw,ch);
  g.restore();
}

/* ── 連れている付喪神。主人公の斜め後ろの足元を、同じ向きで付いて歩く。斬るときは前へ出る ──
   絵は左向きに描いてあるので、ふだんは左右を返して右向き（主人公と同じ向き）にする。逃げるときだけ絵のまま左向き */
const kamiImgs={};
function kamiImage(k,t){
  const key=k+":"+t;
  if(!kamiImgs[key]){ const im=new Image(); im.src=KAMI_IMG[k][t]; kamiImgs[key]=im; }
  return kamiImgs[key];
}
function drawTomo(g,w,h,gy,t){
  if(!S.tomo||!KAMIMAP[S.tomo]) return;
  const tier=kamiTier(S.tomo); if(tier<=0) return;
  const im=kamiImage(S.tomo,tier-1);
  if(!im||!im.complete||!im.naturalWidth) return;
  const K=KAMIMAP[S.tomo], stand=h*0.60, sz=stand*(0.40+tier*0.05);
  let dx=0, dy=0;
  if(SC.hitT>0) dx=stand*0.55*Math.max(0,SC.hitT/0.46);            /* 斬るときに前へ飛び出す */
  else if(SC.winT>0) dy=-Math.abs(Math.sin(t*6))*6;
  else if(SC.hurtT>0) dx=-6;
  const moving=(SC.spd>0.02);
  const bob=moving?-Math.abs(Math.sin(t*7))*2.5:Math.sin(t*2.4)*1.2;   /* 歩くときは小さく跳ね、止まると息づかい */
  const cx=w*0.30-stand*0.50+dx, cy=gy+2-sz*0.46+bob+dy;              /* 足元を地面に置く */
  g.save();
  g.globalAlpha=0.24; g.fillStyle="#000";
  g.beginPath(); g.ellipse(cx,gy+3,sz*0.30,stand*0.035,0,0,6.29); g.fill();
  g.restore();
  g.save();
  g.globalAlpha=0.94;
  g.shadowColor=K.c; g.shadowBlur=8+3*Math.sin(t*3);
  g.imageSmoothingEnabled=true;
  if(SC.fleeT>0){ g.drawImage(im,cx-sz/2,cy-sz/2,sz,sz); }           /* 逃げるときは絵のまま左向き */
  else{ g.translate(cx,0); g.scale(-1,1); g.drawImage(im,-sz/2,cy-sz/2,sz,sz); }
  g.restore();
}

/* ── 毎フレーム ── */
function scnDraw(dt){
  if(!SC.ready||!SC.wrap||SC.wrap.style.display==="none") return;
  const R=S.run; if(!R) return;
  const g=SC.g, w=SC.w, h=SC.h;
  if(!w||!h) return;
  const th=SCENERY[SC.area]||SCENERY.mori;
  SC.t+=dt;
  const t=SC.t;
  /* 進み具合 */
  let want=0;
  if(SC.fleeT>0) want=1.25;
  else if(SC.winT>0||SC.hurtT>0||SC.hitT>0||SC.foe.on||SC.restT>0) want=0;
  else if(R.phase==="move") want=1.0;
  else if(R.phase==="fin") want=0;
  else want=0.34;
  SC.spd+=(want-SC.spd)*Math.min(1,dt*4.5);
  SC.scroll+=SC.spd*96*dt*(SC.fleeT>0?-1:1);
  if(SC.hitT>0){
    const p=SC.hitT;
    SC.hitT-=dt;
    if(p>0.30&&SC.hitT<=0.30){
      const gy=h*0.80;
      spark(w*0.30+h*0.30, gy-h*0.30, SC.crit?16:8, SC.crit?"#ffd166":"#ffb060", SC.crit?1.25:1);
      scnFoeHit();
    }
  }
  if(SC.hurtT>0) SC.hurtT-=dt;
  if(SC.winT>0)  SC.winT-=dt;
  if(SC.fleeT>0) SC.fleeT-=dt;
  if(SC.restT>0) SC.restT-=dt;
  if(SC.shake>0) SC.shake=Math.max(0,SC.shake-dt*3.4);
  if(SC.flash>0) SC.flash=Math.max(0,SC.flash-dt*3.0);

  g.setTransform(SC.dpr,0,0,SC.dpr,0,0);
  g.clearRect(0,0,w,h);
  const sx=SC.shake>0?(Math.random()-0.5)*6*SC.shake:0;
  const sy=SC.shake>0?(Math.random()-0.5)*4*SC.shake:0;
  g.save(); g.translate(sx,sy);
  const gy=Math.round(h*0.80);
  drawBack(g,th,w,h,gy);
  drawMotes(g,th,w,h,dt);
  drawFoe(g,th,w,h,gy,t,dt);
  drawTomo(g,w,h,gy,t);
  drawHero(g,w,h,gy,t,dt);
  /* 火花 */
  for(let i=SC.fx.length-1;i>=0;i--){
    const p=SC.fx[i];
    p.l-=dt; if(p.l<=0){ SC.fx.splice(i,1); continue; }
    p.vy+=340*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    g.globalAlpha=Math.max(0,p.l/p.m); g.fillStyle=p.c;
    g.fillRect(p.x,p.y,p.s,p.s);
  }
  g.globalAlpha=1;
  g.restore();
  if(SC.flash>0){
    g.globalAlpha=SC.flash*0.30; g.fillStyle="#e0564a"; g.fillRect(0,0,w,h); g.globalAlpha=1;
  }
  /* 上下の締め */
  const vg=g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0,"rgba(0,0,0,.42)"); vg.addColorStop(.25,"rgba(0,0,0,0)");
  vg.addColorStop(.85,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.42)");
  g.fillStyle=vg; g.fillRect(0,0,w,h);
}

/* ── 鍛冶場に立つ姿 ──

/* ══════════ 難度・根付・銘 ══════════
   狩場は増やさず、同じ七つに四段の難度を重ねる。
   既存の S.clears（狩場ごとの通算踏破・次の狩場の解禁に使う）はそのまま残し、
   段ごとの回数は S.clearsD に別で積む。控えの版を上げずに済ませるための作り。 */
/* 段の倍率。走り一回にかかる体力は おおよそ「敵HP × 敵攻撃 × 敵防御による長引き」で決まるので、
   攻撃を強く掛けると終盤で詰む。厚みはHPに寄せ、攻撃は控えめに伸ばしてある。
   体力の要り（skip）と素材（mat）を同じ倍率にしてあるので、
   体力あたりの素材効率は段が変わっても同じ。上の段に行く見返りは、金と落とし物。 */
const DIFFS=[
  {id:"n",n:"通常",c:"#9a8d80",need:0, rank:0, hp:1.0,atk:1.00,def:1.00,gold:1.0,mat:1.0,skip:1.0,exp:1.0,acc:0,   mei:0},
  {id:"k",n:"危険",c:"#ffd166",need:20,rank:5, hp:1.9,atk:1.18,def:1.20,gold:2.0,mat:1.7,skip:1.7,exp:1.4,acc:0.38,mei:0},
  {id:"a",n:"悪夢",c:"#c08bff",need:20,rank:9, hp:3.2,atk:1.36,def:1.36,gold:3.8,mat:2.7,skip:2.7,exp:1.9,acc:0.60,mei:2},
  {id:"j",n:"地獄",c:"#e0564a",need:20,rank:15,hp:4.6,atk:1.52,def:1.45,gold:6.5,mat:4.2,skip:4.2,exp:2.5,acc:0.85,mei:4}
];
/* 同じ狩場・同じ段を踏破した回数で、できることが増えていく */
const CLEAR_STEPS={speed2:5, speed4:10, skip:15, next:20};
/* 危険より上の段は、いちばん先まで開いた狩場より二つ手前までの狩場でしか選べない */
const HARD_BEHIND=2;
/* 最後の二つの狩場は「その先」がない。天穹を20度踏破するか、神殿の注文を一件納めたら、その先が開いたとみなす */
function beyondEnd(){ const last=AREAS[AREAS.length-1]; return clearsD(last.id,0)>=CLEAR_STEPS.next||(S.stats.temple||0)>0; }
function furthestIdx(){ let i=0; AREAS.forEach((a,n)=>{ if(areaOpen(a)) i=n; }); if(i===AREAS.length-1&&beyondEnd()) i+=HARD_BEHIND; return i; }
function hardAllowed(a){ return AREAS.indexOf(a)<=furthestIdx()-HARD_BEHIND; }
function hardAllowText(a){
  const n=AREAS.indexOf(a)+HARD_BEHIND, last=AREAS[AREAS.length-1];
  if(n>AREAS.length-1) return last.n+"を通常で"+CLEAR_STEPS.next+"度踏破するか、神殿の注文を一件納めると、この狩場の上の段を選べる";
  return AREAS[n].n+"への道が開くと、この狩場の上の段を選べる";
}
/* 通常の踏破回数。段の仕組みができる前の踏破も数に入れる */
function clearsNormal(id){ return Math.max(clearsAt(id,0), clearsOf(id)-[1,2,3].reduce((t,i)=>t+clearsAt(id,i),0)); }
function clearsD(id,di){ return di===0?clearsNormal(id):clearsAt(id,di); }
/* 危険は最初から2倍、悪夢と地獄は最初から4倍。通常だけ踏破回数で開く */
function speedFloor(di){ return di>=2?4:(di>=1?2:1); }
function maxSpeedAt(id,di){ const c=clearsD(id,di); return Math.max(speedFloor(di), c>=CLEAR_STEPS.speed4?4:(c>=CLEAR_STEPS.speed2?2:1)); }
function skipOpen(id,di){ return clearsD(id,di)>=CLEAR_STEPS.skip; }
DIFFS.forEach((d,i)=>{ d.i=i; });
const DMAP={}; DIFFS.forEach(d=>DMAP[d.id]=d);
function curDiff(){ const i=S.diff|0; return (i>=0&&i<DIFFS.length)?i:0; }
function dScale(di){ return DIFFS[di]||DIFFS[0]; }
function clearsAt(id,di){
  const o=S.clearsD&&S.clearsD[id]; if(!o) return 0;
  return o[DIFFS[di].id]||0;
}
function bumpClearD(id,di){
  if(!S.clearsD) S.clearsD={};
  if(!S.clearsD[id]) S.clearsD[id]={};
  const k=DIFFS[di].id;
  S.clearsD[id][k]=(S.clearsD[id][k]||0)+1;
}
function diffOpen(a,di){
  if(!areaOpen(a)) return false;
  if(di<=0) return true;
  if(!hardAllowed(a)) return false;
  const D=DIFFS[di];
  if(S.rank<D.rank) return false;
  return clearsD(a.id,di-1)>=D.need;
}
function diffLockText(a,di){
  if(!areaOpen(a)) return areaLockText(a);
  if(!hardAllowed(a)) return hardAllowText(a);
  const D=DIFFS[di], t=[];
  if(S.rank<D.rank) t.push("鍛冶の腕 "+rankName(D.rank));
  const c=clearsD(a.id,di-1);
  if(c<D.need) t.push(DIFFS[di-1].n+"で"+D.need+"度踏破（いま"+c+"度）");
  return t.join("　と　")+" で踏み込める";
}
/* 再鍛造と刻銘は、どこかの狩場で悪夢が開いてから */
function nightmareOpen(){ return AREAS.some(a=>diffOpen(a,SHINPIN_DIFF)); }
/* どこかの狩場で危険が開いているか。根付はそこから落ちるので、根付まわりの支度はこれで出し分ける */
function hardOpenAny(){ return AREAS.some(a=>diffOpen(a,1)); }
function nightmareLockHtml(what){
  return '<div class="card"><div class="ttl">'+what+'はまだ使えません</div>'+
    '<div class="mini" style="margin-top:4px">どこかの狩場で <b style="color:'+DIFFS[SHINPIN_DIFF].c+'">'+DIFFS[SHINPIN_DIFF].n+'</b> の段が開くと使えるようになります。'+
    '悪夢は、その狩場の危険を '+CLEAR_STEPS.next+' 度踏破し、鍛冶の腕が '+rankName(DIFFS[SHINPIN_DIFF].rank)+' に届くと開きます。</div></div>';
}
const skipCost=(a,di)=>Math.max(1,Math.round(a.skip*dScale(di).skip));
/* 悪夢から先は、主武器と副武器が神品でないと踏み込めない。大剣は両手持ちなので主だけで可。
   出来栄えだけを見る（鍛え直しや銘は問わない） */
const SHINPIN_DIFF=2;
function needShinpin(di){ return (di|0)>=SHINPIN_DIFF; }
function shinpinOK(){
  const e=equipped();
  if(!e.main||gradeIdx(e.main.q)<SHIN_GI) return false;
  if(RMAP[e.main.id].k==="great") return true;
  return !!(e.sub&&gradeIdx(e.sub.q)>=SHIN_GI);
}
const SHINPIN_TEXT="主武器と副武器を神品に（大剣は主だけ）";
/* 段が開いた瞬間に一度だけ報せる */
function noticeDiff(id){
  const a=AMAP[id]; if(!a) return;
  if(!S.openedD) S.openedD={};
  for(let i=1;i<DIFFS.length;i++){
    const key=id+":"+DIFFS[i].id;
    if(diffOpen(a,i)&&!S.openedD[key]){
      S.openedD[key]=true;
      toast("<b class='hot'>"+a.n+"・"+DIFFS[i].n+"</b> へ踏み込めるようになった。","#ffd166");
    }
  }
}

/* ── 根付（身につける小物）──
   危険以上の主だけが落とす。等級は武器と同じ6段を使い回し、
   効く量は「基本値 × 等級の倍率」。種類は10で固定してある（無限に増やすと倉庫が破綻するため） */
const ACCS=[

  {id:"iwamori", n:"岩守の根付",     ef:"cut",   per:0.020, d:"受ける害が減る"},
  {id:"idaten",  n:"韋駄天の根付",   ef:"dash",  per:0.070, d:"ひと目多く進むことがある"},
  {id:"mekiki",  n:"目利きの根付",   ef:"loot",  per:0.400, d:"鉱脈の持ち帰りが増える"},
  {id:"fukuzu",  n:"福槌の根付",     ef:"goldp", per:0.055, d:"拾う金が増える"},
  {id:"shiranui",n:"不知火の根付",   ef:"crit",  per:0.016, d:"会心が出やすい"},
  {id:"kagenui", n:"影縫いの根付",   ef:"dodge", per:0.026, d:"罠を避けやすい"},
  {id:"tsuio",   n:"追尾の根付",     ef:"chase", per:0.022, d:"追撃が出やすい"},
  {id:"hagane",  n:"鋼胃の根付",     ef:"stam",  per:9,     d:"体力の上限が伸びる"},
  {id:"kudashi", n:"神降ろしの根付", ef:"kami",  per:0.065, d:"付喪神の加護が強まる"}
];
const ACCMAP={}; ACCS.forEach(x=>ACCMAP[x.id]=x);
const ACC_EF={atkp:"攻撃",cut:"被害軽減",dash:"疾走",loot:"持ち帰り",goldp:"拾う金",
  crit:"会心",dodge:"罠回避",chase:"追撃",stam:"体力上限",kami:"加護"};
const accGi=x=>Math.min(SHIN_GI,gradeIdx(x.q));   /* 根付は神品まで。真・神品は武器だけ */
const accGrade=x=>GRADES[accGi(x)];
const accMult=x=>GRADES[accGi(x)].mult;
function accVal(x){ const A=ACCMAP[x.id]; return A?A.per*accMult(x):0; }
function accText(x){
  const A=ACCMAP[x.id]; if(!A) return "";
  const v=accVal(x);
  if(A.ef==="stam") return "体力上限 +"+Math.round(v);
  if(A.ef==="loot") return "持ち帰り +"+(Math.round(v*10)/10);
  return ACC_EF[A.ef]+" +"+(Math.round(v*1000)/10)+"%";
}
function accWorn(){
  const f=u=>u?(S.acc.find(z=>z.uid===u)||null):null;
  return [f(S.accEq.a),f(S.accEq.b)];
}
function accBonus(){
  const o={atkp:0,cut:0,dash:0,loot:0,goldp:0,crit:0,dodge:0,chase:0,stam:0,kami:0};
  if(!S.acc||!S.accEq) return o;
  accWorn().forEach(x=>{ if(!x) return; const A=ACCMAP[x.id]; if(!A) return; o[A.ef]+=accVal(x); });
  return o;
}
function accPrice(x){ return Math.round(260*accMult(x)*(1+S.up.merchant*0.06)); }
function rollAcc(a,di){
  const A=ACCS[Math.floor(Math.random()*ACCS.length)];
  const q=Math.max(0,Math.min(100,Math.round(10+a.ei*7+di*13+Math.random()*24)));
  return {uid:S.accUid++,id:A.id,q:q};
}
function gainAcc(x){
  if(S.acc.length>=60){ toast("根付を持ちすぎだ。倉庫で整理してくれ。","#e0645a"); return false; }
  S.acc.push(x); return true;
}
/* 拾った根付の始末。支度で「砕く」「売る」を選んでいれば、選んだ等級以下はその場で片づける。
   戻り値は道中の記録に書く文。null なら手元に入らなかった（持ちすぎ） */
function takeAcc(x){
  const A=ACCMAP[x.id], g=accGrade(x), gi=accGi(x), c=S.autoCfg;
  const name="<b class='hot'>"+A.n+"</b>（"+g.n+"）";
  let doIt=c.accDo;
  if(doIt==="alt"){ S.accAltN=(S.accAltN||0)+1; doIt=(S.accAltN%2)?"crush":"sell"; }   /* 交互：砕く→売る→砕く… */
  if(doIt==="crush"&&gi<=c.accGi){
    const n=accStone(x); S.meiStone+=n;
    return name+"を拾い、その場で砕いた　<b class='hot'>銘石 +"+n+"</b>";
  }
  if(doIt==="sell"&&gi<=c.accGi){
    const p=accPrice(x); S.gold+=p; S.stats.sold++; S.stats.earned+=p;
    return name+"を拾い、そのまま売った　<b class='hot'>+"+fmt(p)+"金</b>";
  }
  return gainAcc(x)?(name+"を拾った"):null;
}
/* 倉庫のまとめ処理。身につけているものは除く */
function accBulkList(gi){ return S.acc.filter(x=>accGi(x)<=gi&&S.accEq.a!==x.uid&&S.accEq.b!==x.uid); }
function accBulk(kind){
  const gi=S.accBulkGi, list=accBulkList(gi);
  if(!list.length){ toast("その等級以下の根付はありません。","#9a8d80"); return; }
  const stones=list.reduce((t,x)=>t+accStone(x),0), gold=list.reduce((t,x)=>t+accPrice(x),0);
  const crush=(kind==="crush");
  askConfirm(crush?"根付をまとめて砕く":"根付をまとめて売る",
    '<div class="note"><b>'+GRADES[gi].n+'以下</b>の根付 '+list.length+' 個を'+(crush?"砕いて <b>銘石</b> にします":"手放します")+'。身につけているものは含みません。戻せません。</div>'+
    (crush?('<div class="kv"><span class="dim">取れる銘石</span><span class="hot">'+stones+' 個</span></div>'+
            '<div class="kv"><span class="dim">砕いたあとの手持ち</span><span>'+(S.meiStone+stones)+' 個</span></div>')
          :('<div class="kv"><span class="dim">売値の合計</span><span class="hot">'+fmt(gold)+'金</span></div>')),
    crush?"砕く":"売る",()=>{
      const ids=new Set(list.map(x=>x.uid));
      S.acc=S.acc.filter(x=>!ids.has(x.uid));
      if(crush){ S.meiStone+=stones; toast(list.length+"個の根付を砕いた。<b class='hot'>銘石 +"+stones+"</b>","#c08bff"); }
      else{ S.gold+=gold; S.stats.sold+=list.length; S.stats.earned+=gold; toast(list.length+"個の根付を売った。<b class='hot'>+"+fmt(gold)+"金</b>","#6fd48a"); }
      render();
    });
}
const ACC_GI_CHOICES=[0,1,2,3,4,5];   /* 粗物〜大業物。神品はまとめの対象にしない */
function setAcc(slot,uid){
  if(!uid){ S.accEq[slot]=null; }
  else{
    const other=(slot==="a")?"b":"a";
    if(S.accEq[other]===uid) S.accEq[other]=null;   /* 同じものを二つ着けさせない */
    S.accEq[slot]=uid;

}
function sellAcc(uid){
  const i=S.acc.findIndex(z=>z.uid===uid); if(i<0) return;
  const x=S.acc[i], p=accPrice(x);
  askConfirm("根付を売る",

    '<div class="kv"><span class="dim">売値</span><span class="hot">'+fmt(p)+'金</span></div>',
    "売る",()=>{
      if(S.accEq.a===uid) S.accEq.a=null;
      if(S.accEq.b===uid) S.accEq.b=null;
      S.acc.splice(i,1); S.gold+=p; S.stats.sold++; S.stats.earned+=p;
      toast("根付を売った。<b class='hot'>+"+fmt(p)+"金</b>","#6fd48a"); render();
    });
}
/* 根付を砕いて銘石にする。等級が高いほど多く取れる（粗物1〜神品4） */
const ACC_STONE=[1,1,2,2,3,3,4];   /* 粗物・数打・並・業物・良業物・大業物・神品 */
function accStone(x){ return ACC_STONE[accGi(x)]||1; }
function crushAcc(uid){
  const i=S.acc.findIndex(z=>z.uid===uid); if(i<0) return;
  const x=S.acc[i], n=accStone(x);
  askConfirm("根付を砕く",
    '<div class="note">'+ACCMAP[x.id].n+'（'+accGrade(x).n+'）を砕いて <b>銘石</b> にします。戻せません。</div>'+

    "砕く",()=>{
      if(S.accEq.a===uid) S.accEq.a=null;

/* ── 銘（刀身に切る一字）──
   悪夢以上で落ちる「銘石」を使い、武器ひと振りに一つだけ切る。
   鍛え直しが「量」を伸ばすのに対し、銘は「質（効き方の種類）」を足す役。 */
const MEIS=[
  {id:"jin",  n:"迅", ef:"chase", per:0.10, s:3, d:"追撃 +10%"},
  {id:"ken",  n:"堅", ef:"cut",   per:0.08, s:3, d:"被害軽減 +8%"},
  {id:"retsu",n:"烈", ef:"atkp",  per:0.12, s:4, d:"攻撃 +12%"},
  {id:"sae",  n:"冴", ef:"crit",  per:0.10, s:4, d:"会心 +10%"},
  {id:"yu",   n:"幽", ef:"dodge", per:0.12, s:3, d:"罠回避 +12%"},
  {id:"fu",   n:"富", ef:"goldp", per:0.15, s:5, d:"拾う金 +15%"}
];
const MEIMAP={}; MEIS.forEach(x=>MEIMAP[x.id]=x);
/* 切れる銘の数。鍛え直しが +5 で二つ目、+10 で三つ目の座が開く */
const MEI_MAX=3;
function meiSlots(w){ return Math.min(MEI_MAX,1+Math.floor(wLv(w)/5)); }
function meiList(w){ return (w&&Array.isArray(w.meis))?w.meis.filter(x=>MEIMAP[x]):[]; }
function meiObjs(w){ return meiList(w).map(x=>MEIMAP[x]); }
/* 昔の呼び口。一つ目の銘だけを返す */
function meiOf(w){ const l=meiObjs(w); return l.length?l[0]:null; }
function meiCost(w){ return Math.round(sellPrice(w)*1.2)+400; }
function meiTag(w){
  return meiObjs(w).map(M=>'<span class="meitag">銘・'+M.n+'</span>').join("");
}
/* 拾う金への上乗せ。根付と、装備した武器の「富」の銘 */
function goldMul(){
  const e=equipped(); let v=accBonus().goldp;
  const f=(w,k)=>{ meiObjs(w).forEach(M=>{ if(M.ef==="goldp") v+=M.per*k; }); };
  f(e.main,1); f(e.sub,0.5);
  return 1+v;
}
function engrave(uid,mid,slot){
  const w=S.inv.find(x=>x.uid===uid), M=MEIMAP[mid];
  if(!w||!M) return;
  if(!nightmareOpen()){ toast("刻銘はどこかの狩場で悪夢が開いてから。","#e0645a"); return; }
  const n=meiSlots(w); slot=Math.max(0,Math.min(n-1,slot|0));
  const cur=meiList(w);
  if(cur.includes(mid)&&cur[slot]!==mid){ toast("同じ銘は二つ切れない。","#e0645a"); return; }
  const c=meiCost(w);
  if(S.meiStone<M.s){ toast("銘石が足りない。悪夢以上の主が落とすほか、根付を砕いても取れる。","#e0645a"); return; }
  if(S.gold<c){ toast("金が足りない。","#e0645a"); return; }
  const old=cur[slot]?MEIMAP[cur[slot]]:null;
  askConfirm("銘を切る",
    '<div class="note">'+RMAP[w.id].n+' の'+["一","二","三"][slot]+'つ目の座に <b>銘・'+M.n+'</b>（'+M.d+'）を切ります。'+
    (old?'<b class="bad">いま切ってある 銘・'+old.n+' は消えます。</b>':'')+
    '注いだ銘石と金は戻りません。</div>'+
    '<div class="kv"><span class="dim">銘石</span><span>'+M.s+' 個（手持ち '+S.meiStone+'）</span></div>'+
    '<div class="kv"><span class="dim">費用</span><span class="hot">'+fmt(c)+'金</span></div>'+
    '<div class="kv"><span class="dim">支払後の所持金</span><span>'+fmt(S.gold-c)+'金</span></div>',
    "切る",()=>{
      S.meiStone-=M.s; S.gold-=c;
      const l=meiList(w); while(l.length<=slot) l.push(null);
      l[slot]=mid;
      w.meis=l.filter(Boolean);            /* 途中の座が空いたまま並ばないよう、詰めて持つ */
      delete w.mei;
      S.stats.mei=(S.stats.mei||0)+1;
      toast("<b>"+RMAP[w.id].n+"</b> に <b class='hot'>銘・"+M.n+"</b> を切った。"+(old?"　前の銘は消えた。":""),"#ffd166");
      render();
    });
}
function viewMeiSection(){

      h+='<div class="seg" style="margin:8px 0 6px">'+Array.from({length:n},(_,i)=>{
        const M=cur[i]?MEIMAP[cur[i]]:null;
        return '<button data-act="meislot" data-n="'+i+'" class="'+(slot===i?"on":"")+'">'+["一","二","三"][i]+'　'+(M?("銘・"+M.n):"空き")+'</button>';

      h+='<div class="row wrap" style="gap:5px">'+MEIS.map(x=>{

    h+='</div>';

  return h;

   商店や精錬で止まってしまわないよう、揃った時点で鍛冶場へ引き返す */
function backForgeDone(){
  const id=S.backForge; if(!id) return false;
  const r=RMAP[id]; if(!r){ S.backForge=null; return false; }
  if(!canMake(r)) return false;
  backForgeNow();
  toast("素材が揃った。<b class='hot'>"+r.n+"</b> を打てる。","#ffd166");
  return true;
}
function backForgeNow(){
  const id=S.backForge;
  S.backForge=null; S.needMat=null; S.hl=null; S.lastBuy=null;
  S.tab="forge";
  S.ftab="forge";
  if(id&&RMAP[id]){ S.pickMode="all"; S.pickKind="all"; S.pickOpen=id; S.openGen[RMAP[id].g]=true; }
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="forge"));
  render();
}


/* ══════════ 画面 ══════════ */
const view=document.getElementById("view");
/* 2列の札の共通形。押した札だけが下に開く（探索の狩場札と同じ作り）
   mark：左の小さな印（wIcon か dotMark）　name：一行　sub：小さな添え書き */
function tileHtml(act,id,open,mark,name,sub,no){
  return '<button class="gtile'+(open?" open":"")+(no?" no":"")+'" data-act="'+act+'" data-id="'+id+'">'+mark+
    '<span class="gtx"><span class="gn">'+name+'</span><span class="gm">'+sub+'</span></span></button>';
}
/* 畳める見出し。S.fold[key] が true なら畳んである。sm は小見出し */
const folded=key=>!!(S.fold&&S.fold[key]);
function foldHead(key,title,right,sm){
  const f=folded(key);
  return '<button class="sech'+(f?" fold":"")+(sm?" sm":"")+'" data-act="fold" data-id="'+key+'">'+
    '<span class="cv">'+(f?"▶":"▼")+'</span><span>'+title+'</span>'+(right?'<span class="rc">'+right+'</span>':'')+'</button>';
}
function dotMark(c,txt){
  return '<span class="atile" style="color:'+c+'">'+(txt||('<i class="dot" style="width:16px;height:16px;color:'+c+';background:'+c+'"></i>'))+'</span>';
}
function render(){
  paintStatus();
  const map={forge:viewForge,quest:viewQuest,shop:viewShop,stock:viewStock,shopup:viewSmithy,dex:viewDex};
  view.innerHTML=(map[S.tab]||viewForge)();
  if(S.tab==="forge"){ setupCanvas(); paintPips(); }
  if(S.tab==="shopup") paintHeroPicks(view);
  paintNavBadge();
  if(S.tab==="quest"&&S.run){
    /* いまのマスを盤の真ん中へ。盤の横送りだけで、頁そのものは動かさない */
    const t=view.querySelector(".tile.now"), bd=view.querySelector("#board");
    if(t&&bd) bd.scrollLeft=Math.max(0,t.offsetLeft-bd.clientWidth/2+t.offsetWidth/2);
  }
  if(S.hl){ const el=view.querySelector(".hl"); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); }
  scnSync();
  paintTut();
  autoSave();
  autoTick();
}
/* 体力が戻ったとき、画面を作り直さずに出発・早駆けの可否だけ更新する */
function refreshQuestBtns(){
  if(S.tab!=="quest"||S.run) return;
  const di=curDiff(), sp=needShinpin(di)&&!shinpinOK();
  view.querySelectorAll('button[data-act="run"]').forEach(b=>{
    const a=AMAP[b.dataset.id]; if(!a) return;
    b.disabled=!diffOpen(a,di)||sp||(S.stamina<skipCost(a,di));
  });
  view.querySelectorAll('button[data-act="skip"],button[data-act="skipn"]').forEach(b=>{
    const a=AMAP[b.dataset.id]; if(!a) return;
    b.disabled=sp||(S.stamina<skipCost(a,di));
  });
}
function paintNavBadge(){
  const b=document.querySelector('#nav button[data-tab="shop"]'); if(!b) return;
  const o=b.querySelector(".badge"); if(o) o.remove();
  if(S.orders.some(x=>matchOrder(x).length>=x.qty)){
    const d=document.createElement("span"); d.className="badge"; b.appendChild(d);
  }
  /* 別の画面にいる間に走りが続いているときは、探索の札に青い印を出す */
  const q=document.querySelector('#nav button[data-tab="quest"]'); if(!q) return;
  const oq=q.querySelector(".badge"); if(oq) oq.remove();
  if(S.run&&S.tab!=="quest"){
    const d=document.createElement("span"); d.className="badge run"; q.appendChild(d);
  }
}

function pickTile(r,showGen){

    wIcon(r,d?gradeIdx(d.best):null,"sm")+

    (d?('<span style="color:'+grade(d.best).c+'">'+grade(d.best).n+'</span>'):'<span class="dim">未鍛造</span>')+
    '</span></span></button>';
  if(!open) return h;
  h+='<div class="card gdet"><div class="row">'+
    '<div style="flex:1;min-width:0"><div class="ttl">'+r.n+'</div>'+
    '<div class="mini">'+KNAME[r.k]+'　'+hitsOf(r)+'打　目安 '+fmt(r.base)+'金</div></div>'+
    '<button class="btn sub sm" data-act="prac" data-id="'+r.id+'" style="margin-right:6px"'+(unlocked(r)?"":" disabled")+'>稽古</button>'+
    '<button class="btn sm" data-act="forge" data-id="'+r.id+'"'+(ok?"":" disabled")+'>炉へ</button></div>'+
    '<div class="row wrap" style="margin-top:6px">'+Object.keys(r.m).map(k=>matChip(k,r.m[k])).join("")+'</div>'+
    lackBlock(r)+'</div>';
  return h;
}
function viewPickSection(){
  const mode=S.pickMode||"ready", kind=S.pickKind||"all";
  const kOk=r=>(kind==="all"||r.k===kind);
  let h='<div class="seg" style="margin-bottom:6px">'+
    [["ready","打てる型"],["all","すべて"]].map(x=>
      '<button data-act="pickmode" data-val="'+x[0]+'" class="'+(mode===x[0]?"on":"")+'">'+x[1]+'</button>').join("")+
    '</div>';
  h+='<div class="seg">'+
    '<button data-act="pickkind" data-val="all" class="'+(kind==="all"?"on":"")+'">全</button>'+
    KINDS.map(k=>'<button data-act="pickkind" data-val="'+k.id+'" class="'+(kind===k.id?"on":"")+'">'+k.n+'</button>').join("")+
    '</div>';
  if(mode==="ready"){
    const list=RECIPES.filter(r=>unlocked(r)&&canMake(r)&&kOk(r))
      .sort((a,b)=>(b.g-a.g)||(KIDX[a.k]-KIDX[b.k]));
    if(!list.length){
      h+='<div class="empty">いま打てる型がありません。<br>素材を集めるか、上の「精錬」で鋼を作ってください。</div>'+
         '<button class="btn sub sm" data-act="pickmode" data-val="all" style="width:100%;margin-top:8px">すべての型を見る</button>';
      return h;
    }
    return h+'<div class="grid2">'+list.map(pickTile).join("")+'</div>';
  }
  /* 分類で絞ったときは世代ごとに一本ずつしか残らないので、世代の見出しで畳まず一枚に並べる。
     札には世代の名を添えて、どの型か分かるようにする */
  if(kind!=="all"){
    const list=RECIPES.filter(r=>unlocked(r)&&kOk(r)).sort((a,b)=>(a.g-b.g)||(KIDX[a.k]-KIDX[b.k]));
    if(!list.length) return h+'<div class="empty">この分類で打てる型はまだありません。</div>';
    return h+'<div class="grid2">'+list.map(r=>pickTile(r,true)).join("")+'</div>';
  }
  for(let gi=1;gi<=6;gi++){
    const grp=RECIPES.filter(r=>r.g===gi&&unlocked(r)&&kOk(r)).sort((a,b)=>KIDX[a.k]-KIDX[b.k]);
    if(!grp.length) continue;
    const open=!!S.openGen[gi], ready=grp.filter(canMake).length;
    h+='<button class="grpbar'+(open?" open":"")+'" data-act="togen" data-id="'+gi+'">'+
       '<span class="cv">'+(open?"▼":"▶")+'</span>'+GENS[gi-1]+
       '<span class="rc">'+ready+'／'+grp.length+' 打てる</span></button>';
    if(open) h+='<div class="grid2" style="margin:6px 0 8px">'+grp.map(pickTile).join("")+'</div>';
  }
  const next=RECIPES.filter(r=>!unlocked(r)).sort((a,b)=>a.rank-b.rank)[0];
  if(next&&kind==="all"){
    h+='<div class="grouphead">'+GENS[next.g-1]+'</div>'+

      h+=tileHtml("shopopen",k,open,dotMark(m.c),m.n,
        fmt(m.buy)+'金　手持ち '+have(k)+(nm?('　<span class="bad">あと'+S.needMat.qty+'</span>'):''),
        S.gold<m.buy);
      if(!open) return;
      h+='<div class="card gdet'+(nm?" hl":"")+'"><div class="row"><div style="flex:1;min-width:0"><div class="ttl">'+m.n+'</div>'+
        '<div class="mini">単価 '+fmt(m.buy)+'金　手持ち '+have(k)+'個　所持金 '+fmt(S.gold)+'金</div></div></div>'+
        '<div class="row" style="gap:6px;margin-top:8px">'+[1,5,10,20].map(n=>
          '<button class="btn sub sm" data-act="buy" data-id="'+k+'" data-n="'+n+'" style="flex:1"'+(S.gold<m.buy*n?" disabled":"")+'>×'+n+'<br><span class="mini">'+fmt(m.buy*n)+'</span></button>').join("")+'</div>';
      if(nm)
        h+='<button class="btn sm" data-act="buy" data-id="'+k+'" data-n="'+S.needMat.qty+'" style="width:100%;margin-top:7px"'+(S.gold<m.buy*S.needMat.qty?" disabled":"")+'>'+

    h+='<div class="grid2">';
    keys.forEach(k=>{
      const m=MAT[k], open=(S.shopOpen===k);
      h+=tileHtml("shopopen",k,open,dotMark(m.c),m.n,'×'+have(k)+'　'+fmt(m.sell)+'金／個');
      if(!open) return;
      h+='<div class="card gdet"><div class="row"><div style="flex:1;min-width:0"><div class="ttl">'+m.n+' <span class="mini">×'+have(k)+'</span></div>'+
        '<div class="mini">引取 '+fmt(m.sell)+'金／個　全部で '+fmt(m.sell*have(k))+'金</div></div></div>'+
        '<div class="row" style="gap:6px;margin-top:8px">'+[1,10].filter(n=>n<have(k)).map(n=>
          '<button class="btn sub sm" data-act="sellmat" data-id="'+k+'" data-n="'+n+'" style="flex:1">×'+n+'</button>').join("")+
        '<button class="btn sm" data-act="sellmat" data-id="'+k+'" data-n="'+have(k)+'" style="flex:1">全部 ×'+have(k)+'</button></div>'+
        (MAT[k].alloy?'<div class="note" style="margin-top:4px">合金の引取は原価の半分です。打つ方が実入りは大きくなります。</div>':'')+'</div>';
    });
    h+='</div>';
    return h;
  }
  const T=titleOf(fame()), N=titleNext(fame());
  h+='<h2 class="sec">注文書　<span class="mini" style="float:right;color:var(--dim)">次の入れ替えまで '+fmtLeft(orderLeft())+'</span></h2>';
  h+='<div class="card"><div class="kv"><span class="dim">名声</span><span><b class="hot">'+fmt(fame())+'</b>　'+T.n+
     (N?('　<span class="mini">次の称号まで '+(N.min-fame())+'</span>'):'')+'</span></div>'+
     '<div class="kv"><span class="dim">内訳</span><span>棚 '+fameShelf()+'／'+FAME_SHELF_CAP+'　納品 '+fmt(S.fameOrd||0)+'</span></div>'+
     '<div class="row wrap" style="margin-top:6px">'+ORDER_RANKS.map(R=>'<span class="tag" style="'+(fame()>=R.fame?('color:'+R.c+';border-color:'+R.c):'')+'">'+R.n+(fame()>=R.fame?'':'　名声'+R.fame+'〜')+'</span>').join("")+'</div>'+
     '<div class="note" style="margin-top:6px">札は'+ORDER_SLOTS+'枚、0時を起点に'+ORDER_HOURS+'時間ごと（0時・8時・16時）に板ごと入れ替わります。納めた札は空きになり、次の入れ替えまで埋まりません。'+
     '名声が上がるほど上の格の注文が混ざり、金のほかに銘石・根付・稀な石・神威がつきます。</div></div>';
  if(!S.orders.length) h+='<div class="empty">いまは注文がありません。<br>次の入れ替えまで '+fmtLeft(orderLeft())+'</div>';
  S.orders.forEach(o=>{
    const r=RMAP[o.id], gi=gradeIdx(o.minQ), g=GRADES[gi], R=ORMAP[o.rank]||ORDER_RANKS[0];
    const cnt=matchOrder(o).length, ok=cnt>=o.qty, rw=orderRewardText(o);
    h+='<div class="card" style="border-left:3px solid '+R.c+'"><div class="row">'+wIcon(r,gi)+
      '<div style="flex:1;min-width:0"><div class="row" style="gap:4px;margin-bottom:1px"><span class="tag" style="color:'+R.c+';border-color:'+R.c+'">'+R.n+'</span>'+
      '<span class="tag">'+KNAME[r.k]+'</span></div>'+
      '<div class="ttl">'+r.n+' ×'+o.qty+'</div>'+
      '<div class="mini"><span style="color:'+g.c+'">'+g.n+'</span> 以上　手持ち '+cnt+'／'+o.qty+'</div></div>'+
      '<div class="center" style="width:80px"><div class="ttl hot">'+fmt(o.gold)+'</div><div class="mini">金 ＋腕前'+o.exp+'</div></div></div>'+
      '<div class="row wrap" style="margin-top:6px">'+rw.slice(1).map(x=>'<span class="skl">'+x+'</span>').join("")+'</div>'+
      '<div class="row" style="margin-top:8px;gap:6px">'+
      '<button class="btn sm" data-act="deliver" data-id="'+o.oid+'"'+(ok?"":" disabled")+' style="flex:1">納品する</button>'+
      (ok?"":'<button class="btn sub sm" data-act="chain" data-id="'+o.oid+'" style="flex:1">あと'+(o.qty-cnt)+'本を続けて打つ</button>')+'</div>'+
      '</div>';
  });
  for(let i=S.orders.length;i<ORDER_SLOTS;i++) h+='<div class="card" style="opacity:.5;border-style:dashed"><div class="mini center">空き　次の入れ替えで届きます</div></div>';
  return h;
}

/* ── 鍛え直し（鍛冶タブの一節） ── */
function enhList(){
  let l=S.inv.slice();
  if(S.enhKind!=="all") l=l.filter(w=>RMAP[w.id].k===S.enhKind);
  l.sort((a,b)=>{
    const ea=isEquipped(a.uid)?1:0, eb=isEquipped(b.uid)?1:0;
    return eb-ea || wPower(b)-wPower(a);
  });
  return l;
}
function viewEnhSection(){
  const all=S.inv.filter(w=>wLv(w)<ENH_MAX&&canEnh(w)).length;
  let h='<h2 class="sec" id="enhSec">再鍛造　<span class="mini" style="float:right;color:var(--dim)">'+all+' 本 鍛えられる</span></h2>';
  h+='<div class="note" style="margin:0 0 8px">一度打った武器は、金とその世代の鋼を注いで鍛え直せます。'+
     '一段につき等級の倍率が <b>7%</b> 伸び、力・特殊効果・売値のすべてに効きます。'+
     '等級そのものは変わりません（神品は神品のまま）。<b>十段</b>まで。'+
     '費用は必ずその時点の売値を上回るので、鍛えてから売っても得はしません。</div>';
  h+='<div class="seg"><button data-ekind="all" class="'+(S.enhKind==="all"?"on":"")+'">すべて</button>'+
     KINDS.map(k=>'<button data-ekind="'+k.id+'" class="'+(S.enhKind===k.id?"on":"")+'">'+k.s+'</button>').join("")+'</div>';
  const list=enhList();
  if(!list.length){ return h+'<div class="empty">鍛えられる武器がありません。<br>まずは一本打ってきてください。</div>'; }
  const show=list.slice(0,16);
  h+='<div class="grid2">';
  show.forEach(w=>{
    const r=RMAP[w.id], gi=gradeIdx(w.q), g=GRADES[gi], lv=wLv(w), mx=lv>=ENH_MAX, open=(S.enhOpen===w.uid);
    const mk=enhMatKey(w), mn=enhMatNum(w), c=enhCost(w);
    const where=isEquipped(w.uid)?'装備中':(S.shown.includes(w.uid)?'飾り棚':"");
    h+=tileHtml("enhopen",w.uid,open,wIcon(r,gi,"sm"),r.n+(lv?('　+'+lv):''),
      '<span style="color:'+g.c+'">'+g.n+'</span>　力 '+wPower(w)+(where?('　'+where):'')+(mx?'　極':''),
      !mx&&!canEnh(w));
    if(!open) return;
    h+='<div class="card gdet"><div class="row">'+wIcon(r,gi)+
      '<div style="flex:1;min-width:0"><div class="ttl">'+r.n+enhTag(w)+meiTag(w)+'</div>'+
      '<div class="mini"><span class="grade" style="color:'+g.c+'">'+g.n+'</span>　'+KNAME[r.k]+'　力 <b class="hot">'+wPower(w)+'</b>　売値 '+fmt(sellPrice(w))+'金</div></div>'+
      (mx?'<span class="tag">極</span>':
        '<button class="btn sm" data-act="enh" data-id="'+w.uid+'"'+(canEnh(w)?"":" disabled")+'>+'+(lv+1)+' へ</button>')+
      '</div>';
    if(!mx){
      h+='<div class="row wrap" style="margin-top:6px">'+
        '<span class="mat'+(S.gold<c?" short":"")+'">費用 '+fmt(c)+'金</span>'+matChip(mk,mn)+'</div>';
      h+='<div class="note" style="margin-top:4px">銘の座は +5 で二つ目、+10 で三つ目が開きます。</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  if(list.length>show.length)
    h+='<div class="note">力の強い順に'+show.length+'本まで出しています（全'+list.length+'本）。分類で絞り込めます。</div>';
  return h;
}

function comboRow(label,got,total,color,effect){
  const done=got===total;
  return '<div class="combo'+(done?" done":"")+'">'+
    '<span style="width:86px;color:'+color+'">'+label+'</span>'+
    '<span class="pb"><i style="width:'+(got/total*100)+'%;background:'+color+'"></i></span>'+
    '<span class="st">'+got+'／'+total+'</span></div>'+
    (done?'<div class="mini" style="margin:-2px 0 6px 86px;color:'+color+'">'+effect+'</div>':'');
}
